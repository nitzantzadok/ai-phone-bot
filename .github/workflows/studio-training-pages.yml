# פרסום אוטומטי של מסך המאמן ל-GitHub Pages.
#
# הקובץ נוגע אך ורק בתיקיית studio-training ואינו משפיע על שום פרויקט אחר בריפו.
# כדי להפעיל: Settings → Pages → Source: GitHub Actions. משם זה אוטומטי בכל דחיפה.
name: studio-training · Pages

on:
  push:
    # גם ענף הפיתוח, כדי שאפשר יהיה לפרסם בלי למזג קודם ל-main
    branches: [main, 'claude/studio-workout-program-system-jxviy3']
    paths: ['studio-training/**']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: studio-training-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: בדיקות
        working-directory: studio-training
        run: node --test tests/*.test.js

      - name: בנייה
        working-directory: studio-training
        run: |
          node build.mjs
          mkdir -p _site
          cp dist/artifact.html _site/index.html
          # דף 404 שמחזיר לאותה אפליקציה, כדי שקישור שגוי לא יוביל למסך ריק
          cp dist/artifact.html _site/404.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: studio-training/_site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
