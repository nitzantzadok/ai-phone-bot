/** הערות שהמאמן כתב על תרגיל מסוים. */
function exerciseNotes(exerciseId) {
  const t = traineeById(state.program?.traineeId);
  return (t?.notesLog || []).filter((n) => n.scope === 'exercise' && n.exerciseId === exerciseId);
}

/* ==================================================================
   מדידות: כרטיס ניהול + ריבוי גרפים קטנים.
   כל מדד בגרף נפרד עם סקאלה משלו — ק״ג, אחוזים וסנטימטרים לא חולקים ציר.
   ================================================================== */

/** גרף קו קטן למדד אחד. SVG טהור, בלי תלויות, עובד גם בהדפסה. */
function metricChart(s) {
  const W = 320, H = 96, PAD_X = 10, PAD_TOP = 14, PAD_BOTTOM = 18;
  const pts = s.points;

  // סקאלה: תמיד עם שוליים, וגם כשכל הערכים זהים
  const lo = Math.min(...pts.map((p) => p.value));
  const hi = Math.max(...pts.map((p) => p.value));
  const pad = (hi - lo) === 0 ? Math.max(1, hi * 0.05) : (hi - lo) * 0.15;
  const yMin = lo - pad, yMax = hi + pad;

  const x = (i) => (pts.length === 1
    ? W / 2
    : PAD_X + (i / (pts.length - 1)) * (W - PAD_X * 2));
  const y = (v) => PAD_TOP + (1 - (v - yMin) / (yMax - yMin)) * (H - PAD_TOP - PAD_BOTTOM);

  const line = pts.map((p, i) => `${i ? 'L' : 'M'}${x(i).toFixed(1)},${y(p.value).toFixed(1)}`).join('');
  const area = pts.length > 1
    ? `${line}L${x(pts.length - 1).toFixed(1)},${H - PAD_BOTTOM}L${x(0).toFixed(1)},${H - PAD_BOTTOM}Z`
    : '';

  const fmtDate = (d) => new Date(d).toLocaleDateString('he-IL', { day: 'numeric', month: 'numeric' });
  const dir = s.delta === 0 ? 'flat' : s.delta > 0 ? 'up' : 'down';
  const arrow = { up: '▲', down: '▼', flat: '■' }[dir];
  const favor = s.goodDirection === 'context' || s.delta === 0
    ? 'neutral' : ((s.goodDirection === 'down') === (s.delta < 0) ? 'good' : 'bad');

  return `<figure class="chart">
    <figcaption>
      <span class="ctitle">${esc(s.label)}</span>
      <span class="cnow mono">${s.last}<small> ${esc(s.unit)}</small></span>
      <span class="cdelta ${favor}">${arrow} ${s.delta > 0 ? '+' : ''}${s.delta} ${esc(s.unit)}</span>
    </figcaption>
    <svg viewBox="0 0 ${W} ${H}" role="img"
         aria-label="${esc(s.label)}: מ-${s.first} ל-${s.last} ${esc(s.unit)} על פני ${pts.length} מדידות">
      <line class="cgrid" x1="${PAD_X}" y1="${H - PAD_BOTTOM}" x2="${W - PAD_X}" y2="${H - PAD_BOTTOM}"></line>
      ${area ? `<path class="carea" d="${area}"></path>` : ''}
      ${pts.length > 1 ? `<path class="cline" pathLength="1" d="${line}"></path>` : ''}
      ${pts.map((p, i) => `<g class="cpt">
        <circle class="cdot ${i === pts.length - 1 ? 'last' : ''}" cx="${x(i).toFixed(1)}" cy="${y(p.value).toFixed(1)}" r="${i === pts.length - 1 ? 4 : 3}"></circle>
        <circle class="chit" cx="${x(i).toFixed(1)}" cy="${y(p.value).toFixed(1)}" r="12">
          <title>${fmtDate(p.date)} — ${p.value} ${esc(s.unit)}</title>
        </circle>
      </g>`).join('')}
      <text class="clabel" x="${PAD_X}" y="${H - 5}">${fmtDate(pts[0].date)}</text>
      ${pts.length > 1 ? `<text class="clabel end" x="${W - PAD_X}" y="${H - 5}">${fmtDate(pts[pts.length - 1].date)}</text>` : ''}
    </svg>
  </figure>`;
}

/** כרטיס המדידות: היסטוריה, גרפים, טופס הוספה. */
function measurementsCard(p) {
  const t = traineeById(p.traineeId);
  const list = sortMeasurements(t?.measurements || []);
  const charts = allSeries(list);
  const sum = summary(list);

  return `<div class="card">
    <p class="eyebrow">מדידות ומעקב</p>
    <p class="hint">היקפים ואחוז שומן לפי תאריך. המשקל מהמדידה האחרונה הוא זה שמשמש
      לחישוב משקלי העבודה, כך שהתכנית מתעדכנת מעצמה ככל שהמתאמן משתנה.</p>

    ${charts.length ? `<div class="charts drawin">${charts.map(metricChart).join('')}</div>`
      : '<p class="empty">אין עדיין מדידות. אחרי מדידה שנייה יופיע גרף התקדמות לכל מדד.</p>'}

    ${list.length ? `<details class="optional" style="margin-top:.7rem"><summary>טבלת המדידות (${sum.count})</summary>
      <div style="overflow-x:auto"><table>
        <thead><tr><th>תאריך</th>${METRICS.map((m) => `<th>${esc(m.label)}</th>`).join('')}<th></th></tr></thead>
        <tbody>${[...list].reverse().map((m) => `<tr>
          <td class="mono">${new Date(m.date).toLocaleDateString('he-IL')}</td>
          ${METRICS.map((mt) => `<td class="num">${metricValue(m, mt.key) ?? '—'}</td>`).join('')}
          <td><button data-meas-del="${esc(m.id)}" title="מחק מדידה">✕</button></td>
        </tr>`).join('')}</tbody>
      </table></div>
      ${list.some((m) => m.notes) ? `<ul class="cues">${list.filter((m) => m.notes).map((m) => `<li>${new Date(m.date).toLocaleDateString('he-IL')}: ${esc(m.notes)}</li>`).join('')}</ul>` : ''}
    </details>` : ''}

    <details class="optional" id="measFormWrap" style="margin-top:.6rem">
      <summary>הוספת מדידה</summary>
      <form id="measForm">
        <div class="fields">
          <label class="f"><span class="req">תאריך</span><input name="date" type="date" required value="${new Date().toISOString().slice(0, 10)}"></label>
          <label class="f"><span>משקל (ק״ג)</span><input name="weightKg" type="number" step="0.1" min="20" max="300"></label>
          <label class="f"><span>אחוז שומן</span><input name="bodyFatPct" type="number" step="0.1" min="3" max="70"></label>
        </div>
        <div class="fields" style="margin-top:.5rem">
          ${METRICS.filter((m) => !['weightKg', 'bodyFatPct'].includes(m.key)).map((m) => `
            <label class="f"><span>${esc(m.label)} (ס״מ)</span>
              <input name="${m.key}" type="number" step="0.1" min="10" max="250"></label>`).join('')}
        </div>
        <label class="f" style="margin-top:.5rem"><span>הערה למדידה</span>
          <input name="notes" placeholder="לדוגמה: נמדד בבוקר לפני אימון"></label>
        <div class="row" style="margin-top:.6rem">
          <button class="primary" type="submit">שמור מדידה</button>
          <span class="hint">שדות ריקים פשוט לא נשמרים — אפשר למדוד רק חלק.</span>
        </div>
      </form>
    </details>
  </div>`;
}

async function onMeasurementSubmit(e) {
  e.preventDefault();
  const f = new FormData(e.target);
  const raw = traineeById(state.program.traineeId);
  const entry = normalizeMeasurement(Object.fromEntries(f.entries()));

  const hasValue = entry.weightKg != null || entry.bodyFatPct != null || Object.keys(entry.girths).length;
  if (!hasValue) { log('המדידה לא נשמרה', 'לא הוזן אף ערך.'); return; }

  raw.measurements = sortMeasurements([...(raw.measurements || []).filter((m) => m.date !== entry.date), entry]);
  if (entry.weightKg) raw.weightKg = entry.weightKg;
  if (entry.bodyFatPct) raw.bodyFatPct = entry.bodyFatPct;
  await store.updateTrainee(raw);
  e.target.reset();
  $('#measFormWrap').open = false;
  generate();

  const s = summary(raw.measurements);
  log('מדידה נשמרה', [
    `${new Date(entry.date).toLocaleDateString('he-IL')} — ${s.count} מדידות בסך הכול.`,
    ...s.metrics.filter((x) => x.delta !== 0).slice(0, 4)
      .map((x) => `${esc(x.label)}: ${x.delta > 0 ? '+' : ''}${x.delta} ${esc(x.unit)} מאז המדידה הראשונה`),
    entry.weightKg ? 'משקלי העבודה חושבו מחדש לפי המשקל המעודכן.' : '',
  ]);
}

async function onMeasurementDelete(id) {
  const raw = traineeById(state.program.traineeId);
  const m = (raw.measurements || []).find((x) => x.id === id);
  if (!m || !confirm(`למחוק את המדידה מתאריך ${new Date(m.date).toLocaleDateString('he-IL')}?`)) return;
  raw.measurements = (raw.measurements || []).filter((x) => x.id !== id);
  const last = latest(raw.measurements);
  if (last?.weightKg) raw.weightKg = last.weightKg;
  await store.updateTrainee(raw);
  generate();
  log('מדידה נמחקה', new Date(m.date).toLocaleDateString('he-IL'));
}

/** כרטיס יומן ההערות של המתאמן. */
function notesCard(p) {
  const t = traineeById(p.traineeId);
  const notes = (t?.notesLog || []).filter((n) => n.scope !== 'exercise');
  const effects = Object.fromEntries((p.noteEffects || []).map((e) => [e.noteId, e.effect]));

  return `<div class="card">
    <p class="eyebrow">יומן המאמן</p>
    <p class="hint">כל מה שקורה באימון וצריך להשפיע על התכנית. הערה יכולה לשאת הנחיה —
      ואז המערכת מבצעת אותה בפועל. אפשר לערוך, להשבית או למחוק בכל רגע.</p>
    ${notes.length ? notes.map((n) => `<div class="notecard ${n.active ? '' : 'off'}">
      <div class="row" style="align-items:flex-start">
        <div class="grow">
          <div>${esc(n.text)}</div>
          <div class="role">${new Date(n.at).toLocaleDateString('he-IL')}${n.author ? ` · ${esc(n.author)}` : ''}</div>
          ${n.directive.type !== 'none'
            ? `<span class="chip ${n.active ? 'key' : ''}">${esc(DIRECTIVES[n.directive.type].label)}${n.directive.value ? `: ${esc(directiveValueLabel(n.directive))}` : ''}</span>`
            : '<span class="chip">הערה בלבד</span>'}
          ${n.active && effects[n.id] ? `<p class="loadnote">${esc(effects[n.id])}</p>` : ''}
        </div>
        <button data-note-toggle="${esc(n.id)}">${n.active ? 'השבת' : 'הפעל'}</button>
        <button data-note-edit="${esc(n.id)}">ערוך</button>
        <button data-note-del="${esc(n.id)}">מחק</button>
      </div>
    </div>`).join('') : '<p class="empty">אין עדיין הערות.</p>'}

    <details class="optional" id="noteFormWrap" style="margin-top:.7rem">
      <summary>הוספת הערה</summary>
      <form id="noteForm">
        <input type="hidden" name="id">
        <label class="f"><span class="req">מה קרה</span>
          <textarea name="text" required placeholder="לדוגמה: התלונן על הכתף רק בלחיצה מעל הראש; מגיע שחוק בימי שני; ביקש יותר עבודת ישבן"></textarea></label>
        <div class="fields" style="margin-top:.6rem">
          <label class="f"><span>מה לעשות עם זה</span>
            <select name="directiveType" id="dirType">
              ${Object.entries(DIRECTIVES).map(([k, v]) => `<option value="${k}">${esc(v.label)}</option>`).join('')}
            </select></label>
          <label class="f" id="dirValueWrap" hidden><span id="dirValueLabel">ערך</span>
            <span id="dirValueField"></span></label>
          <label class="f"><span>נכתב על ידי</span><input name="author" placeholder="שם המאמן"></label>
        </div>
        <div class="row" style="margin-top:.6rem">
          <button class="primary" type="submit">שמור הערה</button>
          <button type="button" id="noteCancel">בטל</button>
        </div>
      </form>
    </details>
  </div>`;
}

function directiveValueLabel(d) {
  const v = d.value;
  switch (DIRECTIVES[d.type]?.needs) {
    case 'exercise': { try { return getExercise(v).name; } catch { return v; } }
    case 'muscle': return muscleLabel(v);
    case 'pattern': return patternLabel(v);
    case 'equipment': return EQUIPMENT_LABELS[v] || v;
    case 'joint': return jointLabelHe(v);
    case 'percent': return `${v}%`;
    case 'minutes': return `${v} דק׳`;
    default: return v ?? '';
  }
}

const JOINTS_HE = { shoulder: 'כתף', lumbar: 'גב תחתון', knee: 'ברך', elbow: 'מרפק',
  wrist: 'שורש כף יד', hip: 'ירך', ankle: 'קרסול', neck: 'צוואר' };
const jointLabelHe = (j) => JOINTS_HE[j] || j;

/** שדה הערך משתנה לפי סוג ההנחיה שנבחרה. */
function renderDirectiveValue(type, current = '') {
  const needs = DIRECTIVES[type]?.needs;
  const wrap = $('#dirValueWrap');
  const field = $('#dirValueField');
  const labelEl = $('#dirValueLabel');
  if (!needs) { wrap.hidden = true; field.innerHTML = ''; return; }
  wrap.hidden = false;

  const opts = {
    exercise: () => ({ label: 'תרגיל', html: `<select name="directiveValue">${EXERCISES.map((x) => `<option value="${x.id}">${esc(x.name)}</option>`).join('')}</select>` }),
    muscle: () => ({ label: 'שריר', html: `<select name="directiveValue">${MUSCLES.map((m) => `<option value="${m}">${esc(muscleLabel(m))}</option>`).join('')}</select>` }),
    pattern: () => ({ label: 'דפוס תנועה', html: `<select name="directiveValue">${PATTERNS.map((x) => `<option value="${x}">${esc(patternLabel(x))}</option>`).join('')}</select>` }),
    joint: () => ({ label: 'מפרק', html: `<select name="directiveValue">${Object.entries(JOINTS_HE).map(([k, v]) => `<option value="${k}">${esc(v)}</option>`).join('')}</select>` }),
    equipment: () => ({ label: 'ציוד', html: `<select name="directiveValue">${equipmentOptions()}</select>` }),
    percent: () => ({ label: 'אחוזים', html: '<input name="directiveValue" type="number" min="5" max="50" value="10">' }),
    minutes: () => ({ label: 'דקות', html: '<input name="directiveValue" type="number" min="20" max="120" value="45">' }),
  }[needs]();

  labelEl.textContent = opts.label;
  field.innerHTML = opts.html;
  if (current) { const el = field.querySelector('[name=directiveValue]'); if (el) el.value = current; }
}

/* ---------------------------------------------------------------- פעולות */
function onSwap(ds) {
  const raw = traineeById(state.program.traineeId);
  const trainee = normalizeTrainee(raw);
  const studio = normalizeStudio(studioById(raw.studioId));
  try {
    swapExercise(state.program, trainee, studio, {
      dayIndex: +ds.d, blockIndex: +ds.b, alternativeId: $(`#alt_${ds.d}_${ds.b}`).value,
    });
    render();
    log('הוחלף תרגיל', `ציון האיכות המעודכן: ${state.program.qa.score}`);
  } catch (err) {
    log('ההחלפה לא בוצעה', esc(err.message));
  }
}

/**
 * המאמן שינה משקל בתכנית.
 * מרגע זה זהו משקל העבודה של המתאמן בתרגיל הזה — הוא נשמר, מוצג בשבוע הבא,
 * והפרוגרסיה ממשיכה ממנו.
 */
async function onLoadEdit(el) {
  const raw = traineeById(state.program.traineeId);
  const id = el.dataset.kg;
  const kg = parseFloat(el.value);
  raw.history = raw.history || {};
  if (!Number.isFinite(kg) || kg <= 0) {
    delete raw.history[id]?.trainerSet;
  } else {
    raw.history[id] = {
      ...(raw.history[id] || {}),
      trainerSet: { kg, perSide: el.dataset.perside === '1', at: new Date().toISOString() },
    };
  }
  await store.updateTrainee(raw);
  generate();
  log('משקל עודכן', `${esc(exerciseName(id))}: ${Number.isFinite(kg) && kg > 0 ? `${kg} ק״ג — יישמר לפעמים הבאות` : 'חזרה להצעת המערכת'}.`);
}

function exerciseName(id) {
  const t = traineeById(state.program?.traineeId);
  const custom = (t?.customExercises || []).find((c) => c.id === id);
  if (custom) return custom.name;
  try { return getExercise(id).name; } catch { return id; }
}

/* ---------------------------------------------------------------- הערות */
function openNoteForm(opts = {}) {
  const wrap = $('#noteFormWrap');
  const form = $('#noteForm');
  if (!wrap || !form) return;
  wrap.open = true;
  form.reset();

  if (opts.id) {
    const t = traineeById(state.program.traineeId);
    const note = (t.notesLog || []).find((n) => n.id === opts.id);
    if (note) {
      form.id.value = note.id;
      form.text.value = note.text;
      form.author.value = note.author || '';
      form.directiveType.value = note.directive.type;
      renderDirectiveValue(note.directive.type, note.directive.value);
      form.dataset.scope = note.scope;
      form.dataset.exerciseId = note.exerciseId || '';
    }
  } else {
    form.id.value = '';
    form.dataset.scope = opts.scope || 'general';
    form.dataset.exerciseId = opts.exerciseId || '';
    renderDirectiveValue('none');
    if (opts.exerciseId) {
      form.text.placeholder = `הערה על ${exerciseName(opts.exerciseId)} — למשל: כאב קל בסוף הסט, או שהמשקל הזה עדיין קל`;
    }
  }
  form.querySelector('[name=text]').focus();
  wrap.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
}

async function onNoteSubmit(e) {
  e.preventDefault();
  const form = e.target;
  const f = new FormData(form);
  const raw = traineeById(state.program.traineeId);
  const value = f.get('directiveValue');

  const note = normalizeNote({
    id: f.get('id') || undefined,
    text: f.get('text'),
    author: f.get('author') || '',
    scope: form.dataset.scope || 'general',
    exerciseId: form.dataset.exerciseId || null,
    directive: { type: f.get('directiveType'), value: value || null },
  });

  raw.notesLog = upsertNote(raw.notesLog || [], note);
  await store.updateTrainee(raw);
  form.reset();
  $('#noteFormWrap').open = false;
  renderDirectiveValue('none');
  generate();

  const effect = applyNotes(normalizeTrainee(raw)).effects.find((x) => x.noteId === note.id);
  log('הערה נשמרה', [esc(note.text), effect ? `<b>${esc(effect.effect)}</b>` : '']);
}

async function toggleNote(id) {
  const raw = traineeById(state.program.traineeId);
  const note = (raw.notesLog || []).find((n) => n.id === id);
  if (!note) return;
  note.active = !note.active;
  await store.updateTrainee(raw);
  generate();
  log('הערה עודכנה', `${esc(note.text)} — ${note.active ? 'הופעלה מחדש' : 'הושבתה; הטקסט נשמר'}.`);
}

async function deleteNote(id) {
  const raw = traineeById(state.program.traineeId);
  const note = (raw.notesLog || []).find((n) => n.id === id);
  if (!note) return;
  if (!confirm(`למחוק את ההערה?

${note.text}`)) return;
  raw.notesLog = removeNote(raw.notesLog || [], id);
  await store.updateTrainee(raw);
  generate();
  log('הערה נמחקה', esc(note.text));
}

/** תוצאת בדיקה — תרגיל באזור פציעה או תרגיל שהמאמן כתב. */
async function onTrial(exerciseId, ok, kind) {
  const raw = traineeById(state.program.traineeId);
  const type = kind === 'custom'
    ? (ok ? 'custom_tested_ok' : 'custom_tested_failed')
    : (ok ? 'probe_ok' : 'probe_pain');
  let note = '';
  if (!ok) note = prompt('מה בדיוק הרגיש המתאמן? (יישמר בתיק)', '') || '';
  const ev = { type, exerciseId, payload: { note } };

  const { trainee, changes } = applyFeedback(normalizeTrainee(raw), [ev]);
  Object.assign(raw, trainee);
  await store.updateTrainee(raw);
  generate();
  log(ok ? 'הבדיקה עברה' : 'נרשמה תחושה', changes.map((c) => esc(c.message)));
}

/** שמירת תרגיל שהמאמן כתב בעצמו. */
async function onCustomSubmit(e) {
  e.preventDefault();
  const f = new FormData(e.target);
  const raw = traineeById(state.program.traineeId);
  const payload = {
    name: f.get('name'),
    description: f.get('description'),
    sets: +f.get('sets') || 3,
    reps: f.get('reps') || '10',
    load: f.get('load') || '',
    notes: f.get('notes') || '',
    pattern: f.get('pattern') || null,
    primaryMuscle: f.get('primaryMuscle') || null,
    equipment: f.get('equipment') ? [f.get('equipment')] : [],
  };
  const { trainee, changes } = applyFeedback(normalizeTrainee(raw), [{ type: 'custom_add', payload }]);
  Object.assign(raw, trainee);
  await store.updateTrainee(raw);
  e.target.reset();
  generate();
  log('נוסף תרגיל משלך', changes.map((c) => esc(c.message)));
}

function onAction(ds) {
  const block = state.program.days[+ds.d].blocks[+ds.b];
  const raw = traineeById(state.program.traineeId);
  const ev = { type: ds.act, exerciseId: block.exercise.id, dayIndex: +ds.d, prescription: block.prescription };

  if (ds.act === 'log_set') {
    const load = prompt(`${block.exercise.name} — משקל שבוצע בפועל (ק״ג):`, block.load?.kg ?? '');
    if (load === null) return;
    const reps = prompt('חזרות שבוצעו:', String(block.prescription.repsMin));
    const rpe = prompt('RPE (1-10):', String(10 - block.prescription.rir));
    ev.payload = { load: load ? +load : null, reps: reps ? +reps : null, rpe: rpe ? +rpe : null };
    if (load) ev.payload.perSide = !!block.load?.perSide;
  } else if (ds.act === 'pain') {
    const joint = prompt('היכן הכאב?\nshoulder / low_back / knee / elbow / wrist / hip / ankle / neck', 'knee');
    if (!joint) return;
    ev.payload = { joint: joint.trim(), painLevel: +(prompt('עוצמת כאב 1-10:', '5') || 5) };
  } else if (ds.act === 'equipment_busy') {
    ev.payload = { equipment: block.exercise.equipment };
  }

  raw._events = [...(raw._events || []), ev];

  // כל פעולה מהשטח נשמרת ביומן האימונים הקבוע — זו ההיסטוריה שנשארת
  // גם אחרי שהתכנית תיבנה מחדש עשר פעמים.
  const day = state.program.days[+ds.d];
  store.appendLog(raw.id, [{
    type: ds.act,
    programId: state.program.id,
    week: state.program.week,
    dayIndex: +ds.d,
    dayLabel: day?.label || day?.name || '',
    exerciseId: block.exercise.id,
    exerciseName: block.exercise.name,
    payload: ev.payload,
  }]);

  const { trainee, changes, flags } = applyFeedback(normalizeTrainee(raw), [ev]);
  Object.assign(raw, trainee);
  store.updateTrainee(raw);

  const messages = changes.map((c) => esc(c.message));
  if (flags.deloadRecommended) messages.push('<b>הצטברות סימני עומס — מומלץ שבוע הורדת עומס.</b>');
  log(esc(block.exercise.name), messages.length ? messages : ['נרשם.']);

  // משוב שמשנה את מרחב האפשרויות מחייב בנייה מחדש כדי שהמסך לא יציג תרגיל שנפסל
  if (['pain', 'equipment_busy', 'skip', 'form_breakdown'].includes(ds.act)) generate();
}

boot();
</script>
</body>
</html>
