async function deleteStudio(id) {
  const studio = studioById(id);
  const count = state.trainees.filter((t) => t.studioId === id).length;
  const msg = count
    ? `למחוק את "${studio.name}"?\n\nמשויכים אליו ${count} מתאמנים — הם יימחקו יחד איתו.`
    : `למחוק את "${studio.name}"?`;
  if (!confirm(msg)) return;

  if (state.server) {
    try { await api('/api/studios/delete', { id, force: true }); await store.load(); }
    catch (err) { log('המחיקה נכשלה', esc(err.message)); return; }
  } else {
    state.studios = state.studios.filter((x) => x.id !== id);
    state.trainees = state.trainees.filter((t) => t.studioId !== id);
    store.persistLocal();
  }
  state.editingStudio = null;
  fillStudios();
  renderStudioView();
  log('סטודיו נמחק', `${esc(studio.name)}${count ? ` · ${count} מתאמנים הוסרו` : ''}`);
}

/* ---------------------------------------------------------------- גיבוי ושחזור */
async function exportDb() {
  const payload = state.server
    ? await api('/api/db/export')
    : { exportedAt: new Date().toISOString(), data: { studios: Object.fromEntries(state.studios.map((s) => [s.id, s])), trainees: Object.fromEntries(state.trainees.map((t) => [t.id, t])), programs: {}, events: [] } };

  const filename = `studio-training-${new Date().toISOString().slice(0, 10)}.json`;
  const text = JSON.stringify(payload, null, 2);

  // בעמוד מפורסם ההורדה עוברת דרך המארח; בשרת המקומי קישור רגיל עובד.
  // מנסים קודם את המסלול המתווך, ורק אם אינו זמין נופלים לקישור.
  try {
    const downloads = await window.claude?.use?.('downloads');
    if (downloads) {
      await downloads.save({ filename, data: text });
      log('גיבוי יוצא', 'הקובץ נשמר. שמור אותו במקום בטוח.');
      return;
    }
  } catch (err) {
    log('ההורדה לא הושלמה', esc(err?.message || 'הפעולה בוטלה'));
    return;
  }

  const blob = new Blob([text], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
  log('גיבוי יוצא', 'הקובץ ירד למחשב. שמור אותו במקום בטוח.');
}

async function importDb(e) {
  const file = e.target.files?.[0];
  if (!file) return;
  const text = await file.text();
  let payload;
  try { payload = JSON.parse(text); } catch { log('השחזור נכשל', 'הקובץ אינו JSON תקין.'); return; }
  const data = payload.data || payload;
  if (!data.studios || !data.trainees) { log('השחזור נכשל', 'הקובץ אינו גיבוי של המערכת.'); return; }
  if (!confirm('שחזור מגיבוי יחליף את הנתונים הקיימים. להמשיך?')) return;

  if (state.server) {
    try {
      const r = await api('/api/db/import', { payload });
      await store.load();
      log('שוחזר מגיבוי', `${r.stats.studios} סטודיואים · ${r.stats.trainees} מתאמנים. גיבוי של המצב הקודם נשמר.`);
    } catch (err) { log('השחזור נכשל', esc(err.message)); return; }
  } else {
    state.studios = Object.values(data.studios);
    state.trainees = Object.values(data.trainees);
    store.persistLocal();
    log('שוחזר מגיבוי', `${state.studios.length} סטודיואים · ${state.trainees.length} מתאמנים.`);
  }
  fillStudios();
  renderStudioView();
  e.target.value = '';
}

   שלב 2 — רישום מתאמן
   ================================================================== */
const DAY_KEYS = [['sun', 'א'], ['mon', 'ב'], ['tue', 'ג'], ['wed', 'ד'], ['thu', 'ה'], ['fri', 'ו'], ['sat', 'ש']];

/* ================================================================
   לוח האימונים.
   אימון זז במציאות. הלוח מראה מה מתוכנן, מה בוצע ומה הועבר,
   ומאפשר לגרור אימון ליום אחר או להעביר אותו בשתי לחיצות.
   ================================================================ */

const calState = { traineeId: null, year: null, month: null, picked: null };

const MONTHS_HE = ['ינואר', 'פברואר', 'מרץ', 'אפריל', 'מאי', 'יוני',
  'יולי', 'אוגוסט', 'ספטמבר', 'אוקטובר', 'נובמבר', 'דצמבר'];

/**
 * שורות התרגילים, עם כותרת לכל מקטע כשהסטודיו הגדיר מבנה משלו.
 * בלי מבנה מותאם התצוגה נשארת בדיוק כפי שהייתה.
 */
function blocksWithSegments(day, di) {
  const rows = day.blocks.map((b, bi) => ({ b, bi }));
  if (!day.segments || !day.segments.length) {
    return rows.map(({ b, bi }) => exerciseRow(b, di, bi)).join('');
  }
  let lastSeg = null;
  return rows.map(({ b, bi }) => {
    let head = '';
    const segId = b.segment?.id || null;
    if (segId && segId !== lastSeg) {
      const seg = day.segments.find((x) => x.id === segId);
      lastSeg = segId;
      if (seg) {
        head = `<p class="seghead">${esc(seg.label)} · ${seg.minutes}′${seg.note ? ` — ${esc(seg.note)}` : ''}</p>`;
      }
    }
    return head + exerciseRow(b, di, bi);
  }).join('');
}

function cellHtml(c) {
  return `<div class="cell ${c.inMonth ? '' : 'out'} ${c.isToday ? 'today' : ''}" data-date="${c.date}">
    <span class="dnum">${c.day}</span>
    ${c.sessions.map((s) => `
      <button class="sess ${s.status} ${s.movedFrom ? 'moved' : ''} ${calState.picked === s.id ? 'picked' : ''}"
        draggable="true" data-sess="${esc(s.id)}"
        title="${esc(s.dayLabel || 'אימון')}${s.movedFrom ? ` · הועבר מ-${fmtDate(s.movedFrom)}` : ''}">
        ${esc(s.dayLabel || 'אימון')}
      </button>`).join('')}
  </div>`;
}

function wireCalendar() {
  $('#calTrainee').onchange = (e) => { calState.traineeId = e.target.value; calState.picked = null; renderCalendarView(); };
  $('#calPrev').onclick = () => { shiftMonth(-1); };
  $('#calNext').onclick = () => { shiftMonth(1); };
  $('#calToday').onclick = () => {
    const n = new Date();
    calState.year = n.getFullYear(); calState.month = n.getMonth();
    renderCalendarView();
  };
  $('#calPlan').onclick = planOntoCalendar;

  // בחירה בלחיצה — עובד גם במגע, שם גרירה קשה
  document.querySelectorAll('[data-sess]').forEach((el) => {
    el.onclick = (e) => {
      e.stopPropagation();
      const id = el.dataset.sess;
      // אם כבר בחרנו אימון אחר, לחיצה על אימון קיים מעבירה לתאריך שלו —
      // אחרת אי אפשר היה להעביר אימון ליום שכבר יש בו אימון
      if (calState.picked && calState.picked !== id) {
        const target = el.closest('.cell')?.dataset.date;
        if (target) { doMoveSession(calState.picked, target); return; }
      }
      calState.picked = calState.picked === id ? null : id;
      renderCalendarView();
    };
    el.ondragstart = (ev) => {
      ev.dataTransfer.setData('text/plain', el.dataset.sess);
      ev.dataTransfer.effectAllowed = 'move';
    };
  });

  document.querySelectorAll('.cell').forEach((cell) => {
    cell.ondragover = (ev) => { ev.preventDefault(); cell.classList.add('drop'); };
    cell.ondragleave = () => cell.classList.remove('drop');
    cell.ondrop = (ev) => {
      ev.preventDefault();
      cell.classList.remove('drop');
      const id = ev.dataTransfer.getData('text/plain');
      if (id) doMoveSession(id, cell.dataset.date);
    };
    cell.onclick = () => {
      if (calState.picked) doMoveSession(calState.picked, cell.dataset.date);
    };
  });
}

function shiftMonth(delta) {
  let m = calState.month + delta;
  let y = calState.year;
  if (m < 0) { m = 11; y -= 1; }
  if (m > 11) { m = 0; y += 1; }
  calState.month = m; calState.year = y;
  renderCalendarView();
}

async function doMoveSession(sessionId, toDate) {
  const raw = traineeById(calState.traineeId);
  const before = (raw.sessions || []).map(normalizeSession);
  const target = before.find((s) => s.id === sessionId);
  if (!target || target.date === toDate) { calState.picked = null; renderCalendarView(); return; }

  raw.sessions = moveSession(before, sessionId, toDate);
  calState.picked = null;
  await store.updateTrainee(raw);
  renderCalendarView();
  log('האימון הועבר', [
    `${esc(target.dayLabel || 'אימון')}: ${fmtDate(target.date)} ← ${fmtDate(toDate)}.`,
    'התאריך המקורי נשמר, כך שרואים שהאימון הועבר ולא נמחק.',
  ]);
}

/** פריסת התכנית הנוכחית על לוח השנה. */
async function planOntoCalendar() {
  const raw = traineeById(calState.traineeId);
  const program = state.program && state.program.traineeId === raw.id ? state.program : null;
  if (!program) {
    log('אין תכנית לפרוס', ['בנה תכנית למתאמן הזה במסך האימון, ואז חזור לכאן.']);
    return;
  }
  const planned = planWeek(program, { startDate: isoDate(new Date()) });
  const keep = (raw.sessions || []).map(normalizeSession)
    .filter((x) => x.status !== 'planned' || x.week !== program.week);
  raw.sessions = [...keep, ...planned].sort((a, b) => a.date.localeCompare(b.date));
  await store.updateTrainee(raw);
  renderCalendarView();
  log('התכנית נפרסה על הלוח', [
    `${planned.length} אימונים נקבעו, החל מ-${fmtDate(planned[0]?.date)}.`,
    'אפשר לגרור כל אימון ליום אחר.',
  ]);
}

/** נפח מצטבר: קילוגרמים עד טון, ואז טונות — כדי שהמספר יישאר קריא. */
function volumeTile(kg) {
  if (kg >= 1000) return { value: (kg / 1000).toFixed(1), label: 'טון נפח מצטבר' };
  return { value: Math.round(kg).toLocaleString('he-IL'), label: 'ק״ג נפח מצטבר' };
}

const chipIf = (cond, text) => (cond ? `<span class="chip">${esc(text)}</span>` : '');
const fmtDate = (d) => (d ? new Date(d).toLocaleDateString('he-IL') : '—');

function sessionRow(s) {
  return `<div class="hsession">

};

/*
 * שורה בארכיון. תכנית שיובאה מהגיליון אינה "שבוע 0 · ציון —": אין לה
 * שבוע ואין לה ציון איכות, כי המערכת לא בנתה אותה. הצגתה ככה נראתה
 * כמו תקלה. במקום זה היא מוצגת לפי מה שהיא באמת — רישום מהגיליון,
 * עם שם הלשונית שממנה הגיעה.

function programRow(p) {
  const imported = p.reason === 'imported';
  const sheet = p.program?.meta?.sheet || p.sheetName || '';
  return `<div class="hprog">

      : `<span class="chip ${p.qaPassed ? 'ok' : 'warn'}">ציון ${p.qaScore ?? '—'}</span>`}
    <span class="hint">${esc(REASON_LABEL[p.reason] || p.reason)}${p.at ? ` · ${fmtDate(p.at)}` : ''}</span>
    <span class="hint">${p.daysPerWeek} ימים · ${p.totalExercises} תרגילים</span>

  </div>`;

/**
 * פתיחת תכנית מהארכיון במסך האימון, לקריאה בלבד.
 * מסמנים בבירור שזו תכנית ישנה, כדי שאיש לא יעביר לפיה אימון בטעות.
 */
async function openArchivedProgram(snapshotId) {
  const snap = await store.loadArchivedProgram(snapshotId, historyTraineeId);
  if (!snap) { log('לא נמצא', 'התכנית אינה בארכיון.'); return; }
  state.program = snap.program;
  state.archivedView = { at: snap.at, week: snap.week, reason: snap.reason };
  setView('program', { regenerate: false });
  render();
  status(`תכנית מהארכיון · ${fmtDate(snap.at)}`, 'warn');
  log('נפתחה תכנית מהארכיון', [
    `שבוע ${snap.week}, נשמרה ב-${fmtDate(snap.at)}.`,
    'זו תמונת מצב היסטורית לקריאה. «בנה תכנית» יחזיר את התכנית הנוכחית.',
  ]);
}

      <b>לא זוהו מתאמנים בקובץ.</b> אפשר לבחור ידנית את סוג הלשונית בכל כרטיס למטה —
      למשל "מתאמנים" ללשונית שבה כל שורה היא אדם, או "כרטיס מתאמן אחד" ללשונית של מתאמן בודד.
      אם עדיין לא עולה — כדאי להדביק את הטבלה ישירות במסך הקודם.</div>`}

    <div class="card">
      <fieldset>
        <legend>לאן לייבא</legend>
        <div class="row">
          <select id="impTarget">
            <option value="new"${impState.target === 'new' ? ' selected' : ''}>סטודיו חדש</option>
            ${state.studios.map((s) => `<option value="${esc(s.id)}"${impState.target === s.id ? ' selected' : ''}>הוספה ל: ${esc(s.name)}</option>`).join('')}
          </select>
          <input id="impStudioName" placeholder="שם הסטודיו" value="${esc(impStudioName())}"
                 ${impState.target === 'new' ? '' : 'disabled'}>
        </div>
        <p class="hint">ייבוא לסטודיו קיים מוסיף ציוד ומתאמנים ואינו מוחק דבר ממה שכבר רשום.</p>
      </fieldset>
    </div>

    ${a.sheets.map((s, si) => importSheetCard(s, si)).slice(0, impState.cardLimit).join('')}
    ${a.sheets.length > impState.cardLimit ? `<div class="card"><div class="acts">
      <button id="impMoreCards" type="button">הצג עוד לשוניות (${a.sheets.length - impState.cardLimit} נותרו)</button>
      </div><p class="hint">כל הלשוניות ייובאו — כאן מוצגות ${impState.cardLimit} הראשונות לבדיקה.
      גיליון עם מאה לשוניות היה בונה מסך שאי אפשר לגלול בו.</p></div>` : ''}

    ${preview.warnings.length ? `<div class="card"><fieldset><legend>לתשומת לבך</legend>
      <ul class="notecard">${preview.warnings.map((w) => `<li>${esc(w)}</li>`).join('')}</ul></fieldset></div>` : ''}

    ${importLearnedHtml(preview.learned)}
    ${importRejectedHtml(preview.rejectedNames)}
    ${importUnmatchedHtml(preview.unmatched)}

    <div class="card">
      <div class="acts">
        <button class="primary" id="impApply" type="button">ייבא הכול</button>
        <button id="impBack" type="button">חזרה למקורות</button>
      </div>
      <p class="hint">הייבוא מוסיף נתונים בלבד. אפשר למחוק אחר כך כל מתאמן או סטודיו שנוצר.</p>
    </div>
  `;
}

function importSheetCard(sheet, si) {
  const roleOptions = SHEET_ROLES.map((r) => `<option value="${r.key}"${r.key === sheet.role ? ' selected' : ''}>${r.label}</option>`).join('');
  const skipped = sheet.role === 'skip';
  return `
    <div class="card">
      <fieldset>
        <legend>לשונית: ${esc(sheet.name || 'ללא שם')} <span class="chip mono">${sheet.rowCount} שורות</span></legend>
        <div class="row">
          <label class="f"><span>סוג הלשונית</span>
            <select data-imp-role="${si}">${roleOptions}</select></label>
          <p class="hint grow">${esc(sheet.why)}${sheet.headerless ? ' · אין שורת כותרת, הזיהוי נעשה לפי התוכן' : ''}</p>
        </div>
        ${skipped ? '<p class="hint">הלשונית הזאת לא תיובא.</p>' : `
        <div class="imp-scroll">
          <table class="imp-map">
            <thead><tr>
              <th style="text-align:start">עמודה בגיליון</th>
              <th style="text-align:start">מה זה</th>
              <th style="text-align:start">דוגמאות</th>
            </tr></thead>
            <tbody>
              ${sheet.columns.map((c) => `<tr>
                <td><b>${esc(c.header || `עמודה ${c.index + 1}`)}</b>
                    ${c.why ? `<div class="hint">${esc(c.why)}</div>` : ''}</td>
                <td><select data-imp-col="${si}_${c.index}">
                  <option value="none"${!c.field ? ' selected' : ''}>— לא לייבא —</option>
                  ${IMPORT_FIELDS.map(([f, label]) => `<option value="${f}"${c.field === f ? ' selected' : ''}>${esc(label)}</option>`).join('')}
                </select></td>
                <td class="hint mono">${esc(c.samples.join(' · ').slice(0, 70))}</td>
              </tr>`).join('')}
            </tbody>
          </table>
        </div>`}
      </fieldset>
    </div>`;
}

/**
 * מה המערכת למדה מהתכניות שבגיליון.
 *
 * זה החלק שהמאמן הכי צריך לראות לפני שהוא מאשר: הרמה של כל מתאמן נקבעה
 * לפי מה שכתוב אצלו בגיליון, והנימוק מוצג לצדה. אם משהו כאן נראה לא נכון,
 * זה הרגע לתקן — ואחרי הייבוא אפשר לשנות כל רמה בכרטיס המתאמן.
 */
function importLearnedHtml(learned) {
  if (!learned || !learned.length) return '';
  const CONF = { high: 'ביטחון גבוה', medium: 'ביטחון בינוני', low: 'ביטחון נמוך' };
  return `<div class="card"><fieldset><legend>מה למדנו על המתאמנים</legend>
    <p class="hint">הרמה נקבעה לפי התרגילים והמשקלים שרשומים בגיליון — לא לפי מה שהוצהר.
       כך התכנית הראשונה כבר מתאימה למי שהמתאמן באמת.</p>
    <table class="imp-map"><tbody>
      ${learned.map((l) => `<tr>
        <td><b>${esc(l.name)}</b></td>
        <td>${esc(levelLabel(l.level))}<br><span class="muted">${esc(CONF[l.confidence] || '')}</span></td>
        <td>${(l.reasons || []).map((r) => esc(r)).join('<br>')}</td>
      </tr>`).join('')}
    </tbody></table>
  </fieldset></div>`;
}

/**
 * שורות שנפסלו כשם של אדם.
 * המאמן חייב לראות אותן: אם המערכת פסלה שם אמיתי הוא צריך לדעת מיד,
 * ואם היא פסלה "לחיצת חזה" — זו בדיוק ההתנהגות שהוא מצפה לה.
 */
function importRejectedHtml(rejected) {
  if (!rejected || !rejected.length) return '';
  return `<div class="card"><fieldset><legend>שורות שלא נכנסו כמתאמנים</legend>
    <p class="hint">שורות שאינן נראות כמו שם של אדם. אם מישהו אמיתי נמצא כאן —
       כדאי לבדוק שסוג הלשונית ועמודת השם נכונים.</p>
    <table class="imp-map"><tbody>
      ${rejected.map((r) => `<tr><td>${esc(r.value)}</td><td class="muted">${esc(r.why)}</td></tr>`).join('')}
    </tbody></table>
  </fieldset></div>`;
}

function importUnmatchedHtml(unmatched) {
  const groups = Object.entries(unmatched).filter(([, list]) => list.length);
  if (!groups.length) return '';
  return `<div class="card"><fieldset><legend>לא זוהה אוטומטית</legend>
    ${groups.map(([key, list]) => `<div class="invgroup">
      <b>${esc(SH_UNMATCHED_LABELS[key] || key)}</b>
      <div class="chips">${list.map((x) => `<span class="chip">${esc(x)}</span>`).join('')}</div>
    </div>`).join('')}
    <p class="hint">תרגילים שלא זוהו נשמרים כתרגילים של הסטודיו ואפשר להשתמש בהם.
       ציוד ומגבלות שלא זוהו אפשר להוסיף ידנית במסך הסטודיו או בכרטיס המתאמן.</p>
  </fieldset></div>`;
}

function importDoneHtml() {
  const r = impState.result.report;
  const failed = !!impState.error;
  return `
    ${failed ? `<div class="banner crit">${esc(impState.error)}</div>` : ''}
    <div class="hero">
      <div>
        <h2>${failed ? 'הייבוא לא הושלם' : 'הייבוא הושלם'}</h2>
        <p>${failed
          ? 'חלק מהנתונים לא נשמרו. המספרים למטה הם מה שהייבוא בנה — לא בהכרח מה שנשמר.'
          : 'הכול נשמר. אפשר לעבור למסך המתאמנים ולבנות תכנית לכל אחד מהם.'}</p>
      </div>
      <div class="tiles">
        <div class="tile accent"><b data-count>${r.counts.trainees}</b><span>מתאמנים</span></div>
        <div class="tile"><b data-count>${r.counts.equipment}</b><span>פריטי ציוד</span></div>
        <div class="tile"><b data-count>${r.counts.programs}</b><span>תכניות</span></div>
      </div>
    </div>
    <div class="card"><fieldset><legend>מה נבנה מכל לשונית</legend>
      <table class="imp-map">
        <tbody>${r.perSheet.map((p) => `<tr>
          <td><b>${esc(p.name)}</b></td>
          <td class="hint">${esc(ROLE_LABEL[p.role] || p.role)}</td>
          <td class="mono">${p.built} ${esc(p.what)}</td>
        </tr>`).join('')}</tbody>
      </table>
      ${r.warnings.length ? `<ul class="notecard">${r.warnings.map((w) => `<li>${esc(w)}</li>`).join('')}</ul>` : ''}
    </fieldset></div>
    <div class="card"><div class="acts">
      <button class="primary" id="impGoTrainees" type="button">למסך המתאמנים</button>
      <button id="impClear" type="button">ייבוא נוסף</button>
    </div></div>`;
}

/** שם ברירת מחדל לסטודיו החדש: שם החשבון, ואם אין — שם הלשונית הראשונה. */
function impStudioName() {
  if (impState.studioName) return impState.studioName;
  return state.account?.studioName || impState.sheets[0]?.name || 'הסטודיו שלי';
}

/**
 * בנייה יבשה כדי להראות מספרים אמיתיים לפני האישור.
 * התוצאה נשמרת: מסך הסקירה מצייר את עצמו מחדש בכל שינוי, וגיליון של אלפי
 * שורות לא צריך להיבנות מחדש רק כדי לצייר את אותם מספרים.
 */
function impPreview() {
  const key = JSON.stringify([impState.target, impStudioName(), impState.roleOverrides, impState.columnOverrides]);
  if (impState.previewKey === key && impState.preview) return impState.preview.report;
  try {
    const built = shBuildImport(impState.analysis, {
      studioName: impStudioName(),
      studioId: impState.target === 'new' ? null : impState.target,
      baseStudio: impState.target === 'new' ? null : studioById(impState.target),
    });
    impState.preview = built;
    impState.previewKey = key;
    return built.report;
  } catch (err) {
    return { counts: { trainees: 0, equipment: 0, programs: 0, logs: 0, attendance: 0 }, warnings: [err.message], unmatched: {}, perSheet: [] };
  }
}

/** הפוגה קצרה שמאפשרת לדפדפן לצייר מחדש בין לשונית ללשונית. */
const impBreathe = () => new Promise((resolve) => setTimeout(resolve, 0));

let impAnalyzing = false;

/*
 * ניתוח של גיליון גדול — לשונית לכל מתאמן, אלף שורות בכל אחת — נמשך זמן.
 * הוא רץ כאן בהפוגות ועם התקדמות גלויה, כי דף שקופא נראה למאמן כמו מערכת
 * שהתרסקה, וכרום מציע לו לסגור אותה.
 */
async function impAnalyze() {
  if (!impState.sheets.length || impAnalyzing) return;
  impAnalyzing = true;
  impState.previewKey = null;
  impState.error = '';
  const total = impState.sheets.length;
  const heavy = total > 3;
  if (heavy) {
    impState.busy = `מנתח את הגיליון… 0 מתוך ${total}`;
    renderImportView();
    await impBreathe();
  }
  try {
    impState.analysis = await shAnalyzeWorkbookAsync(
      impState.sheets.map((s) => ({ name: s.name, rows: s.rows })),
      {
        overrides: impState.roleOverrides,
        columnOverrides: impState.columnOverrides,
        onProgress: heavy ? (done, all, name) => {
          impState.busy = `מנתח את הגיליון… ${done} מתוך ${all}${name ? ` · ${name}` : ''}`;
          const banner = $('#impBusy');
          if (banner) banner.textContent = impState.busy;
        } : null,
        breathe: heavy ? impBreathe : null,
      },
    );
    impState.stage = 'review';
  } catch (err) {
    impState.error = `הניתוח נכשל: ${err.message}`;
  } finally {
    impAnalyzing = false;
    impState.busy = '';
    renderImportView();
  }
}

async function impApply() {
  const built = impState.preview || shBuildImport(impState.analysis, {
    studioName: impStudioName(),
    studioId: impState.target === 'new' ? null : impState.target,
    baseStudio: impState.target === 'new' ? null : studioById(impState.target),
  });
  try {
    status('שומר את הנתונים…');
    for (const studio of built.studios) await store.saveStudio(studio);
    let saved = 0;
    for (const trainee of built.trainees) {
      const res = await store.saveTrainee(trainee);
      if (res && res.ok === false) log('ייבוא', `${esc(trainee.name)}: ${(res.errors || []).join(', ')}`);
      saved++;
      // שמירה של מאה מתאמנים אורכת זמן; בלי סימן חיים המסך נראה תקוע
      if (built.trainees.length > 10 && saved % 5 === 0) {
        status(`שומר… ${saved} מתוך ${built.trainees.length}`);
        await impBreathe();
      }
    }
    if (built.snapshots.length) await store.importSnapshots(built.snapshots);
    await store.load();
    impState.result = built;
    impState.stage = 'done';
    // אם האחסון נגמר באמצע, אסור להציג "הייבוא הושלם" כאילו הכול נשמר
    if (state.storageWarned) {
      impState.error = 'חלק מהנתונים לא נשמרו — האחסון של הדפדפן מלא. '
        + 'כדאי למחוק ארכיון ישן במסך ההיסטוריה ולייבא שוב, או להפעיל את המערכת עם שרת.';
    } else {
      flash(`יובאו ${built.report.counts.trainees} מתאמנים ו-${built.report.counts.equipment} פריטי ציוד.`, 'ok');
    }
  } catch (err) {
    impState.error = err.message;
  } finally {
    status('');
    renderImportView();
  }
}

function impAddSheet(name, rows) {
  if (!rows.length) { impState.error = 'לא נמצאו שורות בלשונית הזאת.'; return; }
  const taken = new Set(impState.sheets.map((s) => s.name));
  const base = name || `לשונית ${impState.sheets.length + 1}`;
  let unique = base;
  let n = 2;
  while (taken.has(unique)) unique = `${base} ${n++}`;
  impState.sheets.push({ name: unique, rows });
  impState.error = '';
}

/**
 * קריאת הקבצים שנבחרו או שנגררו לחלון.
 * כל קובץ נקרא בנפרד, וכישלון באחד אינו מבטל את האחרים — מי שגרר שלושה
 * קבצים ואחד מהם PDF צריך לקבל את השניים האחרים ולראות מה קרה לשלישי.
 */
async function impIngestFiles(files) {
  const list = [...(files || [])];
  if (!list.length) return;
  status('קורא את הקובץ…');
  impState.busy = list.length > 1 ? `קורא ${list.length} קבצים…` : 'קורא את הקובץ…';
  impState.error = '';
  renderImportView();

  const problems = [];
  for (const file of list) {
    try {
      const sheets = await shReadFile(await file.arrayBuffer(), file.name);
      for (const sh of sheets) impAddSheet(sh.name, sh.rows);
    } catch (err) {
      problems.push(err.message);
    }
  }
  impState.busy = '';
  impState.error = problems.join(' · ');
  status('');
  renderImportView();
}

/** תוכן תיבת ההדבקה -> לשונית, בכל צורה שהודבקה. */
function impPasteFromBox() {
  const box = $('#impPaste');
  const text = box ? box.value : '';
  if (!text.trim()) { impState.error = 'אין מה להוסיף — התיבה ריקה.'; renderImportView(); return; }
  const rows = shParseAny(text);
  if (!rows.some((r) => r.some((c) => String(c).trim()))) {
    impState.error = 'לא זיהינו טבלה במה שהודבק. בגיליון: מסמנים את הטווח, Ctrl+C, ומדביקים כאן.';
    renderImportView();
    return;
  }
  impAddSheet($('#impPasteName').value.trim(), rows);
  renderImportView();
}

function wireImport() {
  const on = (sel, ev, fn) => { const el = $(sel); if (el) el.addEventListener(ev, fn); };

  on('#impPasteAdd', 'click', () => {
    impPasteFromBox();
  });

  /*
   * הדבקה ישירה לתיבה: הלוח מכיל גם טקסט וגם HTML, ורק ה-HTML שומר על
   * גבולות התאים כשיש בתא שורה שנייה. לוקחים אותו כשהוא שם.
   */
  on('#impPaste', 'paste', (ev) => {
    const html = ev.clipboardData?.getData('text/html');
    if (!html || !shIsHtmlTable(html)) return;
    const rows = shParseHtmlTables(html)[0];
    if (!rows || !rows.length) return;
    ev.preventDefault();
    impAddSheet($('#impPasteName').value.trim(), rows);
    renderImportView();
  });

  on('#impFile', 'change', (e) => impIngestFiles([...e.target.files]));

  /*
   * גרירה של הקובץ לחלון היא מה שמאמן מנסה קודם. בלי מאזין, הדפדפן פותח
   * את הקובץ במקום להוסיף אותו — ומה שהיה על המסך נעלם.
   */
  const zone = $('#viewImport');
  if (zone) {
    const box = $('#impDrop');
    const mark = (on) => box && box.classList.toggle('over', on);
    // השמה ולא addEventListener: המסך מצויר מחדש אחרי כל הוספה, והמאזין
    // היה נרשם שוב על אותו אלמנט — וקובץ אחד שנגרר היה נכנס ארבע פעמים.
    zone.ondragover = (ev) => { ev.preventDefault(); mark(true); };
    zone.ondragleave = (ev) => { if (ev.target === zone || ev.target === box) mark(false); };
    zone.ondrop = (ev) => {
      ev.preventDefault();
      mark(false);
      const files = [...(ev.dataTransfer?.files || [])];
      if (files.length) { impIngestFiles(files); return; }
      // גרירה של טווח מהגיליון עצמה מעבירה טקסט, לא קובץ
      const text = ev.dataTransfer?.getData('text/html') || ev.dataTransfer?.getData('text/plain') || '';
      if (!text.trim()) return;
      const rows = shIsHtmlTable(text) ? (shParseHtmlTables(text)[0] || []) : shParseAny(text);
      if (rows.length) { impAddSheet('', rows); renderImportView(); }
    };
  }

  on('#impUrlGo', 'click', async () => {
    const url = $('#impUrl').value.trim();
    if (!url) return;
    status('מתחבר לגיליון…');
    impState.busy = 'מתחבר לגיליון…';
    renderImportView();
    try {
      const sheets = await shLoadGoogleSheet(url, { onProgress: (msg) => { impState.busy = msg; } });
      for (const s of sheets) impAddSheet(s.name, s.rows);
      impState.busy = '';
      /*
       * נשארים במסך המקורות ולא עוברים ישר לניתוח: בגיליון שאינו מפורסם
       * הדפדפן אינו מורשה לקרוא את רשימת הלשוניות, ולכן נטענת רק זו
       * שבקישור. מי שיש לו עוד לשוניות צריך לראות את זה ולהוסיף אותן.
       */
      $('#impUrl').value = '';
      log('נטען מהגיליון', sheets.length === 1
        ? 'נטענה לשונית אחת — זו שבקישור. אם יש עוד לשוניות: פותחים כל אחת בגיליון, מעתיקים את הכתובת שלה ומדביקים כאן שוב.'
        : `נטענו ${sheets.length} לשוניות.`);
      renderImportView();
    } catch (err) {
      impState.busy = '';
      impState.error = err.message;
      renderImportView();
    } finally {
      status('');
    }
  });

  document.querySelectorAll('[data-imp-drop]').forEach((b) => {
    b.onclick = () => { impState.sheets.splice(+b.dataset.impDrop, 1); renderImportView(); };
  });

  on('#impAnalyze', 'click', impAnalyze);
  on('#impMoreCards', 'click', () => { impState.cardLimit += 24; renderImportView(); });
  on('#impBack', 'click', () => { impState.stage = 'source'; renderImportView(); });
  on('#impApply', 'click', impApply);
  on('#impGoTrainees', 'click', () => setView('trainees'));
  on('#impClear', 'click', () => {
    Object.assign(impState, {
      stage: 'source', sheets: [], analysis: null, roleOverrides: {}, columnOverrides: {},
      result: null, preview: null, previewKey: null, error: '', cardLimit: 12,
    });
    renderImportView();
  });

  document.querySelectorAll('[data-imp-role]').forEach((sel) => {
    sel.onchange = () => {
      const sheet = impState.analysis.sheets[+sel.dataset.impRole];
      impState.roleOverrides[sheet.name] = sel.value;
      // שינוי סוג הלשונית משנה גם את פירוש העמודות, ולכן המיפוי הידני שלה מתאפס
      delete impState.columnOverrides[sheet.name];
      impAnalyze();
    };
  });

  document.querySelectorAll('[data-imp-col]').forEach((sel) => {
    sel.onchange = () => {
      const [si, index] = sel.dataset.impCol.split('_').map(Number);
      const sheet = impState.analysis.sheets[si];
      impState.columnOverrides[sheet.name] = { ...(impState.columnOverrides[sheet.name] || {}), [index]: sel.value };
      impAnalyze();
    };
  });

  on('#impTarget', 'change', (e) => {
    impState.target = e.target.value;
    renderImportView();
  });
  on('#impStudioName', 'input', (e) => { impState.studioName = e.target.value; });

      if (pickAll.checked) shown.forEach((t) => state.picked.add(t.id));
      else shown.forEach((t) => state.picked.delete(t.id));
      renderTraineesView();
    };
  }
  document.querySelectorAll('[data-bulk]').forEach((b) => {
    b.onclick = () => bulkTrainees(b.dataset.bulk);
  });
  const undo = $('#undoDelete');
  if (undo) undo.onclick = undoDelete;
  const yes = $('#bulkDeleteYes');
  if (yes) yes.onclick = bulkDeleteNow;
  const no = $('#bulkDeleteNo');
  if (no) no.onclick = () => { state.bulkConfirm = false; renderTraineesView(); };
  document.querySelectorAll('[data-toggle-active]').forEach((b) => {
    b.onclick = () => toggleTraineeActive(b.dataset.toggleActive);
  });
  // מחיקה בשני שלבים: הלחיצה הראשונה שואלת, השנייה מוחקת
  document.querySelectorAll('[data-del-trainee]').forEach((b) => {
    b.onclick = () => { state.confirmDeleteId = b.dataset.delTrainee; renderTraineesView(); };
  });
  document.querySelectorAll('[data-del-confirm]').forEach((b) => {
    b.onclick = () => deleteTraineeNow(b.dataset.delConfirm);
  });
  document.querySelectorAll('[data-del-cancel]').forEach((b) => {
    b.onclick = () => { state.confirmDeleteId = null; renderTraineesView(); };
  });
  const cancel = $('#cancelEdit');
  if (cancel) cancel.onclick = cancelEditTrainee;
  if (editing) fillTraineeForm(editing);
  document.querySelectorAll('[data-open-trainee]').forEach((b) => {
    b.onclick = () => {
      const t = traineeById(b.dataset.openTrainee);
      $('#studio').value = t.studioId;
      fillTrainees();
      $('#trainee').value = t.id;
      setView('program');
    };
  });
}

/* --------------------------------------- רשימת המתאמנים: סינון ובחירה */

/**
 * האם המתאמן פעיל.
 * רשומה שנוצרה לפני שהשדה היה קיים נחשבת פעילה — היעדר מידע אינו סיבה
 * להעלים מתאמן מהרשימה של המאמן.
 */
const isActive = (t) => t.active !== false && !t.inactive;

/**
 * מתי נבנתה למתאמן תכנית בפעם האחרונה.
 * זו השאלה שהמאמן שואל בתחילת כל שבוע, והתשובה יושבת בארכיון התכניות.
 */
function lastProgramAt(traineeId) {
  let best = null;
  for (const s of state.snapshots || []) {
    if (s.traineeId !== traineeId) continue;
    if (!best || s.at > best) best = s.at;
  }
  return best;
}

const DAY_MS = 24 * 3600 * 1000;

/** האם קיבל תכנית בשבוע האחרון. */
function hasFreshProgram(t) {
  const at = lastProgramAt(t.id);
  return !!at && Date.now() - new Date(at).getTime() < 7 * DAY_MS;
}

/** "לפני 3 ימים" / "היום" — מה שהמאמן באמת רוצה לדעת. */
function agoLabel(at) {
  if (!at) return 'אין תכנית';
  const days = Math.floor((Date.now() - new Date(at).getTime()) / DAY_MS);
  if (days <= 0) return 'תכנית מהיום';
  if (days === 1) return 'תכנית מאתמול';
  if (days < 7) return `תכנית מלפני ${days} ימים`;
  if (days < 14) return 'תכנית מלפני שבוע';
  return `תכנית מלפני ${Math.floor(days / 7)} שבועות`;
}

/**
 * מה חסר למתאמן כדי שהתכנית שלו תהיה מדויקת.
 *
 * לא כל שדה ריק שווה אותו דבר. משקל גוף משנה כל הצעת משקל וכל חישוב כוח
 * יחסי; גיל משנה תקרות עצימות; מטרה משנה את המרשם כולו. אלה השדות שבאמת
 * מזיזים תכנית, ולכן רק הם נספרים כאן — רשימה שמתלוננת על הכול היא רשימה
 * שאיש לא מסתכל בה.
 */
function dataGaps(t) {
  const gaps = [];
  if (!t.weightKg) gaps.push('משקל גוף');
  if (!t.age) gaps.push('גיל');
  if (!t.primaryGoal) gaps.push('מטרה');
  const hasEvidence = Object.keys(t.history || {}).length || (t.knownMovements || []).length;
  if (!hasEvidence && t.levelSource !== 'inferred') gaps.push('ראיה לרמה');
  return gaps;
}

/** המתאמנים שמוצגים כרגע, אחרי חיפוש וסינון סטטוס. */
function listedTrainees() {
  const q = shNorm(state.traineeQuery || '');
  return state.trainees.filter((t) => {
    if (state.traineeFilter === 'active' && !isActive(t)) return false;
    if (state.traineeFilter === 'inactive' && isActive(t)) return false;
    if (state.traineeFilter === 'stale' && (!isActive(t) || hasFreshProgram(t))) return false;
    if (state.traineeFilter === 'gaps' && !dataGaps(t).length) return false;
    if (!q) return true;
    const hay = [t.name, studioById(t.homeStudioId || t.studioId)?.name, t.phone, t.coach,
      GOAL_PROFILES[t.primaryGoal]?.label].filter(Boolean).join(' ');
    return shNorm(hay).includes(q);
  });
}

const activeCount = () => state.trainees.filter(isActive).length;

/**
 * הסרגל שמעל הרשימה: חיפוש, סינון, ופעולות על מה שנבחר.
 * בסטודיו עם מאה מתאמנים רשימה בלי חיפוש היא רשימה שאי אפשר לעבוד איתה,
 * ומחיקה אחד-אחד היא עשר דקות של לחיצות.
 */
function traineeListToolbarHtml() {
  if (!state.trainees.length) return '';
  const shown = listedTrainees();
  const pickedHere = shown.filter((t) => state.picked.has(t.id));
  const tab = (key, label) => `<button class="chip${state.traineeFilter === key ? ' ok' : ''}"
    data-tfilter="${key}">${label}</button>`;
  return `
    <div class="row" style="margin-bottom:.6rem; gap:.4rem">
      <input id="traineeSearch" class="grow" placeholder="חיפוש לפי שם, סניף, טלפון או מאמן"
             value="${esc(state.traineeQuery || '')}" autocomplete="off">
      ${tab('all', `הכול (${state.trainees.length})`)}
      ${tab('active', `פעילים (${activeCount()})`)}
      ${tab('inactive', `לא פעילים (${state.trainees.length - activeCount()})`)}
      ${tab('stale', `ללא תכנית השבוע (${state.trainees.filter((t) => isActive(t) && !hasFreshProgram(t)).length})`)}
      ${tab('gaps', `חסרים נתונים (${state.trainees.filter((t) => dataGaps(t).length).length})`)}
    </div>
    ${(() => {
      const noWeight = state.trainees.filter((t) => isActive(t) && !t.weightKg).length;
      return noWeight ? `<p class="hint" style="margin:-.2rem 0 .6rem">ל-${noWeight} מתאמנים פעילים אין משקל גוף.
        זה הנתון היחיד שמשפיע גם על הצעות המשקל וגם על זיהוי הרמה — השלמה שלו משפרת את כל התכניות שלהם.</p>` : '';
    })()}
    <div class="row" style="margin-bottom:.6rem; gap:.4rem">
      <label class="pickbox"><input type="checkbox" id="pickAll"
        ${shown.length && pickedHere.length === shown.length ? 'checked' : ''}
        aria-label="בחירת כל המוצגים"></label>
      <span class="hint">${pickedHere.length ? `${pickedHere.length} נבחרו` : 'בחירה מרובה'}</span>
      ${pickedHere.length ? `
        <span class="grow"></span>
        <button data-bulk="learn">למד רמה מההיסטוריה</button>
        <button data-bulk="active">סמן כפעילים</button>
        <button data-bulk="inactive">סמן כלא פעילים</button>
        <button class="danger" data-bulk="delete">מחיקת ${pickedHere.length} מתאמנים</button>` : ''}
    </div>
    ${state.bulkConfirm ? `<div class="banner warn">
      למחוק ${pickedHere.length} מתאמנים? ההיסטוריה, התכניות והמדידות שלהם יימחקו יחד איתם
      ואי אפשר לשחזר.
      <div class="acts" style="margin-top:.5rem">
        <button class="danger" id="bulkDeleteYes">כן, מחק את כולם</button>
        <button id="bulkDeleteNo">ביטול</button>
      </div></div>` : ''}`;
}

/* ------------------------------------------------- ביטול מחיקה */

/**
 * מחיקה היא הפעולה היחידה כאן שאי אפשר לתקן, והיא נמצאת בדיוק ליד
 * "ערוך". לכן כל מחיקה שומרת עותק בזיכרון של הדפדפן עד לפעולה הבאה,
 * ואפשר להחזיר אותה בלחיצה. העותק אינו נשמר לדיסק — הוא מתאדה עם רענון,
 * וזה בסדר: הוא נועד לתקן טעות של הרגע ולא לשמש גיבוי.
 */
function captureForUndo(ids) {
  const trainees = ids.map((id) => traineeById(id)).filter(Boolean).map((t) => structuredClone(t));
  const snapshots = (state.snapshots || []).filter((s) => ids.includes(s.traineeId)).map((s) => structuredClone(s));
  state.undoDelete = trainees.length ? { trainees, snapshots, at: Date.now() } : null;
}

async function undoDelete() {
  const u = state.undoDelete;
  if (!u) return;
  status('מחזיר…');
  for (const t of u.trainees) await store.saveTrainee(t);
  if (u.snapshots.length) await store.importSnapshots(u.snapshots);
  await store.load();
  state.undoDelete = null;
  status('');
  fillStudios();
  flash(`${u.trainees.length === 1 ? `${esc(u.trainees[0].name)} הוחזר` : `${u.trainees.length} מתאמנים הוחזרו`} עם ההיסטוריה.`, 'ok');
  renderTraineesView();
}

function undoBannerHtml() {
  const u = state.undoDelete;
  if (!u) return '';
  const who = u.trainees.length === 1 ? esc(u.trainees[0].name) : `${u.trainees.length} מתאמנים`;
  return `<div class="banner warn">${who} נמחק${u.trainees.length === 1 ? '' : 'ו'}.
    <button id="undoDelete" style="margin-inline-start:.6rem">ביטול המחיקה</button></div>`;
}

/** שינוי סטטוס של מתאמן אחד — הפעולה הכי נפוצה, ולכן לחיצה אחת. */
async function toggleTraineeActive(id) {
  const t = traineeById(id);
  if (!t) return;
  const active = !isActive(t);
  const res = await store.saveTrainee({
    ...t, active, inactive: !active, inactiveAt: active ? null : new Date().toISOString(),
  });
  if (res && res.ok === false) { flash((res.errors || []).join(', '), 'warn'); }
  else flash(`${t.name} סומן/ה כ${active ? 'פעיל' : 'לא פעיל'}.`, 'ok');
  renderTraineesView();
}

/**
 * לימוד הפרופיל מההיסטוריה שכבר קיימת במערכת.
 *
 * ייבוא לומד את הרמה מהתכניות שבגיליון, אבל מתאמן צובר היסטוריה גם אחר
 * כך — רישומי סטים, משקלים ותכניות שנבנו. הכפתור הזה מריץ את אותו לימוד
 * על מה שיש עכשיו, כדי שהרמה לא תישאר תקועה על מה שהיה נכון פעם.
 */
async function learnProfiles(ids) {
  const changed = [];
  status(`לומד ${ids.length} מתאמנים…`);
  for (const id of ids) {
    const raw = traineeById(id);
    if (!raw) continue;
    const programs = (state.snapshots || []).filter((s) => s.traineeId === id).map((s) => s.program).filter(Boolean);
    const logs = (raw.sessionLog || []).filter((e) => e && e.exerciseId);
    const normalized = normalizeTrainee(raw);
    const profile = inferTraineeProfile(normalized, { programs, logs });
    const prefs = inferTrainingPreferences(normalized, { programs, logs });
    const learnedSomething = profile.level.confidence !== 'none'
      || prefs.preferredSplit || prefs.trainingStyles.length;
    if (!learnedSomething) continue;

    const before = raw.level;
    const next = { ...raw };
    if (profile.level.confidence !== 'none') {
      next.level = profile.level.label;
      next.levelSource = 'inferred';
      next.levelConfidence = profile.level.confidence;
      next.levelReasons = profile.level.reasons;
      if (profile.trainingAgeMonths) next.trainingAgeMonths = profile.trainingAgeMonths;
    }
    next.knownMovements = profile.knownMovements.length ? profile.knownMovements : raw.knownMovements;
    next.history = { ...profile.history, ...(raw.history || {}) };

    /*
     * החלוקה והסגנון נלמדים רק כשהמאמן לא קבע אותם בעצמו. 'full_body'
     * הוא ברירת המחדל של המערכת ולא בחירה של אדם, ולכן הוא כן מתעדכן —
     * אבל סגנון שנבחר ידנית נשאר כפי שהוא.
     */
    const reasons = [];
    if (prefs.preferredSplit && (!raw.preferredSplit || raw.preferredSplit === 'full_body')) {
      next.preferredSplit = prefs.preferredSplit;
      reasons.push(prefs.splitReason);
    }
    if (prefs.trainingStyles.length && !(raw.trainingStyles || []).length) {
      next.trainingStyles = prefs.trainingStyles;
      reasons.push(...prefs.styleReasons);
    }
    if (prefs.emphasis.length && !(raw.focusMuscles || []).length) next.focusMuscles = prefs.emphasis;
    if (reasons.length) next.profileReasons = reasons;

    await store.saveTrainee(next);
    changed.push({
      name: raw.name, before, after: next.level || before,
      reasons: [...profile.level.reasons, ...reasons],
    });
  }
  status('');
  await store.load();
  const moved = changed.filter((c) => c.before !== c.after);
  log('לימוד מההיסטוריה', changed.length
    ? [`נבדקו ${ids.length} מתאמנים · ${moved.length} רמות עודכנו.`,
      ...changed.slice(0, 20).map((c) => `${esc(c.name)}: ${esc(levelLabel(c.before))} → ${esc(levelLabel(c.after))}${
        c.before === c.after ? ' (ללא שינוי)' : ''} — ${esc((c.reasons[1] || c.reasons[0] || '').slice(0, 120))}`)]
    : 'אין עדיין מספיק היסטוריה כדי ללמוד ממנה. משקלים שנרשמים באימון או ייבוא של תכניות קודמות יאפשרו את זה.');
  flash(moved.length ? `${moved.length} רמות עודכנו לפי ההיסטוריה.` : 'הרמות נבדקו — לא נדרש שינוי.', 'ok');
  renderTraineesView();
}

/** פעולה קבוצתית על כל מי שנבחר. */
async function bulkTrainees(action) {
  const ids = listedTrainees().filter((t) => state.picked.has(t.id)).map((t) => t.id);
  if (!ids.length) return;
  if (action === 'delete') { state.bulkConfirm = true; renderTraineesView(); return; }
  if (action === 'learn') { await learnProfiles(ids); return; }

  const active = action === 'active';
  status(`מעדכן ${ids.length} מתאמנים…`);
  for (const id of ids) {
    const t = traineeById(id);
    if (t) await store.saveTrainee({ ...t, active, inactive: !active });
  }
  status('');
  flash(`${ids.length} מתאמנים סומנו כ${active ? 'פעילים' : 'לא פעילים'}.`, 'ok');
  state.picked.clear();
  renderTraineesView();
}

async function bulkDeleteNow() {
  const ids = listedTrainees().filter((t) => state.picked.has(t.id)).map((t) => t.id);
  captureForUndo(ids);
  status(`מוחק ${ids.length} מתאמנים…`);
  let done = 0;
  for (const id of ids) { await store.deleteTrainee(id); done++; if (done % 5 === 0) status(`מוחק… ${done}/${ids.length}`); }
  status('');
  state.picked.clear();
  state.bulkConfirm = false;
  flash(`${done} מתאמנים נמחקו.`, 'ok');
  fillStudios();
  renderTraineesView();
}

/** שורת מגבלה — מקובצת לפי אזור כדי שקל יהיה למצוא. */
function constraintOptionsHtml() {
  const groups = {};
  for (const [id, c] of Object.entries(CONSTRAINTS)) (groups[c.region] ||= []).push([id, c.name]);
  const regionLabel = {
    shoulder: 'כתף', spine: 'גב ועמוד שדרה', knee: 'ברך', elbow: 'מרפק', wrist: 'שורש כף יד',
    hip: 'ירך', ankle: 'קרסול', neck: 'צוואר', systemic: 'מצבים רפואיים כלליים',
  };
  return Object.entries(groups).map(([region, items]) => `
    <optgroup label="${esc(regionLabel[region] || region)}">
      ${items.map(([id, name]) => `<option value="${esc(id)}">${esc(name)}</option>`).join('')}
    </optgroup>`).join('');
}

function addConstraintRow(c = null) {
  $('#constraintRows').insertAdjacentHTML('beforeend', `
    <div class="listrow" data-crow>
      <select data-cid style="max-width:270px">${constraintOptionsHtml()}</select>
      <select data-csev style="max-width:130px">
        <option value="acute">חריף — כואב עכשיו</option>
        <option value="subacute" selected>בהחלמה</option>
        <option value="managed">מנוהל / ישן</option>
      </select>
      <select data-cside style="max-width:120px">
        <option value="">שני הצדדים</option><option value="right">ימין</option><option value="left">שמאל</option>
      </select>
      <input data-cnote placeholder="הערה — למשל ׳כואב רק בירידה׳" class="grow">
      <button type="button" data-cdel>הסר</button>
    </div>`);
  const row = $('#constraintRows').lastElementChild;
  row.querySelector('[data-cdel]').onclick = () => row.remove();
  if (c) {
    row.querySelector('[data-cid]').value = c.id;
    row.querySelector('[data-csev]').value = c.severity || 'subacute';
    row.querySelector('[data-cside]').value = c.side || '';
    row.querySelector('[data-cnote]').value = c.notes || '';
  }
  return row;
}

/* ------------------------------------------------ עריכה ומחיקה של מתאמן */

/** שדות שהם רשימה: בחירה מרובה או קבוצת תיבות סימון. */
const TRAINEE_LIST_FIELDS = {
  focusMuscles: (t) => t.focusMuscles,
  likes: (t) => t.likes,
  dislikes: (t) => t.dislikes,
  knownMovements: (t) => t.knownMovements,
  preferredDays: (t) => t.preferredDays,
  alsoStudio: (t) => t.studioIds,
  trainingStyles: (t) => t.trainingStyles,
};

/**
 * מילוי הטופס מנתוני מתאמן קיים.
 *
 * המעבר עובר דרך normalizeTrainee ולא דרך הרשומה הגולמית: כך המאמן רואה
 * בדיוק את הערכים שהמנוע עובד לפיהם — כולל משקל שמגיע מהמדידה האחרונה
 * ולא מהשדה הישן שהוזן פעם.
 */
function fillTraineeForm(raw) {
  const form = $('#traineeForm');
  if (!form || !raw) return;
  const t = normalizeTrainee(raw);

  const scalars = {
    name: t.name, studioId: t.homeStudioId || t.studioId, primaryGoal: t.primaryGoal,
    daysPerWeek: t.daysPerWeek, sessionMinutes: t.sessionMinutes, level: t.level,
    age: t.age, sex: t.sex, heightCm: t.heightCm, weightKg: t.weightKg,
    trainingAgeMonths: t.trainingAgeMonths, phone: t.phone, email: t.email,
    units: t.units, varietyPreference: t.varietyPreference, mesocycleLength: t.mesocycleLength,
    mesocycleWeek: t.mesocycleWeek,
    medicalClearance: String(t.medicalClearance), travelWeek: String(t.travelWeek),
    active: String(t.active), preferredSplit: t.preferredSplit,
    sport: t.sport, externalSessions: t.externalSessions, lifestyle: t.lifestyle,
    cyclePhase: t.cyclePhase, medications: (t.medications || []).join(', '),
    sleepQuality: t.sleepQuality, stressLevel: t.stressLevel, nutritionAdherence: t.nutritionAdherence,
    coach: t.coach, startDate: t.startDate, targetDate: t.targetDate, goalDetail: t.goalDetail,
    preferredTime: t.preferredTime, bodyFatPct: t.bodyFatPct, restingHR: t.restingHR,
    bloodPressure: t.bloodPressure, pastInjuries: t.pastInjuries, notes: t.notes,
  };
  for (const [name, value] of Object.entries(scalars)) {
    const el = form.elements[name];
    if (!el || el instanceof RadioNodeList) continue;
    el.value = value === null || value === undefined ? '' : String(value);
  }

  for (const [name, pick] of Object.entries(TRAINEE_LIST_FIELDS)) {
    const wanted = new Set(pick(t) || []);
    form.querySelectorAll(`[name="${name}"]`).forEach((el) => {
      if (el.tagName === 'SELECT') {
        [...el.options].forEach((o) => { o.selected = wanted.has(o.value); });
      } else {
        el.checked = wanted.has(el.value);
      }
    });
  }

  $('#constraintRows').innerHTML = '';
  for (const c of t.constraints) addConstraintRow(c);

  // פרטים שנמצאים בקטעים מקופלים — נפתחים, אחרת נראה כאילו הם ריקים
  form.querySelectorAll('details.optional').forEach((d) => { d.open = true; });
}

/** מעבר למצב עריכה: הטופס מתמלא, והשמירה תעדכן ולא תיצור מתאמן נוסף. */
function startEditTrainee(id) {
  state.editingTraineeId = id;
  state.confirmDeleteId = null;
  renderTraineesView();
  $('#viewTrainees').scrollIntoView({ behavior: REDUCED ? 'auto' : 'smooth', block: 'start' });
}

function cancelEditTrainee() {
  state.editingTraineeId = null;
  renderTraineesView();
}

async function deleteTraineeNow(id) {
  const t = traineeById(id);
  if (!t) return;
  try {
    captureForUndo([id]);
    await store.deleteTrainee(id);
    if (state.editingTraineeId === id) state.editingTraineeId = null;
    state.confirmDeleteId = null;
    // המתאמן שנמחק אולי היה זה שנבחר במסך האימון
    if (state.program?.traineeId === id) state.program = null;
    fillStudios();
    flash(`<b>${esc(t.name)} נמחק${t.sex === 'female' ? 'ה' : ''}</b> יחד עם ההיסטוריה והתכניות.`, 'warn');
    log('מתאמן נמחק', `${esc(t.name)} הוסר מהמערכת.`);
    renderTraineesView();
  } catch (err) {
    log('המחיקה נכשלה', esc(err.message));
    state.confirmDeleteId = null;
    renderTraineesView();
  }
}

async function onTraineeSubmit(e) {
  e.preventDefault();
  const f = new FormData(e.target);
  const constraints = [...document.querySelectorAll('[data-crow]')].map((row) => ({
    id: row.querySelector('[data-cid]').value,
    severity: row.querySelector('[data-csev]').value,
    side: row.querySelector('[data-cside]').value || null,
    notes: row.querySelector('[data-cnote]').value,
  }));

  const trainee = {
    name: f.get('name'),
    // הסניף הראשי, ובנוסף כל סניף שסומן — אותו מתאמן בכמה מקומות
    homeStudioId: f.get('studioId'),
    studioIds: [...new Set([f.get('studioId'), ...f.getAll('alsoStudio')])].filter(Boolean),
    studioId: f.get('studioId'),
    age: +f.get('age') || 35, sex: f.get('sex'),
    heightCm: +f.get('heightCm') || null, weightKg: +f.get('weightKg') || null,
    level: f.get('level'), trainingAgeMonths: +f.get('trainingAgeMonths') || 0,
    primaryGoal: f.get('primaryGoal'), goals: [f.get('primaryGoal')],
    daysPerWeek: +f.get('daysPerWeek'), sessionMinutes: +f.get('sessionMinutes'),
    preferredDays: f.getAll('preferredDays'),
    focusMuscles: f.getAll('focusMuscles'), dislikes: f.getAll('dislikes'), likes: f.getAll('likes'),
    varietyPreference: f.get('varietyPreference'), mesocycleLength: +f.get('mesocycleLength') || 4,
    mesocycleWeek: +f.get('mesocycleWeek') || 1,
    units: f.get('units'),
    constraints, medicalClearance: f.get('medicalClearance') === 'true',
    sport: f.get('sport'), externalSessions: +f.get('externalSessions') || 0,
    lifestyle: f.get('lifestyle'), cyclePhase: f.get('cyclePhase'),
    travelWeek: f.get('travelWeek') === 'true',
    medications: String(f.get('medications') || '').split(',').map((x) => x.trim()).filter(Boolean),
    sleepQuality: +f.get('sleepQuality'), stressLevel: +f.get('stressLevel'),
    nutritionAdherence: +f.get('nutritionAdherence'),
    coach: f.get('coach') || '', startDate: f.get('startDate') || null,
    targetDate: f.get('targetDate') || null, goalDetail: f.get('goalDetail') || '',
    preferredTime: f.get('preferredTime') || 'any',
    bodyFatPct: +f.get('bodyFatPct') || null, restingHR: +f.get('restingHR') || null,
    bloodPressure: f.get('bloodPressure') || '',
    pastInjuries: f.get('pastInjuries') || '',
    knownMovements: f.getAll('knownMovements'),
    notes: f.get('notes'), phone: f.get('phone') || '', email: f.get('email') || '',
    active: f.get('active') !== 'false',
    preferredSplit: f.get('preferredSplit') || 'full_body',
    trainingStyles: f.getAll('trainingStyles'),
  };

  /*
   * עריכה מעדכנת את אותה רשומה. המיזוג עם הרשומה הקיימת הוא העיקר כאן:
   * הטופס אינו מכיל היסטוריה, מדידות, יומן הערות ותרגילים שאושרו בשטח,
   * ובלי המיזוג עריכת שם הייתה מוחקת את כל אלה.
   */
  const existing = state.editingTraineeId ? traineeById(state.editingTraineeId) : null;
  if (existing) {
    trainee.id = existing.id;
    // מטרות משנה (למשל כאלה שהגיעו מייבוא) נשמרות לצד המטרה הראשית
    const extra = (existing.goals || [])
      .map((g) => (typeof g === 'string' ? g : g.goal))
      .filter((g) => g && g !== trainee.primaryGoal);
    trainee.goals = [trainee.primaryGoal, ...new Set(extra)];
  }
  const payload = existing ? { ...existing, ...trainee } : trainee;

  try {
    const r = await store.saveTrainee(payload);
    if (!r.ok) { log('לא ניתן לשמור את המתאמן', r.errors.map(esc)); return; }
    if (existing) {
      state.editingTraineeId = null;
      flash(`<b>הפרטים של ${esc(trainee.name)} עודכנו.</b> התכנית נבנתה מחדש לפי הנתונים החדשים.
        ${r.warnings?.length ? `<br>${r.warnings.map(esc).join('<br>')}` : ''}`,
        r.warnings?.length ? 'warn' : 'ok');
    } else {
      flash(`<b>${esc(trainee.name)} נרשם${trainee.sex === 'female' ? 'ה' : ''}.</b> התכנית השבועית מוכנה למטה.
        ${r.warnings?.length ? `<br>${r.warnings.map(esc).join('<br>')}` : ''}`,
        r.warnings?.length ? 'warn' : '');
    }
    $('#studio').value = trainee.studioId;
    fillTrainees();
    $('#trainee').value = r.id;
    setView('program');
  } catch (err) {
    $('#traineeMsg').textContent = `שגיאה: ${err.message}`;
  }
}

/* ==================================================================

   מאמן שרוצה לשלוח תכנית, לצרף אותה לקובץ המעקב של הסטודיו או לשמור

   וזה בדיוק מה שנוצר כאן. אותה טבלה גם חוזרת פנימה דרך מסך הייבוא.

function exportCardHtml() {

  return `
    <div class="card" id="exportCard">
      <fieldset>
        <legend>העתקה לגיליון</legend>
        <p class="hint">בגיליון: לוחצים על תא ומדביקים (Ctrl+V) — כל עמודה נכנסת לתא שלה.
           זו אותה טבלה שמסך הייבוא יודע לקרוא, כך שאפשר לערוך בגיליון ולהחזיר.${
             state.archivedView ? ' התכנית הזאת היא מהארכיון.' : ''}</p>
        <div class="acts">
          <button class="primary" type="button" id="copyProgram">העתק את התכנית</button>
          ${state.archivedView ? '' : '<button type="button" id="copyStudio">העתק את כל הסטודיו</button>'}
          <button type="button" id="downloadCsv">הורדה כקובץ</button>
        </div>
        <details class="more">
          <summary>הצגת הטבלה</summary>

                    aria-label="הטבלה להעתקה"></textarea>
        </details>
      </fieldset>
    </div>`;

/** הטקסט של התכנית הנוכחית, בפורמט שגיליון מפרק לתאים. */
const programTsv = () => shToTsv(shProgramRows(state.program));

function wireExport() {
  const preview = $('#exportPreview');
  if (preview) preview.value = programTsv();

  const copy = $('#copyProgram');
  if (copy) copy.onclick = () => copyForSheet(programTsv(), 'התכנית של ' + state.program.traineeName);

  const all = $('#copyStudio');
  if (all) {
    all.onclick = () => {
      const studio = studioById($('#studio').value);
      const list = traineesOf(studio.id);
      if (!list.length) { status('אין מתאמנים בסניף הזה', 'warn'); return; }
      status('בונה תכניות…');
      // בנייה של כל הסטודיו לוקחת רגע; בלי ההשהיה הכפתור נראה תקוע
      setTimeout(() => {
        const batch = buildStudioPrograms(list, studio);
        const programs = batch.results.filter((r) => r.ok).map((r) => r.program);
        if (!programs.length) { status('לא נבנתה אף תכנית', 'warn'); return; }
        copyForSheet(shToTsv(shProgramsRows(programs)), `${programs.length} תכניות`);
      }, 30);
    };
  }

  const csv = $('#downloadCsv');
  if (csv) csv.onclick = () => downloadCsv();
}

/**
 * העתקה ללוח.
 * לוח המערכת חסום בחלק מההקשרים (עמוד מקומי, דפדפן מגביל), ולכן יש מסלול
 * שני ומסלול שלישי: פקודת ההעתקה הישנה, ולבסוף סימון הטקסט כדי שהמאמן
 * יעתיק בעצמו. כפתור שלא עושה כלום הוא הדבר הגרוע ביותר כאן.
 */
async function copyForSheet(text, what) {
  try {
    await navigator.clipboard.writeText(text);
    status(`הועתק: ${what}`, 'ok');
    log('הועתק לגיליון', `${esc(what)} — ${text.split('\n').length - 1} שורות. אפשר להדביק בגיליון.`);
    return;
  } catch { /* ממשיכים למסלול הבא */ }

  const box = $('#exportPreview');
  if (box) {
    box.value = text;
    box.closest('details').open = true;
    box.focus();
    box.select();
    let copied = false;
    try { copied = document.execCommand('copy'); } catch { copied = false; }
    status(copied ? `הועתק: ${what}` : 'הטקסט מסומן — לחצו Ctrl+C', copied ? 'ok' : 'warn');
  }
}

async function downloadCsv() {
  const csv = shToCsv(shProgramRows(state.program));
  // BOM כדי ש-Excel יזהה עברית; Sheets מזהה בלעדיו גם כן
  const text = `\ufeff${csv}`;
  const filename = shProgramFileName(state.program);

  /*
   * בעמוד מפורסם הדפדפן אינו מרשה לדף להוריד קובץ בעצמו, וקישור הורדה
   * פשוט אינו עושה כלום — בלי הודעה. לכן מנסים קודם את מסלול השמירה של
   * המארח, ורק אם אינו קיים (שרת מקומי, קובץ על המחשב) נופלים לקישור.
   */
  try {
    const downloads = await window.claude?.use?.('downloads');
    if (downloads) {
      await downloads.save({ filename, data: text });
      status('הקובץ נשמר', 'ok');
      return;
    }
  } catch (err) {
    status(err?.code === 'declined' ? 'ההורדה בוטלה' : 'ההורדה לא הושלמה — אפשר להעתיק ולהדביק בגיליון', 'warn');
    return;
  }

  const blob = new Blob([text], { type: 'text/csv;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
  status('הקובץ ירד', 'ok');
}

function generate() {
  if (state.view !== 'program') return;
  const t = traineeById($('#trainee').value);
  if (!t) {
    $('#rail').innerHTML = '';
    $('#days').innerHTML = `<p class="empty">אין מתאמנים בסטודיו הזה. אפשר לרשום מתאמן בשלב 2,
      או <a href="#" data-goto="import">לייבא את כולם מגיליון קיים</a>.</p>`;
    return;
  }
  // התכנית נבנית לפי הסניף שנבחר במסך, לא לפי הסניף הראשי של המתאמן:
  // אותו מתאמן בסניף אחר מקבל תכנית שמתאימה לציוד שיש שם.
  const studio = studioById($('#studio').value) || studioById(t.homeStudioId || t.studioId);
  const res = buildProgram(t, studio);
  if (!res.ok) {
    state.program = null;
    $('#rail').innerHTML = '';
    $('#days').innerHTML = `<div class="card"><h2>לא ניתן להפיק תכנית</h2>
      <ul class="findings">${res.errors.map((e) => `<li class="lv-error"><span class="chip crit">חסימה</span><span>${esc(e)}</span></li>`).join('')}</ul></div>`;
    status('נדרשת פעולה', 'crit');
    return;
  }
  state.program = res.program;
  state.archivedView = null;
  store.archive(res.program, 'generated');
  render();
  status(`תכנית מוכנה · ציון ${res.program.qa.score}`, res.program.qa.passed ? 'ok' : 'warn');
}

function generateAll() {
  const studio = studioById($('#studio').value);
  // מתאמן לא פעיל אינו מקבל תכנית: הוא לא מגיע לאימון, והתכנית שלו רק
  // תעמיס על הרשימה ועל ההיסטוריה
  const batch = buildStudioPrograms(traineesOf(studio.id).filter(isActive), studio);
  log(`${esc(studio.name)} — ${batch.total} תכניות`, batch.results.map((r) => (r.ok
    ? `${esc(r.name)}: ציון ${r.program.qa.score}${r.program.qa.passed ? '' : ' — נדרשת בדיקה'}`
    : `${esc(r.name)}: ${esc(r.errors[0])}`)));
}

/**
 * תכנית לשבוע הבא לכל המתאמנים הפעילים — בלחיצה אחת.
 *
 * זו הפעולה השבועית של המאמן: במקום לפתוח כל מתאמן, לקדם שבוע ולבנות,
 * הכול רץ ברצף. מתאמן לא פעיל מדולג בכוונה, וכך הרשימה נשארת נקייה בלי
 * למחוק אף אחד. הכישלונות אינם נבלעים — הם מופיעים ביומן עם הסיבה.
 */
async function nextWeekAll() {
  const studio = studioById($('#studio').value);
  if (!studio) return;
  const list = traineesOf(studio.id).filter(isActive);
  if (!list.length) {
    log('שבוע הבא לכולם', 'אין מתאמנים פעילים בסניף הזה. אפשר לסמן מתאמן כפעיל במסך המתאמנים.');
    return;
  }

  const btn = $('#nextAll');
  if (btn) btn.disabled = true;
  const lines = [];
  let built = 0;
  let failed = 0;

  for (const [i, raw] of list.entries()) {
    status(`בונה תכניות… ${i + 1} מתוך ${list.length} · ${raw.name}`);
    // הפוגה קצרה כדי שהמסך ימשיך להגיב גם בסטודיו עם מאה מתאמנים
    await new Promise((r) => setTimeout(r, 0));
    try {
      const events = (raw._events || []).slice();
      const { trainee, flags } = applyFeedback(normalizeTrainee(raw), events);
      const advanced = advanceWeek(trainee, flags);
      Object.assign(raw, advanced, { _events: [] });
      await store.updateTrainee(raw);

      const res = buildProgram(raw, studio);
      if (!res.ok) {
        failed++;
        lines.push(`${esc(raw.name)}: ${esc(res.errors[0] || 'לא ניתן לבנות תכנית')}`);
        continue;
      }
      await store.archive(res.program, 'next_week');
      built++;
      lines.push(`${esc(raw.name)}: שבוע ${advanced.mesocycleWeek} · ציון ${res.program.qa.score}`
        + `${res.program.qa.passed ? '' : ' — נדרשת בדיקה'}`);
    } catch (err) {
      failed++;
      lines.push(`${esc(raw.name)}: ${esc(err.message)}`);
    }
  }

  status('');
  if (btn) btn.disabled = false;
  await store.load();
  generate();
  log(`שבוע הבא · ${esc(studio.name)}`,
    [`נבנו ${built} תכניות${failed ? `, ${failed} נכשלו` : ''} מתוך ${list.length} מתאמנים פעילים.`, ...lines.slice(0, 30)]);
  flash(`נבנו ${built} תכניות לשבוע הבא${failed ? ` · ${failed} דורשות טיפול` : ''}.`, failed ? 'warn' : 'ok');
}

async function nextWeek() {
  const raw = traineeById($('#trainee').value);
  if (!raw) return;
  const events = (raw._events || []).slice();
  const { trainee, changes, flags } = applyFeedback(normalizeTrainee(raw), events);
  const advanced = advanceWeek(trainee, flags);
  Object.assign(raw, advanced, { _events: [] });
  await store.updateTrainee(raw);
  generate();
  if (state.program) store.archive(state.program, 'next_week');
  log(`מעבר לשבוע ${advanced.mesocycleWeek}`,
    [...changes.map((c) => esc(c.message)), flags.deloadRecommended ? '<b>מומלץ שבוע הורדת עומס.</b>' : '']
      .filter(Boolean).slice(0, 8)
      .concat(changes.length ? [] : ['לא נרשם משוב מהשטח — התכנית התקדמה לפי הפריודיזציה בלבד.']));
}

/** הסבר קצר לרמה שהמערכת עבדה לפיה, לשימוש ב-tooltip. */
function levelExplain(r) {
  if (!r) return '';
  const parts = [`רמה בפועל: ${levelLabel(r.label)}`];
  if (r.claimed !== r.label) parts.push(`הוצהר: ${levelLabel(r.claimed)}`);
  return parts.concat(r.reasons || []).join(' · ');
}

const CONFIDENCE_LABEL = {
  high: 'מבוסס על משקלים שנרשמו בשלושה דפוסים ומעלה',
  medium: 'מבוסס חלקית על משקלים שנרשמו',
  low: 'מבוסס על ההצהרה בלבד — רישום משקלים יחדד את ההתאמה',
};

/**
 * כרטיס הרמה. מוצג רק כשיש מה להסביר: כשהמערכת הסיקה רמה שונה
 * מזו שהוצהרה, או כשההסתמכות היא על הצהרה בלבד. אחרת זה רעש.
 */
function levelCard(r) {
  if (!r) return '';
  const changed = r.claimed !== r.label;
  if (!changed && r.confidence === 'medium') return '';

  const patterns = Object.entries(r.byPattern || {});
  return `<div class="card">
    <p class="eyebrow">רמת המתאמן</p>
    <div class="row" style="gap:.4rem; flex-wrap:wrap; align-items:center">
      <span class="chip ${changed ? 'key' : ''}">${esc(levelLabel(r.label))}</span>
      ${changed ? `<span class="hint">הוצהר: ${esc(levelLabel(r.claimed))}</span>` : ''}
    </div>
    <p class="hint" style="margin-top:.4rem">${esc(CONFIDENCE_LABEL[r.confidence] || '')}</p>
    ${(r.reasons || []).length ? `<ul class="cues">${r.reasons.map((x) => `<li>${esc(x)}</li>`).join('')}</ul>` : ''}
    ${patterns.length ? `<div class="row" style="gap:.3rem; flex-wrap:wrap; margin-top:.4rem">
      ${patterns.map(([k, v]) => `<span class="chip mono" title="${v.loadKg} ק״ג — פי ${v.ratio} ממשקל הגוף">
        ${esc(patternLabel(k))} · ${esc(levelLabel(v.level))}</span>`).join('')}
    </div>` : ''}
  </div>`;
}

function renderRail(p) {
  const m = p.meta;
  const vol = Object.entries(p.weeklyVolume).sort((a, b) => b[1] - a[1]);
  const max = Math.max(p.volumeTarget.max, ...vol.map((v) => v[1]));

  $('#rail').innerHTML = `
    <div class="card">
      <p class="eyebrow">מתאמן</p>
      <h2>${esc(p.traineeName)}</h2>
      <div class="score">
        <b class="${p.qa.passed ? '' : 'warn'}">${p.qa.score}</b>
        <span class="chip ${p.qa.passed ? 'ok' : 'crit'}">${p.qa.passed ? 'עבר בקרת איכות' : `${p.qa.errors} שגיאות`}</span>
      </div>
      <div class="chips" style="margin-top:.6rem">
        <span class="chip key">${esc(m.goalLabel)}</span>
        <span class="chip ${m.resolvedLevel && m.resolvedLevel.label !== m.resolvedLevel.claimed ? 'key' : ''}"
          title="${esc(levelExplain(m.resolvedLevel))}">${esc(levelLabel(m.resolvedLevel?.label || m.level))}</span>
        <span class="chip mono">${m.daysPerWeek}×${m.sessionMinutes}′</span>
        <span class="chip mono">שבוע ${p.week} · ${esc(phaseLabel(m.phase))}</span>
        ${m.deload ? '<span class="chip warn">הורדת עומס</span>' : ''}
        ${m.travelWeek ? '<span class="chip warn">שבוע נסיעה</span>' : ''}
      </div>
      <dl class="kv">
        <dt>חלוקה</dt><dd>${esc(splitLabel(m.split))}</dd>
        <dt>התאוששות</dt><dd>${Math.round(m.recoveryScore * 100)}%</dd>
        <dt>מכפיל נפח</dt><dd class="mono">${m.volumeMultiplier}</dd>
        ${m.externalLoad.sessions ? `<dt>עומס חיצוני</dt><dd>${esc(sportLabel(m.externalLoad.sport))} · ${m.externalLoad.sessions} בשבוע</dd>` : ''}
        <dt>מאגר מותאם</dt><dd>${m.eligibleExercises} מתוך ${m.eligibleExercises + m.rejectedExercises}</dd>
      </dl>
      <p class="note">${esc(m.splitReason)}</p>
      ${m.ageNote ? `<p class="note">${esc(m.ageNote)}</p>` : ''}
      ${m.externalLoad.note ? `<p class="note">${esc(m.externalLoad.note)}</p>` : ''}
    </div>

    ${levelCard(p.meta.resolvedLevel)}

    ${p.constraints.length ? `<div class="card">
      <p class="eyebrow">מגבלות פעילות</p>
      <div class="chips" style="margin-top:.45rem">
        ${p.constraints.map((c) => `<span class="chip ${c.severity === 'acute' ? 'crit' : c.severity === 'subacute' ? 'warn' : ''}">${esc(c.name)} · ${esc(severityLabel(c.severity))}</span>`).join('')}
      </div>
      <ul class="cues">${p.constraints.map((c) => `<li><b>${esc(c.name)}:</b> ${esc(c.note)}</li>`).join('')}</ul>
    </div>` : ''}

    ${p.qa.issues.length ? `<div class="card">
      <p class="eyebrow">בקרת איכות</p>
      <ul class="findings">${p.qa.issues.map((i) => `<li class="lv-${i.level}">
        <span class="chip ${LEVEL_CHIP[i.level]}">${LEVEL_WORD[i.level]}</span><span>${esc(i.message)}</span></li>`).join('')}</ul>
    </div>` : ''}

    ${p.repairs?.length ? `<div class="card">
      <p class="eyebrow">תיקון אוטומטי</p>
      <ul class="cues">${p.repairs.map((r) => `<li>${esc(r.note)}</li>`).join('')}</ul>
    </div>` : ''}

    ${(() => {
      const t = traineeById(p.traineeId);
      return t && !t.weightKg
        ? `<div class="card"><div class="banner warn">לא הוזן משקל גוף, ולכן אין הצעות משקלי עבודה.
             אפשר להזין משקל בכל שדה בתכנית והוא יישמר, או להשלים את משקל הגוף בכרטיס המתאמן.</div></div>`
        : '';
    })()}

    ${measurementsCard(p)}

    ${notesCard(p)}

    ${p.probes.length ? `<div class="card">
      <p class="eyebrow">נסה ותגיד לי</p>
      <p class="hint">המערכת נמנעת מתרגילים שסותרים את המגבלה, אבל לא כל פציעה רלוונטית לכל תנועה.
        לכל אזור פגוע מוצע כאן תרגיל אחד, הכי פשוט שקיים. אם הוא עובר בלי כאב — הוא נכנס לתכניות מכאן והלאה.</p>

      <p class="hint">אפשר לכתוב תרגיל שאינו במאגר, לנסות אותו באימון, ולסמן אם המתאמן ביצע אותו בסדר.

            <label class="f"><span class="req">שם התרגיל</span><input name="name" required></label>

              <label class="f"><span>שריר עיקרי</span>

      <p class="eyebrow">נפח שבועי · יעד ${p.volumeTarget.min}–${p.volumeTarget.max} סטים</p>

          <td>${esc(muscleLabel(mus))}</td>

          <td style="width:40%"><div class="bar-track"><div class="bar-fill ${sets > p.volumeTarget.max ? 'over' : ''}" style="width:${Math.min(100, (sets / max) * 100)}%"></div></div></td>
        </tr>`).join('')}
      </tbody></table>
    </div>`;
}

/** התיאור המדויק של התרגיל, כולל תרגילים שהמאמן כתב בעצמו. */
function describeExercise(id) {
  const t = traineeById(state.program?.traineeId);
  const custom = (t?.customExercises || []).find((c) => c.id === id);
  if (custom) return custom.description || '';
  try { return getExercise(id).description || ''; } catch { return ''; }
}

const PATTERN_LABELS = {
  horizontal_push: 'דחיפה אופקית', vertical_push: 'דחיפה אנכית',
  horizontal_pull: 'משיכה אופקית', vertical_pull: 'משיכה אנכית',
  squat: 'סקוואט', hinge: 'הינג׳ / שרשרת אחורית', lunge: 'מכרע / חד-צדדי',
  hip_abduction: 'הרחקה וקירוב ירך', calf: 'תאומים',
  elbow_flexion: 'כפיפת מרפק', elbow_extension: 'פשיטת מרפק',
  shoulder_isolation: 'בידוד כתף',
  core_antiextension: 'ליבה — מניעת יישור', core_antirotation: 'ליבה — מניעת סיבוב',
  core_antilateralflexion: 'ליבה — מניעת הטיה', core_flexion: 'ליבה — כפיפה',
  carry: 'נשיאה', conditioning: 'קונדישן', mobility: 'ניידות',
};
const patternLabel = (p) => PATTERN_LABELS[p] || p;

/** אפשרויות ציוד לפי מה שקיים בסטודיו הנוכחי. */
function equipmentOptions() {
  const studio = studioById($('#studio').value);
  if (!studio) return '';
  const items = [...normalizeStudio(studio).equipment.keys()].filter((i) => i !== 'bodyweight');
  return items.map((i) => `<option value="${i}">${esc(EQUIPMENT_LABELS[i] || i)}</option>`).join('');
}

/** כרטיס תרגיל בדיקה באזור פציעה. */
function probeCard(pr, i) {
  const unlocked = !pr.locked || state.unlockedProbes?.has(pr.exercise.id);
  return `<div class="probe ${unlocked ? 'open' : ''}" data-probe="${esc(pr.exercise.id)}">
    <h4>${esc(pr.exercise.name)}</h4>
    <div class="role">בדיקה עבור: ${esc(pr.constraintName)} · ${esc(severityLabel(pr.severity))}${pr.side ? ` · צד ${pr.side === 'right' ? 'ימין' : 'שמאל'}` : ''}</div>
    <p class="desc">${esc(pr.exercise.description)}</p>
    ${unlocked ? `
      <div class="rx">
        <span class="chip key mono">${pr.prescription.sets} × ${esc(pr.prescription.reps)}</span>
        <span class="chip">${esc(equipmentList(pr.exercise.equipment))}</span>
      </div>
      <ul class="cues">${pr.instructions.map((x) => `<li>${esc(x)}</li>`).join('')}</ul>
      <p class="desc"><b>מתי עוצרים:</b> ${esc(pr.stopRule)}</p>
      <div class="acts">
        <button class="act-key" data-probe-res="ok" data-ex="${esc(pr.exercise.id)}">עבר בלי כאב</button>
        <button class="act-alert" data-probe-res="pain" data-ex="${esc(pr.exercise.id)}">היה כאב</button>
      </div>`
    : `<p class="desc"><b>${esc(pr.lockNote)}</b></p>
       <p class="desc"><b>מתי עוצרים:</b> ${esc(pr.stopRule)}</p>
       <div class="acts"><button data-unlock="${esc(pr.exercise.id)}">אני לוקח אחריות — הצג את הבדיקה</button></div>`}
  </div>`;
}

/** רשימת התרגילים שהמאמן כתב, עם מצב הבדיקה שלהם. */
function customList(p) {
  const all = [...(p.customExercises?.pending || []), ...(p.customExercises?.approved || [])];
  if (!all.length) return '<p class="empty">עדיין לא נוספו תרגילים משלך.</p>';
  return all.map((c) => `<div class="listrow" style="align-items:flex-start">
    <div class="grow">
      <strong>${esc(c.name)}</strong>
      <span class="chip ${c.status === 'tested_ok' ? 'ok' : 'warn'}">${c.status === 'tested_ok' ? 'נבדק ומשובץ' : 'ממתין לבדיקה'}</span>
      <p class="desc">${esc(c.description)}</p>
      <div class="rx">
        <span class="chip mono">${c.sets} × ${esc(c.reps)}</span>
        ${c.load ? `<span class="chip mono">${esc(c.load)}</span>` : ''}
        ${c.pattern ? `<span class="chip">${esc(patternLabel(c.pattern))}</span>` : '<span class="chip">ללא שיוך — ישובץ כעזר</span>'}
      </div>
      ${c.notes ? `<p class="desc">${esc(c.notes)}</p>` : ''}
    </div>
    ${c.status !== 'tested_ok' ? `<div class="acts">
      <button class="act-key" data-custom-res="ok" data-ex="${esc(c.id)}">בוצע בסדר</button>
      <button class="act-alert" data-custom-res="fail" data-ex="${esc(c.id)}">לא מתאים</button>
    </div>` : ''}
  </div>`).join('');
}

function dayCard(day, di) {
  return `<article class="card day">
    <header>
      <h3>${esc(day.dayLabel)}</h3>
      <span class="chip">${esc(day.label)}</span>
      <span class="meta mono">${day.blocks.length} תרגילים · ${day.estimatedMinutes}′ מתוך ${day.sessionMinutes}′</span>
    </header>
    ${day.compressionNote ? `<p class="note">${esc(day.compressionNote)}</p>` : ''}
    ${blocksWithSegments(day, di)}
  </article>`;
}

          <button data-note-toggle="${esc(n.id)}" title="${n.active ? 'השבת' : 'הפעל'}">${n.active ? 'פעילה' : 'מושבתת'}</button>
          <button data-note-del="${esc(n.id)}" title="מחק">✕</button>

        <button data-act="too_easy" data-d="${di}" data-b="${bi}">קל מדי</button>
        <button data-act="too_hard" data-d="${di}" data-b="${bi}">קשה מדי</button>
        <button class="act-alert" data-act="pain" data-d="${di}" data-b="${bi}">כאב</button>
        <button data-note-add="${esc(b.exercise.id)}">+ הערה</button>
      </div>
      <details class="more">
        <summary>עוד פעולות</summary>

          <button data-act="form_breakdown" data-d="${di}" data-b="${bi}">טכניקה מתפרקת</button>
          <button data-act="equipment_busy" data-d="${di}" data-b="${bi}">מכשיר תפוס</button>
          <button data-act="skip" data-d="${di}" data-b="${bi}">דילוג</button>
          <button data-act="love_it" data-d="${di}" data-b="${bi}">תרגיל מוצלח</button>
        </div>
        ${b.alternatives.length ? `<div class="swap">
