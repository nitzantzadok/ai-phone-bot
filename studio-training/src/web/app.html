<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>מסך המאמן</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;600;700&family=Frank+Ruhl+Libre:wght@500;700&family=IBM+Plex+Mono:wght@400;600&display=swap">
<style>
  :root{
    color-scheme: light dark;
    --ground:#EFEFED; --surface:#FFFFFF; --surface-2:#F6F6F4; --line:#D9DAD7;
    --ink:#14171A; --ink-2:#4A525A; --muted:#6E767E;
    --accent:#1F5F8B; --accent-soft:#E4EDF4; --accent-ink:#FFFFFF;
    --ok:#2E7D5B; --ok-soft:#E2F0E9;
    --warn:#A9701B; --warn-soft:#F6ECDA;
    --crit:#A33A2F; --crit-soft:#F7E4E1;
    --shadow:0 1px 2px rgba(20,23,26,.06), 0 8px 24px -16px rgba(20,23,26,.28);
    --radius:10px;
    --step--1:.8125rem; --step-0:.9375rem; --step-1:1.0625rem;
    --step-2:1.375rem; --step-3:1.875rem;
  }
  :root:not([data-theme="light"]){
    @media (prefers-color-scheme: dark){
      --ground:#101315; --surface:#171B1E; --surface-2:#1D2226; --line:#2A3136;
      --ink:#E7EAEC; --ink-2:#B3BBC2; --muted:#8A939B;
      --accent:#6FA8CF; --accent-soft:#1B2A36; --accent-ink:#0B1013;
      --ok:#68C79B; --ok-soft:#15251E;
      --warn:#E0AB5F; --warn-soft:#2A2114;
      --crit:#E58175; --crit-soft:#2C1815;
      --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 28px -18px rgba(0,0,0,.8);
    }
  }
  :root[data-theme="dark"]{
    --ground:#101315; --surface:#171B1E; --surface-2:#1D2226; --line:#2A3136;
    --ink:#E7EAEC; --ink-2:#B3BBC2; --muted:#8A939B;
    --accent:#6FA8CF; --accent-soft:#1B2A36; --accent-ink:#0B1013;
    --ok:#68C79B; --ok-soft:#15251E;
    --warn:#E0AB5F; --warn-soft:#2A2114;
    --crit:#E58175; --crit-soft:#2C1815;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 28px -18px rgba(0,0,0,.8);
  }

  *{box-sizing:border-box}
  /* בעמוד מוטמע אין לנו תגית <html dir="rtl"> משלנו, ולכן הכיווניות נקבעת כאן */
  body, .wrap, header.bar, .log{direction:rtl}
  body{
    margin:0; background:var(--ground); color:var(--ink);
    font:var(--step-0)/1.55 Assistant, "Segoe UI", system-ui, sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3{font-family:"Frank Ruhl Libre", Georgia, serif; font-weight:700; text-wrap:balance; margin:0}
  .mono{font-family:"IBM Plex Mono", ui-monospace, monospace; font-variant-numeric:tabular-nums}

  /* ---------- שלד ---------- */
  header.bar{
    position:sticky; top:0; z-index:20; background:var(--surface);
    border-bottom:1px solid var(--line); padding:.7rem 1.1rem;
    display:flex; gap:.6rem; align-items:center; flex-wrap:wrap;
  }
  header.bar h1{font-size:var(--step-1); letter-spacing:-.01em; margin-inline-end:.4rem}
  .wrap{max-width:1240px; margin:0 auto; padding:1.1rem}
  .cols{display:grid; grid-template-columns:320px minmax(0,1fr); gap:1.1rem; align-items:start}
  @media (max-width:900px){ .cols{grid-template-columns:1fr} }

  /* ---------- פקדים ---------- */
  select,button,input{font:inherit; color:var(--ink); background:var(--surface); border:1px solid var(--line);
    border-radius:8px; padding:.42rem .6rem}
  select{max-width:190px}
  button{cursor:pointer; transition:border-color .12s, background .12s}
  button:hover{border-color:var(--accent)}
  button:focus-visible, select:focus-visible{outline:2px solid var(--accent); outline-offset:2px}
  button.primary{background:var(--accent); color:var(--accent-ink); border-color:transparent; font-weight:700}
  button.primary:hover{filter:brightness(1.08)}
  button.ghost{background:transparent}
  .spacer{flex:1}

  /* ---------- כרטיסים ---------- */
  .card{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius);
    box-shadow:var(--shadow); padding:1rem; margin-bottom:1rem}
  .card > h2{font-size:var(--step-2); letter-spacing:-.015em}
  .rail .card{padding:.9rem}
  .eyebrow{font-size:var(--step--1); letter-spacing:.09em; text-transform:uppercase; color:var(--muted); font-weight:600}

  .kv{display:grid; grid-template-columns:auto 1fr; gap:.3rem .7rem; font-size:var(--step--1); margin-top:.6rem}
  .kv dt{color:var(--muted)}
  .kv dd{margin:0; font-weight:600}

  .score{display:flex; align-items:baseline; gap:.5rem; margin-top:.15rem}
  .score b{font-family:"IBM Plex Mono", monospace; font-size:var(--step-3); line-height:1; font-variant-numeric:tabular-nums}

  .chip{display:inline-flex; align-items:center; gap:.3rem; border:1px solid var(--line);
    background:var(--surface-2); color:var(--ink-2); border-radius:999px;
    padding:.12rem .55rem; font-size:var(--step--1); white-space:nowrap}
  .chip.mono{letter-spacing:-.01em}
  .chip.key{background:var(--accent-soft); border-color:transparent; color:var(--accent); font-weight:600}
  .chip.ok{background:var(--ok-soft); color:var(--ok); border-color:transparent}
  .chip.warn{background:var(--warn-soft); color:var(--warn); border-color:transparent}
  .chip.crit{background:var(--crit-soft); color:var(--crit); border-color:transparent}
  .chips{display:flex; flex-wrap:wrap; gap:.35rem}

  .note{font-size:var(--step--1); color:var(--ink-2); margin:.5rem 0 0}
  .rule{height:1px; background:var(--line); border:0; margin:.85rem 0}

  /* ---------- ממצאי איכות ---------- */
  ul.findings{list-style:none; margin:.6rem 0 0; padding:0; display:flex; flex-direction:column; gap:.4rem}
  ul.findings li{display:grid; grid-template-columns:auto 1fr; gap:.5rem; font-size:var(--step--1);
    border-inline-start:3px solid var(--line); padding-inline-start:.55rem}
  li.lv-error{border-color:var(--crit)} li.lv-warning{border-color:var(--warn)} li.lv-info{border-color:var(--accent)}

  /* ---------- ימי אימון ---------- */
  .days{display:grid; grid-template-columns:repeat(auto-fill,minmax(330px,1fr)); gap:1rem}
  .day header{display:flex; align-items:baseline; gap:.5rem; flex-wrap:wrap}
  .day h3{font-size:var(--step-1)}
  .day .meta{font-size:var(--step--1); color:var(--muted)}

  .ex{border-top:1px solid var(--line); padding:.7rem 0 .55rem; display:grid;
    grid-template-columns:1.6rem 1fr; gap:.1rem .55rem}
  .ex:last-child{padding-bottom:0}
  .ex .idx{font-family:"IBM Plex Mono", monospace; font-size:var(--step--1); color:var(--muted); padding-top:.15rem}
  .ex .name{font-weight:700; font-size:var(--step-0)}
  .ex .role{font-size:var(--step--1); color:var(--muted)}
  .ex .body{grid-column:2}
  .rx{display:flex; flex-wrap:wrap; gap:.3rem; margin:.4rem 0 0}
  .load{background:var(--accent-soft); color:var(--accent); border-radius:6px; padding:.1rem .45rem;
    font-family:"IBM Plex Mono", monospace; font-weight:600; font-size:var(--step--1)}
  ul.cues{margin:.45rem 0 0; padding-inline-start:1.1rem; font-size:var(--step--1); color:var(--ink-2)}
  ul.cues li{margin-bottom:.12rem}

  /* ---------- מרשם התרגיל ---------- */
  .pres{display:flex; flex-wrap:wrap; gap:.35rem; margin:.5rem 0 0}
  .pcell{display:flex; flex-direction:column; gap:.1rem; background:var(--surface-2); border:1px solid var(--line);
    border-radius:8px; padding:.28rem .55rem; min-width:68px}
  .pcell > span{font-size:.68rem; letter-spacing:.04em; color:var(--muted); text-transform:uppercase; white-space:nowrap}
  .pcell > b{font-size:var(--step-0); font-weight:700; white-space:nowrap}
  .pcell.key{background:var(--accent-soft); border-color:transparent}
  .pcell.key > span{color:var(--accent)}
  .kgwrap{display:flex; align-items:baseline; gap:.25rem}
  .kgin{width:58px; padding:.05rem .2rem; font-family:"IBM Plex Mono",monospace; font-weight:700;
    font-size:var(--step-0); text-align:center; border:1px solid var(--line); border-radius:6px;
    background:var(--surface); color:var(--accent)}
  .kgin:focus{outline:2px solid var(--accent); outline-offset:1px}
  .kgwrap b{font-size:var(--step--1); color:var(--accent); font-weight:600; white-space:nowrap}
  .loadnote{font-size:.75rem; color:var(--muted); margin:.3rem 0 0}

  /* ---------- הערות ---------- */
  .exnotes{margin-top:.5rem; display:flex; flex-direction:column; gap:.25rem}
  .exnote{display:flex; align-items:center; gap:.4rem; font-size:var(--step--1);
    background:var(--warn-soft); border-inline-start:3px solid var(--warn); border-radius:6px; padding:.25rem .5rem}
  .exnote.off{background:var(--surface-2); border-color:var(--line); color:var(--muted); text-decoration:line-through}
  .exnote button{padding:.05rem .4rem; font-size:.72rem; background:transparent; border-color:transparent; color:inherit}
  .exnote button:hover{border-color:currentColor}
  .notecard{border:1px solid var(--line); border-radius:8px; padding:.55rem .65rem; margin-bottom:.45rem;
    font-size:var(--step--1)}
  .notecard.off{opacity:.55}
  .notecard button{padding:.12rem .45rem; font-size:.75rem}

  .acts{display:flex; flex-wrap:wrap; gap:.3rem; margin-top:.55rem}
  .acts button{padding:.2rem .55rem; font-size:var(--step--1); border-radius:999px; background:var(--surface-2)}
  .acts button.act-key{background:var(--accent-soft); color:var(--accent); border-color:transparent; font-weight:600}
  .acts button.act-alert{color:var(--crit)}
  .acts button.act-alert:hover{border-color:var(--crit)}
  details.more{margin-top:.35rem}
  details.more summary{list-style:none; display:inline-flex; align-items:center; gap:.25rem;
    font-size:var(--step--1); color:var(--muted); padding:.1rem 0}
  details.more summary::-webkit-details-marker{display:none}
  details.more summary::before{content:'⌄'; font-size:.9em}
  details.more[open] summary::before{content:'⌃'}
  details.more summary:hover{color:var(--accent)}
  .swap{display:flex; gap:.35rem; margin-top:.45rem}
  .swap select{flex:1; font-size:var(--step--1); max-width:none}

  /* ---------- יומן ---------- */
  .log{position:fixed; inset-block-end:1rem; inset-inline-end:1rem; width:min(390px,calc(100vw - 2rem));
    max-height:44vh; overflow:auto; background:var(--surface); border:1px solid var(--line);
    border-radius:var(--radius); box-shadow:var(--shadow); padding:.8rem; font-size:var(--step--1); z-index:30}
  .log[hidden]{display:none}
  .log-head{display:flex; align-items:center; gap:.4rem; margin-bottom:.4rem}
  .log-head h4{margin:0; flex:1; font-size:var(--step--1); letter-spacing:.09em; text-transform:uppercase; color:var(--muted)}
  .log-head button{padding:.1rem .45rem; font-size:var(--step--1); border-color:transparent; color:var(--muted)}
  .log-head button:hover{color:var(--accent); border-color:var(--accent)}
  .log .entry{border-top:1px solid var(--line); padding:.45rem 0}
  .log .entry:first-of-type{border-top:0}
  .log b{color:var(--accent)}

  /* ---------- מסלול השלבים ---------- */
  .steps{display:flex; align-items:stretch; gap:0; margin:0 0 1.1rem; border:1px solid var(--line);
    border-radius:var(--radius); overflow:hidden; background:var(--surface)}
  .steps a{flex:1; display:flex; gap:.6rem; align-items:center; padding:.7rem .9rem; text-decoration:none;
    color:var(--muted); border-inline-start:1px solid var(--line); cursor:pointer; background:transparent}
  .steps a:first-child{border-inline-start:0}
  .steps a .n{width:26px; height:26px; flex:none; border-radius:50%; display:grid; place-items:center;
    background:var(--surface-2); color:var(--muted); font-family:"IBM Plex Mono",monospace; font-size:.8rem; font-weight:600}
  .steps a .t{display:flex; flex-direction:column; line-height:1.25}
  .steps a .t b{color:var(--ink); font-size:var(--step-0)}
  .steps a .t span{font-size:var(--step--1)}
  .steps a[aria-current="true"]{background:var(--accent-soft)}
  .steps a[aria-current="true"] .n{background:var(--accent); color:var(--accent-ink)}
  .steps a[data-done="true"] .n{background:var(--ok); color:var(--surface)}
  @media (max-width:760px){ .steps a .t span{display:none} }

  /* ---------- כותרת מסך ---------- */
  .hero{display:flex; align-items:flex-end; gap:1rem; flex-wrap:wrap; margin-bottom:.9rem}
  .hero h2{font-size:var(--step-3); letter-spacing:-.02em; line-height:1.1}
  .hero p{margin:.3rem 0 0; color:var(--ink-2); font-size:var(--step-0); max-width:62ch}
  .tiles{display:flex; gap:.5rem; flex-wrap:wrap; margin-inline-start:auto}
  .tile{background:var(--surface); border:1px solid var(--line); border-radius:10px; padding:.5rem .8rem; min-width:96px}
  .tile b{display:block; font-family:"IBM Plex Mono",monospace; font-size:var(--step-2); line-height:1.1;
    font-variant-numeric:tabular-nums}
  .tile span{font-size:var(--step--1); color:var(--muted)}
  .tile.accent b{color:var(--accent)}

  /* ---------- טפסים ---------- */
  .tabs{display:flex; gap:.25rem; background:var(--surface-2); padding:.2rem; border-radius:10px}
  .tabs button{background:transparent; border:0; padding:.35rem .8rem; border-radius:8px; font-weight:600; color:var(--muted)}
  .tabs button[aria-current="true"]{background:var(--surface); color:var(--ink); box-shadow:var(--shadow)}
  fieldset{border:0; border-top:1px solid var(--line); padding:.9rem 0 .2rem; margin:0 0 .6rem}
  fieldset:first-of-type{border-top:0; padding-top:.2rem}
  legend{font-family:"Frank Ruhl Libre",Georgia,serif; font-weight:700; padding:0; font-size:var(--step-1);
    letter-spacing:-.01em; margin-bottom:.15rem}
  .fields{display:grid; grid-template-columns:repeat(auto-fit,minmax(190px,1fr)); gap:.7rem}
  label.f{display:flex; flex-direction:column; gap:.22rem; font-size:var(--step--1); color:var(--muted)}
  label.f > span.req::after{content:' *'; color:var(--crit)}
  label.f input, label.f select, label.f textarea{color:var(--ink); background:var(--surface); width:100%}
  label.f textarea{min-height:64px; resize:vertical; font-family:inherit}
  .hint{font-size:var(--step--1); color:var(--muted); margin:.3rem 0 0}
  /* ---------- בורר ציוד ---------- */
  .presets{display:flex; gap:.35rem; flex-wrap:wrap; margin:.2rem 0 .8rem}
  .presets button{border-radius:999px; padding:.28rem .75rem; font-size:var(--step--1); background:var(--surface-2)}
  .presets button:hover{background:var(--accent-soft); color:var(--accent); border-color:transparent}
  .eqsearch{width:100%; max-width:320px; margin-bottom:.7rem}
  .eqcat{margin-bottom:.85rem}
  .eqcat > h4{font-size:var(--step--1); letter-spacing:.08em; text-transform:uppercase; color:var(--muted);
    margin:0 0 .4rem; font-family:Assistant,sans-serif; font-weight:700}
  .eqgrid{display:flex; flex-wrap:wrap; gap:.35rem}
  .eqchip{display:inline-flex; align-items:center; gap:.35rem; border:1px solid var(--line); background:var(--surface);
    border-radius:999px; padding:.22rem .3rem .22rem .7rem; font-size:var(--step--1); cursor:pointer;
    transition:background .12s, border-color .12s, color .12s}
  .eqchip:hover{border-color:var(--accent)}
  .eqchip[aria-pressed="true"]{background:var(--accent-soft); border-color:transparent; color:var(--accent); font-weight:600}
  .eqchip .qty{width:44px; padding:.05rem .25rem; font-size:var(--step--1); border-radius:6px;
    border:1px solid var(--line); background:var(--surface); color:var(--ink); text-align:center;
    font-family:"IBM Plex Mono",monospace}
  .eqchip .qty[hidden]{display:none}
  .eqchip .mark{width:16px; height:16px; border-radius:50%; border:1.5px solid var(--line); flex:none}
  .eqchip[aria-pressed="true"] .mark{background:var(--accent); border-color:var(--accent); position:relative}
  .eqchip[aria-pressed="true"] .mark::after{content:'✓'; position:absolute; inset:0; display:grid; place-items:center;
    color:var(--accent-ink); font-size:11px; font-weight:700}
  .listrow{display:flex; align-items:center; gap:.5rem; padding:.45rem .1rem; border-top:1px solid var(--line)}
  .listrow:first-of-type{border-top:0}
  .listrow strong{font-weight:700}
  .grow{flex:1}
  .banner{border-inline-start:3px solid var(--accent); background:var(--accent-soft); color:var(--ink);
    padding:.55rem .7rem; border-radius:8px; font-size:var(--step--1); margin-bottom:.8rem}
  .banner.warn{border-color:var(--warn); background:var(--warn-soft)}
  .banner.crit{border-color:var(--crit); background:var(--crit-soft)}
  .probe{border:1px solid var(--warn); background:var(--warn-soft); border-radius:var(--radius); padding:.75rem; margin-top:.7rem}
  .probe.open{border-color:var(--accent); background:var(--accent-soft)}
  .probe h4{margin:0 0 .2rem; font-size:var(--step-0)}
  .desc{font-size:var(--step--1); color:var(--ink-2); margin:.25rem 0 0; line-height:1.5}
  .filebtn{display:inline-flex; align-items:center; gap:.4rem; border:1px solid var(--line); background:var(--surface);
    border-radius:8px; padding:.42rem .7rem; cursor:pointer; font-size:var(--step-0)}
  .filebtn:hover{border-color:var(--accent); color:var(--accent)}
  .thumbs{display:flex; gap:.4rem; flex-wrap:wrap; margin-top:.5rem}
  .thumbs img{width:70px; height:70px; object-fit:cover; border-radius:8px; border:1px solid var(--line)}

  table{width:100%; border-collapse:collapse; font-size:var(--step--1)}
  th,td{text-align:start; padding:.28rem .4rem; border-bottom:1px solid var(--line)}
  th{color:var(--muted); font-weight:600}
  td.num{font-family:"IBM Plex Mono", monospace; font-variant-numeric:tabular-nums}
  .bar-track{height:5px; background:var(--surface-2); border-radius:3px; overflow:hidden; min-width:60px}
  .bar-fill{height:100%; background:var(--accent)}
  .bar-fill.over{background:var(--warn)}
  details summary{cursor:pointer; color:var(--muted); font-size:var(--step--1)}
  .empty{color:var(--muted); font-size:var(--step--1); border:1px dashed var(--line); border-radius:10px;
    padding:1rem; text-align:center}
  .optional > summary{margin:.2rem 0 .5rem; font-weight:600; color:var(--accent)}
  .optional[open] > summary{margin-bottom:.7rem}
  .daypick{display:flex; gap:.3rem; flex-wrap:wrap}
  .daypick label{display:inline-flex; align-items:center; gap:.3rem; border:1px solid var(--line); border-radius:999px;
    padding:.2rem .6rem; font-size:var(--step--1); cursor:pointer}
  .daypick input{accent-color:var(--accent)}
  @media (prefers-reduced-motion:reduce){ *{transition:none !important; animation:none !important} }

  /* ---------- הדפסה: דף נקי למסירה למתאמן ---------- */
  @media print{
    :root{--ground:#fff; --surface:#fff; --surface-2:#fff; --line:#c9cbc8; --ink:#000; --ink-2:#333;
      --muted:#555; --accent:#1F5F8B; --accent-soft:#eef4f8; --shadow:none}
    header.bar, .steps, .tabs, .log, .acts, details.more, .swap, #programSteps,
    #viewStudio, #viewTrainees, .tiles, #print, #gen, #genAll, #next, .bar{display:none !important}
    body{background:#fff}
    .wrap{max-width:none; padding:0}
    .cols{display:block}
    .card{break-inside:avoid; box-shadow:none; border-color:#c9cbc8; margin-bottom:.6rem}
    .days{display:block}
    .day{break-inside:avoid; page-break-inside:avoid}
    .ex{break-inside:avoid}
    a[href]::after{content:''}
  }
</style>
</head>
<body>

<header class="bar">
  <h1>מסך המאמן</h1>
  <nav class="tabs" id="tabs">
    <button data-view="studio">1 · סטודיו</button>
    <button data-view="trainees">2 · מתאמנים</button>
    <button data-view="program">3 · אימון</button>
  </nav>
  <span class="spacer"></span>
  <span id="mode" class="chip"></span>
  <span id="status" class="chip"></span>
  <button class="ghost" id="theme" aria-label="מצב תצוגה">◐</button>
</header>

<main class="wrap">
  <section id="viewStudio" hidden></section>
  <section id="viewTrainees" hidden></section>
  <section id="viewProgram" hidden>
    <div id="programSteps"></div>
    <div class="bar" style="position:static; background:transparent; border:0; padding:0 0 .9rem">
      <select id="studio" aria-label="בחירת סטודיו"></select>
      <select id="trainee" aria-label="בחירת מתאמן"></select>
      <button class="primary" id="gen">בנה תכנית</button>
      <button id="genAll">כל הסטודיו</button>
      <button id="next">שבוע הבא</button>
      <button id="print">הדפס / שמור PDF</button>
    </div>
    <div class="cols">
      <aside class="rail" id="rail"></aside>
      <section id="days"></section>
    </div>
  </section>
</main>

<aside class="log" id="log" hidden aria-live="polite">
  <div class="log-head">
    <h4>יומן פעילות</h4>
    <button class="ghost" id="logClear" title="נקה">נקה</button>
    <button class="ghost" id="logClose" aria-label="סגור">✕</button>
  </div>
  <div id="logBody"></div>
</aside>

<script type="module">
/*ENGINE*/

/* ==================================================================
   מסך המאמן — כל המנוע רץ כאן בדפדפן. אין שרת ואין שליחת נתונים החוצה.
   ================================================================== */

const $ = (s) => document.querySelector(s);
const STORE_KEY = 'studio-training/db/v2';

const state = { studios: [], trainees: [], program: null, view: 'program', server: false };

/* ==================================================================
   שכבת אחסון.
   כשהעמוד מוגש מהשרת של הסטודיו — הכול נשמר במסד המשותף וכל המאמנים
   רואים את אותו מידע. כשהוא נפתח כקובץ עצמאי אין שרת, ולכן הנתונים
   נשמרים בדפדפן הזה בלבד. המצב מוצג במפורש בראש המסך.
   ================================================================== */
const api = async (path, body, method) => {
  const res = await fetch(path, body
    ? { method: method || 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(body) }
    : {});
  const data = await res.json();
  if (data.error) throw new Error(data.error);
  return data;
};

const store = {
  async detect() {
    // עמוד שנפתח כקובץ מקומי או כארטיפקט אינו יכול לפנות לשרת כלל,
    // ואין טעם לנסות — הניסיון רק מייצר שגיאת רשת מיותרת בקונסול.
    if (!location.protocol.startsWith('http')) { state.server = false; return false; }
    try {
      const r = await fetch('/api/health', { cache: 'no-store' });
      state.server = r.ok && (await r.json()).ok === true;
    } catch { state.server = false; }
    return state.server;
  },
  async load() {
    if (state.server) {
      state.studios = await api('/api/studios');
      state.trainees = await api('/api/trainees');
      return;
    }
    let local = null;
    try { local = JSON.parse(localStorage.getItem(STORE_KEY) || 'null'); } catch { /* אחסון חסום */ }
    state.studios = local?.studios || structuredClone(STUDIOS);
    state.trainees = local?.trainees || structuredClone(TRAINEES);
  },
  persistLocal() {
    if (state.server) return;
    try {
      localStorage.setItem(STORE_KEY, JSON.stringify({ studios: state.studios, trainees: state.trainees }));
    } catch { /* אחסון חסום — הנתונים יישמרו רק לזמן הפעלה זו */ }
  },
  async saveStudio(studio) {
    if (state.server) {
      const r = await api('/api/studios', studio);
      await this.load();
      return r;
    }
    const id = studio.id || slugify(studio.name);
    const withId = { ...studio, id };
    state.studios = [...state.studios.filter((x) => x.id !== id), withId];
    this.persistLocal();
    const n = normalizeStudio(withId);
    return { ok: true, id, missing: missingStudioInfo(n) };
  },
  async saveTrainee(trainee) {
    if (state.server) {
      const r = await api('/api/trainees', trainee);
      await this.load();
      return r;
    }
    const id = trainee.id || `${slugify(trainee.name)}_${Math.random().toString(36).slice(2, 6)}`;
    const withId = { ...trainee, id };
    const v = validateInput(normalizeTrainee(withId), normalizeStudio(studioById(trainee.studioId)));
    if (!v.ok) return { ok: false, errors: v.errors, warnings: v.warnings };
    state.trainees = [...state.trainees.filter((x) => x.id !== id), withId];
    this.persistLocal();
    return { ok: true, id, warnings: v.warnings };
  },
  async updateTrainee(raw) {
    state.trainees = [...state.trainees.filter((x) => x.id !== raw.id), raw];
    if (state.server) { try { await api('/api/trainees', raw); } catch { /* נשמר מקומית בכל מקרה */ } }
    this.persistLocal();
  },
};

const slugify = (name) => String(name).trim().replace(/\s+/g, '_').replace(/[^\w֐-׿_-]/g, '') || `x_${Date.now()}`;
const studioById = (id) => state.studios.find((s) => s.id === id);
const traineeById = (id) => state.trainees.find((t) => t.id === id);
const esc = (v) => String(v ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

/** מה חסר בפרופיל הסטודיו כדי שהתכניות יהיו מדויקות. */
function missingStudioInfo(studio) {
  const missing = [];
  if (studio.equipment.size <= 1) missing.push('לא נבחר ציוד — התכניות ייבנו ממשקל גוף בלבד.');
  if (!studio.dumbbellMaxKg && studio.equipment.get('dumbbell')) missing.push('לא הוגדר המשקל הכבד ביותר של המשקולות.');
  if (!studio.ceilingHeightCm) missing.push('לא הוגדר גובה תקרה.');
  return missing;
}

function log(title, lines) {
  const el = $('#log');
  el.hidden = false;
  const body = Array.isArray(lines) ? lines : [lines];
  const entries = $('#logBody');
  entries.insertAdjacentHTML('afterbegin',
    `<div class="entry"><b>${title}</b><br>${body.filter(Boolean).join('<br>')}</div>`);
  // שומרים את היומן קצר — הוא עוזר בזמן אמת, לא ארכיון
  while (entries.children.length > 12) entries.lastElementChild.remove();
}

function status(text, kind = '') {
  const el = $('#status');
  el.className = `chip ${kind}`;
  el.textContent = text;
}

/* ---------------------------------------------------------------- הפעלה */
async function boot() {
  await store.detect();
  await store.load();
  $('#mode').className = `chip ${state.server ? 'ok' : ''}`;
  $('#mode').textContent = state.server ? 'מחובר למסד הסטודיו' : 'נשמר בדפדפן הזה';
  $('#mode').title = state.server
    ? 'הנתונים נשמרים בשרת הסטודיו וכל המאמנים רואים את אותו מידע.'
    : 'העמוד נפתח ללא שרת, ולכן הנתונים נשמרים בדפדפן הזה בלבד. להפעלת מסד משותף: npm start.';

  document.querySelectorAll('#tabs button').forEach((b) => { b.onclick = () => setView(b.dataset.view); });
  $('#theme').onclick = toggleTheme;
  $('#logClose').onclick = () => { $('#log').hidden = true; };
  $('#logClear').onclick = () => { $('#logBody').innerHTML = ''; $('#log').hidden = true; };
  $('#studio').onchange = () => { fillTrainees(); generate(); };
  $('#trainee').onchange = generate;
  $('#gen').onclick = generate;
  $('#genAll').onclick = generateAll;
  $('#next').onclick = nextWeek;
  $('#print').onclick = () => window.print();

  fillStudios();
  setView(state.trainees.length ? 'program' : 'studio');
}

function toggleTheme() {
  const cur = document.documentElement.getAttribute('data-theme');
  const dark = cur ? cur === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
  document.documentElement.setAttribute('data-theme', dark ? 'light' : 'dark');
}

/** הודעת אישור קצרה שמוצגת בראש המסך הבא. */
function flash(message, kind = '') {
  state.flash = { message, kind };
}

function flashHtml() {
  if (!state.flash) return '';
  const { message, kind } = state.flash;
  state.flash = null;
  return `<div class="banner ${kind}">${message}</div>`;
}

function setView(view) {
  state.view = view;
  document.querySelectorAll('#tabs button').forEach((b) => b.setAttribute('aria-current', String(b.dataset.view === view)));
  $('#viewStudio').hidden = view !== 'studio';
  $('#viewTrainees').hidden = view !== 'trainees';
  $('#viewProgram').hidden = view !== 'program';
  if (view === 'studio') renderStudioView();
  if (view === 'trainees') renderTraineesView();
  if (view === 'program') {
    $('#programSteps').innerHTML = stepsBar('program') + flashHtml();
    wireSteps();
    fillStudios();
    generate();
  }
}

function fillStudios() {
  const sel = $('#studio');
  const cur = sel.value;
  sel.innerHTML = state.studios.map((s) => `<option value="${esc(s.id)}">${esc(s.name)}</option>`).join('');
  if (cur && state.studios.some((s) => s.id === cur)) sel.value = cur;
  fillTrainees();
}

function fillTrainees() {
  const list = state.trainees.filter((t) => t.studioId === $('#studio').value);
  $('#trainee').innerHTML = list.length
    ? list.map((t) => `<option value="${esc(t.id)}">${esc(t.name)}</option>`).join('')
    : '<option value="">— אין מתאמנים —</option>';
}

/* ==================================================================
   מסלול השלבים — נוכח בכל מסך, כדי שתמיד ברור איפה נמצאים ומה הלאה
   ================================================================== */
function stepsBar(current) {
  const hasStudio = state.studios.length > 0;
  const hasTrainee = state.trainees.length > 0;
  const steps = [
    { view: 'studio', n: 1, t: 'הסטודיו', s: hasStudio ? `${state.studios.length} רשומים` : 'ציוד, משקלים ומרחב', done: hasStudio },
    { view: 'trainees', n: 2, t: 'המתאמנים', s: hasTrainee ? `${state.trainees.length} רשומים` : 'מטרות, פציעות ופרטים', done: hasTrainee },
    { view: 'program', n: 3, t: 'האימון', s: 'תכנית שבועית ומשוב', done: false },
  ];
  return `<nav class="steps">${steps.map((x) => `
    <a data-goto="${x.view}" aria-current="${x.view === current}" data-done="${x.done && x.view !== current}">
      <span class="n">${x.done && x.view !== current ? '✓' : x.n}</span>
      <span class="t"><b>${x.t}</b><span>${esc(x.s)}</span></span>
    </a>`).join('')}</nav>`;
}

function wireSteps() {
  document.querySelectorAll('[data-goto]').forEach((a) => { a.onclick = () => setView(a.dataset.goto); });
}

/* ==================================================================

let eqState = new Map();   // item -> count

/** כמה תרגילים נפתחים עם הציוד שנבחר — משוב חי בזמן המילוי. */
function studioLiveStats() {
  const equipment = [...eqState.entries()].map(([item, count]) => ({ item, count }));
  const studio = normalizeStudio({ id: 'preview', equipment });
  const trainee = normalizeTrainee({ id: 'preview', level: 'intermediate' });
  const pool = buildCandidatePool(EXERCISES, trainee, studio);
  return { exercises: pool.eligible.length, items: eqState.size };
}

function refreshStudioStats() {
  const s = studioLiveStats();
  const ex = $('#statEx'); const eq = $('#statEq');
  if (ex) ex.textContent = s.exercises;
  if (eq) eq.textContent = s.items;
}

function renderEquipmentChecklist() {
  $('#eqCats').innerHTML = EQUIPMENT_CATEGORIES.map((c) => `
    <div class="eqcat" data-cat="${c.key}">
      <h4>${esc(c.label)}</h4>
      <div class="eqgrid">
        ${c.items.map((id) => `
          <button type="button" class="eqchip" data-eq="${id}" aria-pressed="false"
                  title="${esc(EQUIPMENT_LABELS[id] || id)}">
            <span class="mark"></span>
            <span class="nm">${esc(EQUIPMENT_LABELS[id] || id)}</span>
            <input class="qty" type="number" min="1" value="1" hidden aria-label="כמות">
          </button>`).join('')}
      </div>
    </div>`).join('');

  document.querySelectorAll('.eqchip').forEach((chip) => {
    const id = chip.dataset.eq;
    const qty = chip.querySelector('.qty');
    chip.onclick = (e) => {
      if (e.target === qty) return;                 // לחיצה על שדה הכמות אינה מבטלת בחירה
      const on = chip.getAttribute('aria-pressed') === 'true';
      setEquipment(id, !on, +qty.value || 1);
    };
    qty.onclick = (e) => e.stopPropagation();
    qty.oninput = () => { if (eqState.has(id)) { eqState.set(id, +qty.value || 1); refreshStudioStats(); } };
  });
}

function setEquipment(id, on, count = 1) {
  const chip = document.querySelector(`.eqchip[data-eq="${id}"]`);
  if (!chip) return;
  const qty = chip.querySelector('.qty');
  chip.setAttribute('aria-pressed', String(on));
  qty.hidden = !on;
  if (on) { eqState.set(id, count); qty.value = count; } else eqState.delete(id);
  refreshStudioStats();
}

function applyPreset(key) {
  document.querySelectorAll('.eqchip').forEach((c) => setEquipment(c.dataset.eq, false));
  if (key === 'clear') return;
  const preset = EQUIPMENT_PRESETS[key];
  for (const id of preset.items) setEquipment(id, true, defaultCount(id));
  const styleSel = $('#studioForm')?.style;
  if (styleSel && EQUIPMENT_PRESETS[key]) {
    const map = { gym: 'gym', functional: 'functional', boutique: 'small_group', pilates: 'pilates', boxing: 'boxing', senior: 'senior', home: 'personal' };
    if (map[key]) styleSel.value = map[key];
  }
  log('נבחרה חבילת ציוד', `${esc(preset.label)} — ${preset.items.length} פריטים. אפשר להוסיף ולהסיר לפי מה שבאמת יש.`);
}

/** כמות התחלתית סבירה לפי סוג הפריט. */
function defaultCount(id) {
  if (['dumbbell', 'kettlebell', 'resistance_band', 'mini_band', 'mat', 'step', 'chair', 'jump_rope', 'trx'].includes(id)) return 8;
  if (['bench_flat', 'plyo_box', 'medicine_ball', 'foam_roller', 'stable_support', 'reformer'].includes(id)) return 4;
  return 1;
}

function filterEquipment(term) {
  const q = term.toLowerCase();
  document.querySelectorAll('.eqcat').forEach((cat) => {
    let visible = 0;
    cat.querySelectorAll('.eqchip').forEach((chip) => {
      const match = !q || chip.querySelector('.nm').textContent.toLowerCase().includes(q) || chip.dataset.eq.includes(q);
      chip.style.display = match ? '' : 'none';
      if (match) visible += 1;
    });
    cat.style.display = visible ? '' : 'none';
  });
}

async function showVisionNote() {
  if (!state.server) {

  }

function onPhotoPicked(e) {
  const files = [...e.target.files].slice(0, 4);
  document.querySelector('.filebtn').textContent = files.length ? `${files.length} תמונות נבחרו` : 'צלם או בחר תמונות';
  pendingPhotos = [];
  $('#thumbs').innerHTML = '';
  for (const f of files) {
    const reader = new FileReader();
    reader.onload = () => {
      pendingPhotos.push(reader.result);
      $('#thumbs').insertAdjacentHTML('beforeend', `<img src="${reader.result}" alt="תמונת ציוד">`);
    };
    reader.readAsDataURL(f);
  }
}

async function onIdentify() {
  if (!pendingPhotos.length) { log('זיהוי ציוד', 'יש לבחור תמונה קודם.'); return; }
  if (!state.server) { log('זיהוי ציוד', 'זיהוי אוטומטי דורש את שרת הסטודיו. אפשר לסמן מהרשימה או להתחיל מחבילה מוכנה.'); return; }
  $('#identifyBtn').disabled = true;
  $('#identifyBtn').textContent = 'מזהה…';
  try {
    const r = await api('/api/equipment/identify', { images: pendingPhotos });
    if (!r.ok) { log('זיהוי ציוד', esc(r.error)); return; }
    let marked = 0;
    for (const it of r.items) { setEquipment(it.id, true, it.count); marked += 1; }
    log('זיהוי ציוד מהתמונה', [
      `סומנו ${marked} פריטים — לעבור ולאשר לפני שמירה.`,
      ...r.items.map((i) => `${esc(i.label)} ×${i.count}${i.weightsVisible ? ` · ${esc(i.weightsVisible)}` : ''}`),
      r.unrecognized?.length ? `לא זוהו: ${r.unrecognized.map(esc).join(', ')}` : '',
    ]);
  } catch (err) {
    log('זיהוי ציוד נכשל', esc(err.message));
  } finally {
    $('#identifyBtn').disabled = false;
    $('#identifyBtn').textContent = 'זהה ציוד מהתמונה';
  }
}

async function onStudioSubmit(e) {
  e.preventDefault();
  const f = new FormData(e.target);
  const equipment = [...eqState.entries()].map(([item, count]) => ({ item, count }));

  const studio = {
    name: f.get('name'),
    style: f.get('style'),
    sessionMinutes: +f.get('sessionMinutes'),
    concurrentTrainees: +f.get('concurrentTrainees'),
    trainersOnFloor: +f.get('trainersOnFloor'),
    ceilingHeightCm: +f.get('ceilingHeightCm'),
    spaceLevel: f.get('spaceLevel'),
    noiseRestricted: f.get('noiseRestricted') === 'true',
    climateControlled: f.get('climateControlled') === 'true',
    allowSupersets: f.get('allowSupersets') !== 'false',
    preferredSplit: f.get('preferredSplit') || null,
    dumbbellMaxKg: +f.get('dumbbellMaxKg') || null,
    weightIncrementKg: +f.get('weightIncrementKg') || 2.5,
    equipment,
    notes: f.get('notes'),
    profile: { contact: f.get('contact'), dumbbellMinKg: +f.get('dumbbellMinKg') || null, barWeightKg: +f.get('barWeightKg') || null },
  };

  try {
    const r = await store.saveStudio(studio);
    if (state.server && pendingPhotos.length) {
      for (const dataUrl of pendingPhotos) await api('/api/equipment/photo', { studioId: r.id, dataUrl });
    }
    pendingPhotos = [];
    fillStudios();
    $('#studio').value = r.id;
    fillTrainees();
    const stats = studioLiveStats();
    flash(`<b>${esc(studio.name)} נשמר.</b> ${equipment.length} פריטי ציוד · ${stats.exercises} תרגילים אפשריים למתאמן ממוצע.
      ${(r.missing || []).length ? `<br>כדאי להשלים: ${r.missing.map(esc).join(' ')}` : 'עכשיו אפשר לרשום מתאמנים.'}`,
      (r.missing || []).length ? 'warn' : '');
    setView('trainees');
  } catch (err) {
    $('#studioMsg').textContent = `שגיאה: ${err.message}`;
  }
}

function constraintOptionsHtml() {
  const groups = {};
  for (const [id, c] of Object.entries(CONSTRAINTS)) (groups[c.region] ||= []).push([id, c.name]);
  const regionLabel = {
    shoulder: 'כתף', spine: 'גב ועמוד שדרה', knee: 'ברך', elbow: 'מרפק', wrist: 'שורש כף יד',
    hip: 'ירך', ankle: 'קרסול', neck: 'צוואר', systemic: 'מצבים רפואיים כלליים',
  };
  return Object.entries(groups).map(([region, items]) => `
    <optgroup label="${esc(regionLabel[region] || region)}">
      ${items.map(([id, name]) => `<option value="${esc(id)}">${esc(name)}</option>`).join('')}
    </optgroup>`).join('');
}

async function onTraineeSubmit(e) {
  e.preventDefault();
  const f = new FormData(e.target);
  const constraints = [...document.querySelectorAll('[data-crow]')].map((row) => ({
    id: row.querySelector('[data-cid]').value,
    severity: row.querySelector('[data-csev]').value,
    side: row.querySelector('[data-cside]').value || null,
    notes: row.querySelector('[data-cnote]').value,
  }));

  const trainee = {
    name: f.get('name'), studioId: f.get('studioId'),
    age: +f.get('age') || 35, sex: f.get('sex'),
    heightCm: +f.get('heightCm') || null, weightKg: +f.get('weightKg') || null,
    level: f.get('level'), trainingAgeMonths: +f.get('trainingAgeMonths') || 0,
    primaryGoal: f.get('primaryGoal'), goals: [f.get('primaryGoal')],
    daysPerWeek: +f.get('daysPerWeek'), sessionMinutes: +f.get('sessionMinutes'),
    preferredDays: f.getAll('preferredDays'),
    focusMuscles: f.getAll('focusMuscles'), dislikes: f.getAll('dislikes'), likes: f.getAll('likes'),
    varietyPreference: f.get('varietyPreference'), mesocycleLength: +f.get('mesocycleLength') || 4,
    units: f.get('units'),
    constraints, medicalClearance: f.get('medicalClearance') === 'true',
    sport: f.get('sport'), externalSessions: +f.get('externalSessions') || 0,
    lifestyle: f.get('lifestyle'), cyclePhase: f.get('cyclePhase'),
    travelWeek: f.get('travelWeek') === 'true',
    medications: f.get('medications') ? [f.get('medications')] : [],
    sleepQuality: +f.get('sleepQuality'), stressLevel: +f.get('stressLevel'),
    nutritionAdherence: +f.get('nutritionAdherence'),
    coach: f.get('coach') || '', startDate: f.get('startDate') || null,
    targetDate: f.get('targetDate') || null, goalDetail: f.get('goalDetail') || '',
    preferredTime: f.get('preferredTime') || 'any',
    bodyFatPct: +f.get('bodyFatPct') || null, restingHR: +f.get('restingHR') || null,
    bloodPressure: f.get('bloodPressure') || '',
    pastInjuries: f.get('pastInjuries') || '',
    knownMovements: f.getAll('knownMovements'),
    notes: f.get('notes'), phone: f.get('phone'),
  };

  try {
    const r = await store.saveTrainee(trainee);
    if (!r.ok) { log('לא ניתן לרשום את המתאמן', r.errors.map(esc)); return; }
    flash(`<b>${esc(trainee.name)} נרשם${trainee.sex === 'female' ? 'ה' : ''}.</b> התכנית השבועית מוכנה למטה.
      ${r.warnings?.length ? `<br>${r.warnings.map(esc).join('<br>')}` : ''}`,
      r.warnings?.length ? 'warn' : '');
    $('#studio').value = trainee.studioId;
    fillTrainees();
    $('#trainee').value = r.id;
    setView('program');
  } catch (err) {
    $('#traineeMsg').textContent = `שגיאה: ${err.message}`;
  }
}

/* ==================================================================
   שלב 3 — התכנית
   ================================================================== */
function generate() {
  if (state.view !== 'program') return;
  const t = traineeById($('#trainee').value);
  if (!t) {
    $('#rail').innerHTML = '';
    $('#days').innerHTML = '<p class="empty">אין מתאמנים בסטודיו הזה. אפשר לרשום מתאמן בשלב 2.</p>';
    return;
  }
  const res = buildProgram(t, studioById(t.studioId));
  if (!res.ok) {
    state.program = null;
    $('#rail').innerHTML = '';
    $('#days').innerHTML = `<div class="card"><h2>לא ניתן להפיק תכנית</h2>
      <ul class="findings">${res.errors.map((e) => `<li class="lv-error"><span class="chip crit">חסימה</span><span>${esc(e)}</span></li>`).join('')}</ul></div>`;
    status('נדרשת פעולה', 'crit');
    return;
  }
  state.program = res.program;
  render();
  status(`תכנית מוכנה · ציון ${res.program.qa.score}`, res.program.qa.passed ? 'ok' : 'warn');
}

function generateAll() {
  const studio = studioById($('#studio').value);
  const list = state.trainees.filter((t) => t.studioId === studio.id);
  const batch = buildStudioPrograms(list, studio);
  log(`${esc(studio.name)} — ${batch.total} תכניות`, batch.results.map((r) => (r.ok
    ? `${esc(r.name)}: ציון ${r.program.qa.score}${r.program.qa.passed ? '' : ' — נדרשת בדיקה'}`
    : `${esc(r.name)}: ${esc(r.errors[0])}`)));
}

async function nextWeek() {
  const raw = traineeById($('#trainee').value);
  if (!raw) return;
  const events = (raw._events || []).slice();
  const { trainee, changes, flags } = applyFeedback(normalizeTrainee(raw), events);
  const advanced = advanceWeek(trainee, flags);
  Object.assign(raw, advanced, { _events: [] });
  await store.updateTrainee(raw);
  generate();
  log(`מעבר לשבוע ${advanced.mesocycleWeek}`,
    [...changes.map((c) => esc(c.message)), flags.deloadRecommended ? '<b>מומלץ שבוע הורדת עומס.</b>' : '']
      .filter(Boolean).slice(0, 8)
      .concat(changes.length ? [] : ['לא נרשם משוב מהשטח — התכנית התקדמה לפי הפריודיזציה בלבד.']));
}

const LEVEL_CHIP = { error: 'crit', warning: 'warn', info: 'key' };
const LEVEL_WORD = { error: 'חסימה', warning: 'לתשומת לב', info: 'מידע' };

function render() {
  const p = state.program;
  renderRail(p);
  $('#days').innerHTML = `<div class="days">${p.days.map(dayCard).join('')}</div>`;
  document.querySelectorAll('[data-act]').forEach((el) => { el.onclick = () => onAction(el.dataset); });
  document.querySelectorAll('[data-swap]').forEach((el) => { el.onclick = () => onSwap(el.dataset); });
  document.querySelectorAll('[data-unlock]').forEach((el) => {
    el.onclick = () => {
      state.unlockedProbes = state.unlockedProbes || new Set();
      state.unlockedProbes.add(el.dataset.unlock);
      render();
    };
  });
  document.querySelectorAll('[data-probe-res]').forEach((el) => {
    el.onclick = () => onTrial(el.dataset.ex, el.dataset.probeRes === 'ok', 'probe');
  });
  document.querySelectorAll('[data-custom-res]').forEach((el) => {
    el.onclick = () => onTrial(el.dataset.ex, el.dataset.customRes === 'ok', 'custom');

  document.querySelectorAll('[data-note-toggle]').forEach((el) => { el.onclick = () => toggleNote(el.dataset.noteToggle); });
  document.querySelectorAll('[data-note-del]').forEach((el) => { el.onclick = () => deleteNote(el.dataset.noteDel); });
  document.querySelectorAll('[data-note-edit]').forEach((el) => { el.onclick = () => openNoteForm({ id: el.dataset.noteEdit }); });

  }
}

/** התיאור המדויק של התרגיל, כולל תרגילים שהמאמן כתב בעצמו. */
function describeExercise(id) {
  const t = traineeById(state.program?.traineeId);
  const custom = (t?.customExercises || []).find((c) => c.id === id);
  if (custom) return custom.description || '';
  try { return getExercise(id).description || ''; } catch { return ''; }
}

  </article>`;
}

function exerciseRow(b, di, bi) {
  const rx = b.prescription;
  const load = b.load || {};
  const notes = exerciseNotes(b.exercise.id);
  // שדה משקל מופיע רק בתרגיל שבאמת מעמיסים בו — לא בחימום, ניידות או קונדישן
  const editable = b.exercise.loadable && !['mobility', 'conditioning'].includes(b.exercise.type);

  return `<div class="ex" data-ex-row="${di}_${bi}">
    <div class="idx">${bi + 1}</div>
    <div>
      <div class="name">${esc(b.exercise.name)}</div>
      <div class="role">${esc(b.slotLabel || roleLabel(b.role))} · ${esc(equipmentList(b.exercise.equipment))}${b.setType === 'superset' ? ' · סופרסט' : ''}${b.exercise.unilateral ? ' · לכל צד' : ''}</div>
    </div>
    <div class="body">
      <p class="desc">${esc(describeExercise(b.exercise.id))}</p>

      <div class="pres">
        <div class="pcell key">
          <span>משקל עבודה</span>
          ${editable
            ? `<div class="kgwrap">
                 <input class="kgin" type="number" step="0.5" min="0" inputmode="decimal"
                        value="${load.kg ?? ''}" placeholder="—"
                        data-kg="${esc(b.exercise.id)}" data-perside="${load.perSide ? '1' : ''}"
                        aria-label="משקל עבודה בקילוגרמים">
                 <b>ק״ג${load.perSide ? ' לכל יד' : ''}</b>
               </div>`
            : `<b class="mono">${b.exercise.loadable ? '—' : 'משקל גוף'}</b>`}
        </div>
        <div class="pcell"><span>חזרות</span><b class="mono">${esc(rx.reps)}${rx.unit === 'seconds' && !String(rx.reps).includes('שניות') ? ' שנ׳' : ''}</b></div>
        <div class="pcell"><span>סטים</span><b class="mono">${rx.sets}</b></div>
        <div class="pcell"><span>מנוחה</span><b class="mono">${rx.restSec}″</b></div>
        <div class="pcell"><span>מרחק מכשל</span><b class="mono">RIR ${rx.rir}</b></div>
        <div class="pcell"><span>קצב</span><b class="mono">${esc(rx.tempo)}</b></div>
      </div>
      ${load.label && editable ? `<p class="loadnote">${esc(load.label)}${load.atStudioCeiling ? ' · זהו המשקל הכבד ביותר בסטודיו' : ''}</p>` : ''}

      ${b.rampUp ? `<ul class="cues"><li>${esc(b.rampUp.text)}</li></ul>` : ''}
      ${b.coachingNotes.length ? `<ul class="cues">${b.coachingNotes.map((n) => `<li>${esc(n)}</li>`).join('')}</ul>` : ''}

      ${notes.length ? `<div class="exnotes">
        ${notes.map((n) => `<div class="exnote ${n.active ? '' : 'off'}">
          <span class="grow">${esc(n.text)}</span>
          <button data-note-toggle="${esc(n.id)}" title="${n.active ? 'השבת' : 'הפעל'}">${n.active ? 'פעילה' : 'מושבתת'}</button>
          <button data-note-del="${esc(n.id)}" title="מחק">✕</button>
        </div>`).join('')}
      </div>` : ''}

      <div class="acts">
        <button class="act-key" data-act="log_set" data-d="${di}" data-b="${bi}">רישום סט</button>
        <button data-act="too_easy" data-d="${di}" data-b="${bi}">קל מדי</button>
        <button data-act="too_hard" data-d="${di}" data-b="${bi}">קשה מדי</button>
        <button class="act-alert" data-act="pain" data-d="${di}" data-b="${bi}">כאב</button>
        <button data-note-add="${esc(b.exercise.id)}">+ הערה</button>
      </div>
      <details class="more">
        <summary>עוד פעולות</summary>
        <div class="acts">
          <button data-act="form_breakdown" data-d="${di}" data-b="${bi}">טכניקה מתפרקת</button>
          <button data-act="equipment_busy" data-d="${di}" data-b="${bi}">מכשיר תפוס</button>
          <button data-act="skip" data-d="${di}" data-b="${bi}">דילוג</button>
          <button data-act="love_it" data-d="${di}" data-b="${bi}">תרגיל מוצלח</button>
        </div>
        ${b.alternatives.length ? `<div class="swap">
          <select id="alt_${di}_${bi}" aria-label="חלופות">${b.alternatives.map((a) => `<option value="${a.id}">${esc(a.name)}</option>`).join('')}</select>
          <button data-swap="1" data-d="${di}" data-b="${bi}">החלף תרגיל</button>
        </div>` : ''}
      </details>
    </div>
  </div>`;
}

/** הערות שהמאמן כתב על תרגיל מסוים. */
function exerciseNotes(exerciseId) {
  const t = traineeById(state.program?.traineeId);
  return (t?.notesLog || []).filter((n) => n.scope === 'exercise' && n.exerciseId === exerciseId);
}

/** כרטיס יומן ההערות של המתאמן. */
function notesCard(p) {
  const t = traineeById(p.traineeId);
  const notes = (t?.notesLog || []).filter((n) => n.scope !== 'exercise');
  const effects = Object.fromEntries((p.noteEffects || []).map((e) => [e.noteId, e.effect]));

  return `<div class="card">
    <p class="eyebrow">יומן המאמן</p>
    <p class="hint">כל מה שקורה באימון וצריך להשפיע על התכנית. הערה יכולה לשאת הנחיה —
      ואז המערכת מבצעת אותה בפועל. אפשר לערוך, להשבית או למחוק בכל רגע.</p>
    ${notes.length ? notes.map((n) => `<div class="notecard ${n.active ? '' : 'off'}">
      <div class="row" style="align-items:flex-start">
        <div class="grow">
          <div>${esc(n.text)}</div>
          <div class="role">${new Date(n.at).toLocaleDateString('he-IL')}${n.author ? ` · ${esc(n.author)}` : ''}</div>
          ${n.directive.type !== 'none'
            ? `<span class="chip ${n.active ? 'key' : ''}">${esc(DIRECTIVES[n.directive.type].label)}${n.directive.value ? `: ${esc(directiveValueLabel(n.directive))}` : ''}</span>`
            : '<span class="chip">הערה בלבד</span>'}
          ${n.active && effects[n.id] ? `<p class="loadnote">${esc(effects[n.id])}</p>` : ''}
        </div>
        <button data-note-toggle="${esc(n.id)}">${n.active ? 'השבת' : 'הפעל'}</button>
        <button data-note-edit="${esc(n.id)}">ערוך</button>
        <button data-note-del="${esc(n.id)}">מחק</button>
      </div>
    </div>`).join('') : '<p class="empty">אין עדיין הערות.</p>'}

    <details class="optional" id="noteFormWrap" style="margin-top:.7rem">
      <summary>הוספת הערה</summary>
      <form id="noteForm">
        <input type="hidden" name="id">
        <label class="f"><span class="req">מה קרה</span>
          <textarea name="text" required placeholder="לדוגמה: התלונן על הכתף רק בלחיצה מעל הראש; מגיע שחוק בימי שני; ביקש יותר עבודת ישבן"></textarea></label>
        <div class="fields" style="margin-top:.6rem">
          <label class="f"><span>מה לעשות עם זה</span>
            <select name="directiveType" id="dirType">
              ${Object.entries(DIRECTIVES).map(([k, v]) => `<option value="${k}">${esc(v.label)}</option>`).join('')}
            </select></label>
          <label class="f" id="dirValueWrap" hidden><span id="dirValueLabel">ערך</span>
            <span id="dirValueField"></span></label>
          <label class="f"><span>נכתב על ידי</span><input name="author" placeholder="שם המאמן"></label>
        </div>
        <div class="row" style="margin-top:.6rem">
          <button class="primary" type="submit">שמור הערה</button>
          <button type="button" id="noteCancel">בטל</button>
        </div>
      </form>
    </details>
  </div>`;
}

function directiveValueLabel(d) {
  const v = d.value;
  switch (DIRECTIVES[d.type]?.needs) {
    case 'exercise': { try { return getExercise(v).name; } catch { return v; } }
    case 'muscle': return muscleLabel(v);
    case 'pattern': return patternLabel(v);
    case 'equipment': return EQUIPMENT_LABELS[v] || v;
    case 'joint': return jointLabelHe(v);
    case 'percent': return `${v}%`;
    case 'minutes': return `${v} דק׳`;
    default: return v ?? '';
  }
}

const JOINTS_HE = { shoulder: 'כתף', lumbar: 'גב תחתון', knee: 'ברך', elbow: 'מרפק',
  wrist: 'שורש כף יד', hip: 'ירך', ankle: 'קרסול', neck: 'צוואר' };
const jointLabelHe = (j) => JOINTS_HE[j] || j;

/** שדה הערך משתנה לפי סוג ההנחיה שנבחרה. */
function renderDirectiveValue(type, current = '') {
  const needs = DIRECTIVES[type]?.needs;
  const wrap = $('#dirValueWrap');
  const field = $('#dirValueField');
  const labelEl = $('#dirValueLabel');
  if (!needs) { wrap.hidden = true; field.innerHTML = ''; return; }
  wrap.hidden = false;

  const opts = {
    exercise: () => ({ label: 'תרגיל', html: `<select name="directiveValue">${EXERCISES.map((x) => `<option value="${x.id}">${esc(x.name)}</option>`).join('')}</select>` }),
    muscle: () => ({ label: 'שריר', html: `<select name="directiveValue">${MUSCLES.map((m) => `<option value="${m}">${esc(muscleLabel(m))}</option>`).join('')}</select>` }),
    pattern: () => ({ label: 'דפוס תנועה', html: `<select name="directiveValue">${PATTERNS.map((x) => `<option value="${x}">${esc(patternLabel(x))}</option>`).join('')}</select>` }),
    joint: () => ({ label: 'מפרק', html: `<select name="directiveValue">${Object.entries(JOINTS_HE).map(([k, v]) => `<option value="${k}">${esc(v)}</option>`).join('')}</select>` }),
    equipment: () => ({ label: 'ציוד', html: `<select name="directiveValue">${equipmentOptions()}</select>` }),
    percent: () => ({ label: 'אחוזים', html: '<input name="directiveValue" type="number" min="5" max="50" value="10">' }),
    minutes: () => ({ label: 'דקות', html: '<input name="directiveValue" type="number" min="20" max="120" value="45">' }),
  }[needs]();

  labelEl.textContent = opts.label;
  field.innerHTML = opts.html;
  if (current) { const el = field.querySelector('[name=directiveValue]'); if (el) el.value = current; }
}

/* ---------------------------------------------------------------- פעולות */
function onSwap(ds) {
  const raw = traineeById(state.program.traineeId);
  const trainee = normalizeTrainee(raw);
  const studio = normalizeStudio(studioById(raw.studioId));
  try {
    swapExercise(state.program, trainee, studio, {
      dayIndex: +ds.d, blockIndex: +ds.b, alternativeId: $(`#alt_${ds.d}_${ds.b}`).value,
    });
    render();
    log('הוחלף תרגיל', `ציון האיכות המעודכן: ${state.program.qa.score}`);
  } catch (err) {
    log('ההחלפה לא בוצעה', esc(err.message));
  }
}

/**
 * המאמן שינה משקל בתכנית.
 * מרגע זה זהו משקל העבודה של המתאמן בתרגיל הזה — הוא נשמר, מוצג בשבוע הבא,
 * והפרוגרסיה ממשיכה ממנו.
 */
async function onLoadEdit(el) {
  const raw = traineeById(state.program.traineeId);
  const id = el.dataset.kg;
  const kg = parseFloat(el.value);
  raw.history = raw.history || {};
  if (!Number.isFinite(kg) || kg <= 0) {
    delete raw.history[id]?.trainerSet;
  } else {
    raw.history[id] = {
      ...(raw.history[id] || {}),
      trainerSet: { kg, perSide: el.dataset.perside === '1', at: new Date().toISOString() },
    };
  }
  await store.updateTrainee(raw);
  generate();
  log('משקל עודכן', `${esc(exerciseName(id))}: ${Number.isFinite(kg) && kg > 0 ? `${kg} ק״ג — יישמר לפעמים הבאות` : 'חזרה להצעת המערכת'}.`);
}

function exerciseName(id) {
  const t = traineeById(state.program?.traineeId);
  const custom = (t?.customExercises || []).find((c) => c.id === id);
  if (custom) return custom.name;
  try { return getExercise(id).name; } catch { return id; }
}

/* ---------------------------------------------------------------- הערות */
function openNoteForm(opts = {}) {
  const wrap = $('#noteFormWrap');
  const form = $('#noteForm');
  if (!wrap || !form) return;
  wrap.open = true;
  form.reset();

  if (opts.id) {
    const t = traineeById(state.program.traineeId);
    const note = (t.notesLog || []).find((n) => n.id === opts.id);
    if (note) {
      form.id.value = note.id;
      form.text.value = note.text;
      form.author.value = note.author || '';
      form.directiveType.value = note.directive.type;
      renderDirectiveValue(note.directive.type, note.directive.value);
      form.dataset.scope = note.scope;
      form.dataset.exerciseId = note.exerciseId || '';
    }
  } else {
    form.id.value = '';
    form.dataset.scope = opts.scope || 'general';
    form.dataset.exerciseId = opts.exerciseId || '';
    renderDirectiveValue('none');
    if (opts.exerciseId) {
      form.text.placeholder = `הערה על ${exerciseName(opts.exerciseId)} — למשל: כאב קל בסוף הסט, או שהמשקל הזה עדיין קל`;
    }
  }
  form.querySelector('[name=text]').focus();
  wrap.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
}

async function onNoteSubmit(e) {
  e.preventDefault();
  const form = e.target;
  const f = new FormData(form);
  const raw = traineeById(state.program.traineeId);
  const value = f.get('directiveValue');

  const note = normalizeNote({
    id: f.get('id') || undefined,
    text: f.get('text'),
    author: f.get('author') || '',
    scope: form.dataset.scope || 'general',
    exerciseId: form.dataset.exerciseId || null,
    directive: { type: f.get('directiveType'), value: value || null },
  });

  raw.notesLog = upsertNote(raw.notesLog || [], note);
  await store.updateTrainee(raw);
  form.reset();
  $('#noteFormWrap').open = false;
  renderDirectiveValue('none');
  generate();

  const effect = applyNotes(normalizeTrainee(raw)).effects.find((x) => x.noteId === note.id);
  log('הערה נשמרה', [esc(note.text), effect ? `<b>${esc(effect.effect)}</b>` : '']);
}

async function toggleNote(id) {
  const raw = traineeById(state.program.traineeId);
  const note = (raw.notesLog || []).find((n) => n.id === id);
  if (!note) return;
  note.active = !note.active;
  await store.updateTrainee(raw);
  generate();
  log('הערה עודכנה', `${esc(note.text)} — ${note.active ? 'הופעלה מחדש' : 'הושבתה; הטקסט נשמר'}.`);
}

async function deleteNote(id) {
  const raw = traineeById(state.program.traineeId);
  const note = (raw.notesLog || []).find((n) => n.id === id);
  if (!note) return;
  if (!confirm(`למחוק את ההערה?

${note.text}`)) return;
  raw.notesLog = removeNote(raw.notesLog || [], id);
  await store.updateTrainee(raw);
  generate();
  log('הערה נמחקה', esc(note.text));
}

/** תוצאת בדיקה — תרגיל באזור פציעה או תרגיל שהמאמן כתב. */
async function onTrial(exerciseId, ok, kind) {
  const raw = traineeById(state.program.traineeId);
  const type = kind === 'custom'
    ? (ok ? 'custom_tested_ok' : 'custom_tested_failed')
    : (ok ? 'probe_ok' : 'probe_pain');
  let note = '';
  if (!ok) note = prompt('מה בדיוק הרגיש המתאמן? (יישמר בתיק)', '') || '';
  const ev = { type, exerciseId, payload: { note } };

  const { trainee, changes } = applyFeedback(normalizeTrainee(raw), [ev]);
  Object.assign(raw, trainee);
  await store.updateTrainee(raw);
  generate();
  log(ok ? 'הבדיקה עברה' : 'נרשמה תחושה', changes.map((c) => esc(c.message)));
}

/** שמירת תרגיל שהמאמן כתב בעצמו. */
async function onCustomSubmit(e) {
  e.preventDefault();
  const f = new FormData(e.target);
  const raw = traineeById(state.program.traineeId);
  const payload = {
    name: f.get('name'),
    description: f.get('description'),
    sets: +f.get('sets') || 3,
    reps: f.get('reps') || '10',
    load: f.get('load') || '',
    notes: f.get('notes') || '',
    pattern: f.get('pattern') || null,
    primaryMuscle: f.get('primaryMuscle') || null,
    equipment: f.get('equipment') ? [f.get('equipment')] : [],
  };
  const { trainee, changes } = applyFeedback(normalizeTrainee(raw), [{ type: 'custom_add', payload }]);
  Object.assign(raw, trainee);
  await store.updateTrainee(raw);
  e.target.reset();
  generate();
  log('נוסף תרגיל משלך', changes.map((c) => esc(c.message)));
}

function onAction(ds) {
  const block = state.program.days[+ds.d].blocks[+ds.b];
  const raw = traineeById(state.program.traineeId);
  const ev = { type: ds.act, exerciseId: block.exercise.id, dayIndex: +ds.d, prescription: block.prescription };

  if (ds.act === 'log_set') {
    const load = prompt(`${block.exercise.name} — משקל שבוצע בפועל (ק״ג):`, block.load?.kg ?? '');
    if (load === null) return;
    const reps = prompt('חזרות שבוצעו:', String(block.prescription.repsMin));
    const rpe = prompt('RPE (1-10):', String(10 - block.prescription.rir));
    ev.payload = { load: load ? +load : null, reps: reps ? +reps : null, rpe: rpe ? +rpe : null };
    if (load) ev.payload.perSide = !!block.load?.perSide;
  } else if (ds.act === 'pain') {
    const joint = prompt('היכן הכאב?\nshoulder / low_back / knee / elbow / wrist / hip / ankle / neck', 'knee');
    if (!joint) return;
    ev.payload = { joint: joint.trim(), painLevel: +(prompt('עוצמת כאב 1-10:', '5') || 5) };
  } else if (ds.act === 'equipment_busy') {
    ev.payload = { equipment: block.exercise.equipment };
  }

  raw._events = [...(raw._events || []), ev];
  const { trainee, changes, flags } = applyFeedback(normalizeTrainee(raw), [ev]);
  Object.assign(raw, trainee);
  store.updateTrainee(raw);

  const messages = changes.map((c) => esc(c.message));
  if (flags.deloadRecommended) messages.push('<b>הצטברות סימני עומס — מומלץ שבוע הורדת עומס.</b>');
  log(esc(block.exercise.name), messages.length ? messages : ['נרשם.']);

  // משוב שמשנה את מרחב האפשרויות מחייב בנייה מחדש כדי שהמסך לא יציג תרגיל שנפסל
  if (['pain', 'equipment_busy', 'skip', 'form_breakdown'].includes(ds.act)) generate();
}

boot();
</script>
</body>
</html>
