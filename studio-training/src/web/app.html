<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>מסך המאמן</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700;900&family=Secular+One&family=IBM+Plex+Mono:wght@400;600&display=swap">
<style>
  /* ==================================================================
     שפה עיצובית: כהה, ספורטיבית, כחול עמוק.
     הרקע בנוי בשכבות — מדרג עומק, שתי הילות כחולות ורשת עדינה —
     כדי שהמסך ירגיש כמו חלל ולא כמו לוח שטוח.
     ================================================================== */
  :root{
    color-scheme: dark;

    /* משטחים */
    --ground:#080B10;
    --ground-2:#0C1119;
    --surface:#121A25;
    --surface-2:#18222F;
    --surface-3:#1F2B3A;
    --line:#243244;
    --line-soft:#1B2836;

    /* דיו */
    --ink:#EAF1FA;
    --ink-2:#AFC0D4;
    --muted:#7B8EA6;

    /* כחול עמוק — צבע ההדגשה */
    --accent:#4C8DFF;
    --accent-2:#2563EB;
    --accent-deep:#1E3A8A;
    --accent-soft:rgba(76,141,255,.14);
    --accent-line:rgba(76,141,255,.35);
    --accent-ink:#04101F;
    --glow:rgba(76,141,255,.45);

    /* מצב */
    --ok:#34D399;   --ok-soft:rgba(52,211,153,.14);
    --warn:#FBBF24; --warn-soft:rgba(251,191,36,.14);
    --crit:#F87171; --crit-soft:rgba(248,113,113,.14);

    --radius:14px;
    --radius-sm:10px;
    --shadow:0 1px 0 rgba(255,255,255,.04) inset, 0 10px 30px -18px rgba(0,0,0,.9);
    --shadow-lift:0 1px 0 rgba(255,255,255,.06) inset, 0 22px 50px -24px rgba(0,0,0,.95);

    --step--2:.72rem; --step--1:.82rem; --step-0:.95rem; --step-1:1.08rem;
    --step-2:1.4rem;  --step-3:2rem;    --step-4:2.8rem;

    --ease:cubic-bezier(.22,.61,.36,1);
    --ease-out:cubic-bezier(.16,1,.3,1);
  }

  /* מצב בהיר — נשמר מלא ותקין, לשימוש באולם מואר ולהדפסה */
  :root[data-theme="light"]{
    color-scheme: light;
    --ground:#EEF2F7; --ground-2:#E6ECF4;
    --surface:#FFFFFF; --surface-2:#F4F7FB; --surface-3:#EAF0F8;
    --line:#D6DEE9; --line-soft:#E4EAF2;
    --ink:#0E1620; --ink-2:#3D4C5E; --muted:#66788C;
    --accent:#1D4ED8; --accent-2:#2563EB; --accent-deep:#1E3A8A;
    --accent-soft:rgba(29,78,216,.10); --accent-line:rgba(29,78,216,.28);
    --accent-ink:#FFFFFF; --glow:rgba(29,78,216,.22);
    --ok:#0E8A5F; --ok-soft:rgba(14,138,95,.12);
    --warn:#A96A00; --warn-soft:rgba(169,106,0,.12);
    --crit:#C0392B; --crit-soft:rgba(192,57,43,.12);
    --shadow:0 1px 2px rgba(16,24,40,.06), 0 10px 26px -18px rgba(16,24,40,.35);
    --shadow-lift:0 2px 4px rgba(16,24,40,.08), 0 24px 48px -24px rgba(16,24,40,.45);
  }

  *{box-sizing:border-box}
  /* גלישה אופקית רגעית — למשל בזמן שהגופנים עוד נטענים — גורמת לדפדפן
     נייד להקטין את כל העמוד ולהשאיר אותו כך. clip חוסם את זה בלי ליצור
     מיכל גלילה, ולכן position:sticky ממשיך לעבוד. */
  html{-webkit-text-size-adjust:100%}

  body, .wrap, header.bar, .log{direction:rtl}
  body{
    margin:0; min-height:100vh;
    background:var(--ground);
    color:var(--ink);
    font:var(--step-0)/1.6 Heebo,"Segoe UI",system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;
    overflow-x:hidden;
  }

  /* ---------- שכבות הרקע ---------- */
  body::before{
    content:''; position:fixed; inset:-20vh -20vw; z-index:-2; pointer-events:none;
    background:
      radial-gradient(52vw 46vh at 82% -6%, rgba(76,141,255,.20), transparent 62%),
      radial-gradient(46vw 40vh at 6% 8%, rgba(30,58,138,.28), transparent 66%),
      radial-gradient(60vw 50vh at 50% 108%, rgba(37,99,235,.14), transparent 64%),
      linear-gradient(180deg, var(--ground) 0%, var(--ground-2) 55%, var(--ground) 100%);
    animation:drift 26s var(--ease) infinite alternate;
  }
  body::after{
    content:''; position:fixed; inset:0; z-index:-1; pointer-events:none; opacity:.5;
    background-image:
      linear-gradient(to left, var(--line-soft) 1px, transparent 1px),
      linear-gradient(to bottom, var(--line-soft) 1px, transparent 1px);
    background-size:64px 64px;
    mask-image:radial-gradient(80% 60% at 50% 0%, #000 0%, transparent 78%);
    -webkit-mask-image:radial-gradient(80% 60% at 50% 0%, #000 0%, transparent 78%);
  }
  :root[data-theme="light"] body::before{
    background:
      radial-gradient(52vw 46vh at 84% -8%, rgba(29,78,216,.13), transparent 62%),
      radial-gradient(46vw 40vh at 4% 6%, rgba(37,99,235,.10), transparent 66%),
      linear-gradient(180deg, var(--ground) 0%, #F5F8FC 55%, var(--ground) 100%);
  }
  @keyframes drift{
    from{transform:translate3d(0,0,0) scale(1)}
    to{transform:translate3d(-2.5%,1.5%,0) scale(1.06)}
  }

  /* ---------- טיפוגרפיה ---------- */
  h1,h2,h3{font-family:"Secular One",Heebo,sans-serif; font-weight:400; letter-spacing:0;
    text-wrap:balance; margin:0; line-height:1.2}
  .mono{font-family:"IBM Plex Mono",ui-monospace,monospace; font-variant-numeric:tabular-nums; letter-spacing:-.02em}

  /* ---------- סרגל עליון ---------- */
  header.bar{
    position:sticky; top:0; z-index:40;
    background:color-mix(in srgb, var(--surface) 78%, transparent);
    backdrop-filter:blur(16px) saturate(1.4); -webkit-backdrop-filter:blur(16px) saturate(1.4);
    border-bottom:1px solid var(--line);
    padding:.6rem clamp(.7rem,2vw,1.3rem);
    display:flex; gap:.6rem; align-items:center; flex-wrap:wrap;
  }
  header.bar h1{
    font-size:var(--step-1); margin-inline-end:.3rem; display:flex; align-items:center; gap:.5rem;
  }
  header.bar h1::before{
    content:''; width:9px; height:22px; border-radius:3px; flex:none;
    background:linear-gradient(180deg, var(--accent), var(--accent-deep));
    box-shadow:0 0 16px var(--glow);
  }

  .tabs{display:flex; gap:.2rem; background:var(--surface-2); padding:.22rem; border-radius:999px;
    border:1px solid var(--line)}
  .tabs button{background:transparent; border:0; padding:.4rem .95rem; border-radius:999px;
    font-weight:600; color:var(--muted); font-size:var(--step--1); transition:color .2s var(--ease)}
  .tabs button[aria-current="true"]{
    background:linear-gradient(180deg, var(--accent), var(--accent-2));
    color:var(--accent-ink); box-shadow:0 6px 18px -8px var(--glow);
  }

  main.wrap{max-width:1320px; margin:0 auto; padding:clamp(.8rem,2vw,1.4rem)}
  .cols{display:grid; grid-template-columns:340px minmax(0,1fr); gap:1.1rem; align-items:start}
  @media (max-width:1000px){ .cols{grid-template-columns:1fr} }

  /* ---------- פקדים ---------- */
  select,button,input,textarea{
    font:inherit; color:var(--ink); background:var(--surface-2);
    border:1px solid var(--line); border-radius:var(--radius-sm); padding:.5rem .7rem;
    transition:border-color .18s var(--ease), background .18s var(--ease),
               box-shadow .18s var(--ease), transform .12s var(--ease);
  }
  select{max-width:210px; cursor:pointer}
  /*
   * תיבת סימון בגודל ברירת המחדל היא 13 פיקסלים — מטרה שאי אפשר לפגוע בה
   * באצבע. התווית מסביבה מקבלת ריווח כדי שהמגע יתפוס גם את הטקסט.
   */
  input[type=checkbox],input[type=radio]{
    width:20px; height:20px; min-height:20px; flex:none; margin:0;
    accent-color:var(--accent); cursor:pointer}
  label:has(> input[type=checkbox]),label:has(> input[type=radio]){
    display:inline-flex; align-items:center; gap:.45rem; cursor:pointer}
  button{cursor:pointer}
  button:hover{border-color:var(--accent-line); background:var(--surface-3)}
  button:active{transform:scale(.97)}
  :is(button,select,input,textarea,a,summary):focus-visible{
    outline:2px solid var(--accent); outline-offset:2px}
  input::placeholder,textarea::placeholder{color:var(--muted)}
  input:focus,textarea:focus,select:focus{border-color:var(--accent-line);
    box-shadow:0 0 0 4px var(--accent-soft)}

  button.primary{
    background:linear-gradient(180deg, var(--accent), var(--accent-2));
    color:var(--accent-ink); border-color:transparent; font-weight:700;
    box-shadow:0 10px 26px -12px var(--glow);
  }
  button.primary:hover{filter:brightness(1.1); box-shadow:0 14px 32px -12px var(--glow)}
  button.ghost{background:transparent; border-color:transparent; color:var(--muted)}
  button.ghost:hover{color:var(--accent); background:var(--surface-2)}
  .spacer{flex:1}
  .row{display:flex; gap:.5rem; flex-wrap:wrap; align-items:center}
  .grow{flex:1}

  /* ---------- כרטיסים ---------- */
  .card{
    position:relative; background:var(--surface);
    border:1px solid var(--line); border-radius:var(--radius);
    box-shadow:var(--shadow); padding:clamp(.85rem,2vw,1.15rem); margin-bottom:1rem;
    transition:transform .28s var(--ease-out), box-shadow .28s var(--ease-out), border-color .28s var(--ease);
  }
  .card::before{
    content:''; position:absolute; inset:0 0 auto; height:1px; border-radius:var(--radius) var(--radius) 0 0;
    background:linear-gradient(90deg, transparent, var(--accent-line), transparent); opacity:.7;
  }
  .card:hover{border-color:color-mix(in srgb, var(--accent-line) 60%, var(--line))}
  .card > h2{font-size:var(--step-2)}
  .eyebrow{font-size:var(--step--2); letter-spacing:.14em; text-transform:uppercase;
    color:var(--accent); font-weight:700; margin:0 0 .2rem}

  /* ---------- מסלול השלבים ---------- */
  .steps{display:flex; gap:.5rem; margin:0 0 1.1rem; flex-wrap:wrap}
  .steps a{
    flex:1 1 180px; display:flex; gap:.7rem; align-items:center; text-decoration:none;
    color:var(--muted); cursor:pointer; padding:.7rem .85rem; border-radius:var(--radius);
    background:var(--surface); border:1px solid var(--line);
    transition:transform .25s var(--ease-out), border-color .25s var(--ease), background .25s var(--ease);
  }
  .steps a:hover{transform:translateY(-2px); border-color:var(--accent-line)}
  .steps a .n{width:30px; height:30px; flex:none; border-radius:50%; display:grid; place-items:center;
    background:var(--surface-3); color:var(--muted); font-family:"IBM Plex Mono",monospace;
    font-size:.82rem; font-weight:600; transition:all .3s var(--ease)}
  .steps a .t{display:flex; flex-direction:column; line-height:1.3; min-width:0}
  .steps a .t b{color:var(--ink); font-size:var(--step-0); font-family:"Secular One",Heebo,sans-serif; font-weight:400}
  .steps a .t span{font-size:var(--step--1); white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
  .steps a[aria-current="true"]{
    background:linear-gradient(180deg, var(--accent-soft), transparent);
    border-color:var(--accent-line);
  }
  .steps a[aria-current="true"] .n{
    background:linear-gradient(180deg, var(--accent), var(--accent-2));
    color:var(--accent-ink); box-shadow:0 0 20px -4px var(--glow)}
  .steps a[data-done="true"] .n{background:var(--ok); color:#04120C}

  /* ---------- כותרת מסך ---------- */
  .hero{display:flex; align-items:flex-end; gap:1rem; flex-wrap:wrap; margin-bottom:1rem}
  .hero h2{font-size:clamp(1.6rem,4vw,var(--step-3)); line-height:1.1}
  .hero p{margin:.45rem 0 0; color:var(--ink-2); font-size:var(--step-0); max-width:62ch}
  .tiles{display:flex; gap:.6rem; flex-wrap:wrap; margin-inline-start:auto}
  .tile{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius);
    padding:.6rem .95rem; min-width:110px; position:relative; overflow:hidden}
  .tile b{display:block; font-family:"IBM Plex Mono",monospace; font-size:var(--step-2);
    line-height:1.1; font-variant-numeric:tabular-nums}
  .tile span{font-size:var(--step--1); color:var(--muted)}
  .tile.accent{border-color:var(--accent-line)}
  .tile.accent b{color:var(--accent); text-shadow:0 0 22px var(--glow)}

  /* ---------- טפסים ---------- */
  /*
   * fieldset מסרב להצטמצם מתחת לרוחב המינימלי של תוכנו — כך טבלה רחבה
   * בתוכו מרחיבה את הכרטיס כולו ומכריחה את הדף לגלול לרוחב במסך צר.
   */
  fieldset{border:0; border-top:1px solid var(--line); padding:1rem 0 .2rem; margin:0 0 .6rem;
    min-inline-size:0}
  fieldset:first-of-type{border-top:0; padding-top:.2rem}
  legend{font-family:"Secular One",Heebo,sans-serif; font-weight:400; padding:0;
    font-size:var(--step-1); margin-bottom:.35rem}
  .fields{display:grid; grid-template-columns:repeat(auto-fit,minmax(190px,1fr)); gap:.75rem}
  label.f{display:flex; flex-direction:column; gap:.28rem; font-size:var(--step--1); color:var(--muted)}
  label.f > span.req::after{content:' *'; color:var(--accent)}
  label.f input, label.f select, label.f textarea{width:100%; max-width:none; background:var(--surface-2)}
  label.f textarea{min-height:72px; resize:vertical; font-family:inherit}
  .hint{font-size:var(--step--1); color:var(--muted); margin:.35rem 0 0; line-height:1.55}
  .optional > summary{margin:.2rem 0 .5rem; font-weight:600; color:var(--accent); cursor:pointer;
    list-style:none; display:inline-flex; align-items:center; gap:.35rem; padding:.25rem .1rem}
  .optional > summary::-webkit-details-marker{display:none}
  .optional > summary::before{content:'▸'; transition:transform .25s var(--ease); display:inline-block}
  .optional[open] > summary::before{transform:rotate(-90deg)}
  .optional[open] > summary{margin-bottom:.7rem}
  details > *:not(summary){animation:slideDown .32s var(--ease-out)}

  .listrow{display:flex; align-items:center; gap:.55rem; padding:.6rem .2rem;
    border-top:1px solid var(--line-soft); flex-wrap:wrap}
  .listrow:first-of-type{border-top:0}
  .listrow strong{font-weight:700}
  .listrow button.danger{color:var(--crit); border-color:color-mix(in srgb, var(--crit) 32%, transparent)}
  .listrow button.danger:hover{background:var(--crit-soft); border-color:var(--crit)}

  .banner{border-inline-start:3px solid var(--accent); background:var(--accent-soft);
    padding:.7rem .85rem; border-radius:var(--radius-sm); font-size:var(--step--1);
    margin-bottom:.9rem; animation:popIn .4s var(--ease-out)}
  .banner.warn{border-color:var(--warn); background:var(--warn-soft)}
  .banner.crit{border-color:var(--crit); background:var(--crit-soft)}

  /* ---------- שבבים ---------- */
  .chip{display:inline-flex; align-items:center; gap:.3rem; border:1px solid var(--line);
    background:var(--surface-2); color:var(--ink-2); border-radius:999px;
    padding:.16rem .6rem; font-size:var(--step--1); white-space:nowrap}
  .chip.key{background:var(--accent-soft); border-color:var(--accent-line); color:var(--accent); font-weight:600}
  .chip.ok{background:var(--ok-soft); color:var(--ok); border-color:transparent}
  .chip.warn{background:var(--warn-soft); color:var(--warn); border-color:transparent}
  .chip.crit{background:var(--crit-soft); color:var(--crit); border-color:transparent}
  .chips{display:flex; flex-wrap:wrap; gap:.4rem}
  .note{font-size:var(--step--1); color:var(--ink-2); margin:.5rem 0 0}
  .rule{height:1px; background:var(--line); border:0; margin:.9rem 0}

  /* ---------- ציון איכות ---------- */
  .score{display:flex; align-items:baseline; gap:.6rem; margin-top:.2rem}
  .score b{font-family:"IBM Plex Mono",monospace; font-size:var(--step-4); line-height:1;
    font-variant-numeric:tabular-nums; color:var(--accent); text-shadow:0 0 34px var(--glow)}

  /* ---------- ממצאים ---------- */
  ul.findings{list-style:none; margin:.7rem 0 0; padding:0; display:flex; flex-direction:column; gap:.45rem}
  ul.findings li{display:grid; grid-template-columns:auto 1fr; gap:.55rem; font-size:var(--step--1);
    border-inline-start:3px solid var(--line); padding-inline-start:.6rem}
  li.lv-error{border-color:var(--crit)} li.lv-warning{border-color:var(--warn)} li.lv-info{border-color:var(--accent)}

  /* ---------- ימי אימון ---------- */
  .days{display:grid; grid-template-columns:repeat(auto-fill,minmax(340px,1fr)); gap:1rem}
  .day header{display:flex; align-items:baseline; gap:.55rem; flex-wrap:wrap; margin-bottom:.2rem}
  .day h3{font-size:var(--step-2)}
  .day .meta{font-size:var(--step--1); color:var(--muted)}

  /* ---------------------------------------------------------- מסך הכניסה */
  .gate{position:fixed; inset:0; z-index:100; display:grid; place-items:center;
    padding:1.2rem; overflow-y:auto; background:var(--ground)}
  /* display מהמחלקה גובר על [hidden] של הדפדפן — בלי השורה הזאת
     המסך נשאר שקוף מעל האפליקציה ובולע לחיצות. */
  .gate[hidden]{display:none}
  .gate-card{width:min(440px,100%); background:var(--surface); border:1px solid var(--line);
    border-radius:var(--radius-lg); padding:1.6rem 1.4rem 1.4rem; box-shadow:var(--shadow-lift);
    animation:riseIn .6s var(--ease-out) backwards; position:relative; overflow:hidden}
  .gate-card::before{content:''; position:absolute; inset-inline:0; top:0; height:3px;
    background:linear-gradient(90deg,transparent,var(--accent),transparent)}
  .gate-title{font-family:"Secular One",system-ui,sans-serif; font-size:var(--step-3);
    margin:.1rem 0 .5rem; letter-spacing:-.01em}
  .gate-sub{color:var(--ink-2); font-size:var(--step--1); line-height:1.6; margin:0 0 1.1rem}
  .gate-tabs{display:flex; gap:.25rem; background:var(--surface-2); padding:.25rem;
    border-radius:999px; margin-bottom:1rem}
  .gate-tabs button{flex:1; background:transparent; border:0; padding:.5rem; border-radius:999px;
    color:var(--ink-2); font-size:var(--step--1); font-weight:600; cursor:pointer;
    transition:background .2s var(--ease), color .2s var(--ease)}
  .gate-tabs button[aria-current="true"]{background:var(--accent); color:var(--accent-ink);
    box-shadow:0 4px 16px var(--glow)}
  .gate-submit{width:100%; margin-top:.9rem; min-height:46px; font-size:var(--step-0)}
  .gate-err{background:var(--crit-soft,rgba(248,113,113,.12)); border:1px solid var(--crit);
    color:var(--crit); border-radius:var(--radius-sm); padding:.55rem .7rem;
    font-size:var(--step--1); margin:.8rem 0 0; animation:popIn .3s var(--ease-out)}
  #gateFields .f{margin-bottom:.7rem}

  /* ---------------------------------------------------------- לוח שנה */
  .calbar{display:flex; align-items:center; gap:.5rem; flex-wrap:wrap; margin-bottom:.7rem}
  .calbar h3{margin:0; font-family:"Secular One",system-ui,sans-serif; font-size:var(--step-2); min-width:9ch}
  .calgrid{display:grid; grid-template-columns:repeat(7,1fr); gap:.3rem}
  .calhead{font-size:var(--step--2); color:var(--muted); text-align:center; padding:.3rem 0; font-weight:600}
  .cell{min-height:74px; background:var(--surface-2); border:1px solid var(--line-soft);
    border-radius:var(--radius-sm); padding:.3rem; display:flex; flex-direction:column; gap:.2rem;
    transition:border-color .18s var(--ease), background .18s var(--ease)}
  .cell.out{opacity:.38}
  .cell.today{border-color:var(--accent); box-shadow:0 0 0 1px var(--accent-line) inset}
  .cell .dnum{font-family:"IBM Plex Mono",monospace; font-size:var(--step--2); color:var(--muted)}
  .cell.today .dnum{color:var(--accent); font-weight:700}
  .cell.drop{border-color:var(--accent); background:var(--accent-soft)}
  .sess{font-size:var(--step--2); padding:.25rem .35rem; border-radius:6px; cursor:grab;
    background:var(--accent-soft); border:1px solid var(--accent-line); color:var(--ink);
    text-align:start; line-height:1.25; transition:transform .15s var(--ease)}
  .sess:hover{transform:translateY(-1px)}
  .sess.done{background:var(--ok-soft,rgba(52,211,153,.14)); border-color:var(--ok); color:var(--ok)}
  .sess.missed{background:var(--warn-soft,rgba(251,191,36,.14)); border-color:var(--warn); color:var(--warn)}
  .sess.moved::after{content:' ⇄'; opacity:.7}
  .sess.picked{outline:2px solid var(--accent); outline-offset:1px}
  .callegend{display:flex; gap:.6rem; flex-wrap:wrap; font-size:var(--step--2); color:var(--muted); margin-top:.6rem}
  .callegend b{display:inline-block; width:10px; height:10px; border-radius:3px; margin-inline-end:.25rem}
  @media (max-width:700px){
    .cell{min-height:56px; padding:.2rem}
    .sess{font-size:9px; padding:.15rem .2rem}
    .calbar h3{font-size:var(--step-1)}
  }

  /* ---------------------------------------------------------- מבנה אימון */
  /* minmax(0,1fr) ולא 1fr: בלעדיו הרוחב של הבחירה נקבע לפי הטקסט הארוך ביותר,
     השורה גולשת מהמסך, ודפדפן נייד מקטין את כל העמוד כדי להכיל אותה. */
  .segrow{display:grid; grid-template-columns:auto minmax(0,1fr) 5.5rem auto; gap:.5rem; align-items:center;
    background:var(--surface-2); border:1px solid var(--line-soft); border-radius:var(--radius-sm);
    padding:.45rem .6rem; margin-bottom:.4rem}
  .segrow .grip{cursor:grab; color:var(--muted); font-size:var(--step-1); line-height:1}
  .segrow select,.segrow input{min-height:36px; margin:0; min-width:0; max-width:100%}
  .segbar{display:flex; height:10px; border-radius:999px; overflow:hidden; margin:.5rem 0 .3rem;
    border:1px solid var(--line)}
  .segbar span{display:block}
  .segkey{display:flex; gap:.7rem; flex-wrap:wrap; font-size:var(--step--2); color:var(--muted)}
  .segkey i{display:inline-block; width:9px; height:9px; border-radius:2px; margin-inline-end:.25rem}
  .seghead{font-size:var(--step--1); color:var(--accent); font-weight:700; margin:.9rem 0 .2rem;
    padding-inline-start:.4rem; border-inline-start:3px solid var(--accent)}

  /* ---------------------------------------------------------- היסטוריה */
  .hcols{display:grid; grid-template-columns:minmax(0,1fr) 340px; gap:1.1rem; align-items:start}
  @media (max-width:1000px){ .hcols{grid-template-columns:1fr} }
  .htimeline{display:grid; gap:.5rem; margin-top:.7rem}
  .hsession{display:grid; grid-template-columns:auto 1fr auto; gap:.2rem .8rem;
    align-items:center; padding:.6rem .8rem; background:var(--surface-2);
    border:1px solid var(--line-soft); border-radius:var(--radius-sm);
    transition:border-color .2s var(--ease), transform .2s var(--ease)}
  .hsession:hover{border-color:var(--accent-line); transform:translateX(-2px)}
  .hsession .hdate{font-family:"IBM Plex Mono",monospace; font-size:var(--step--1); color:var(--accent)}
  .hsession .hmeta{grid-column:1/-1; font-size:var(--step--2); color:var(--muted)}
  .hsession .hvol{font-family:"IBM Plex Mono",monospace; font-weight:600; font-size:var(--step--1)}
  .hprog{display:flex; align-items:center; gap:.6rem; flex-wrap:wrap;
    padding:.55rem .75rem; border:1px solid var(--line-soft); border-radius:var(--radius-sm);
    background:var(--surface-2); margin-bottom:.4rem; transition:border-color .2s var(--ease)}
  .hprog:hover{border-color:var(--accent-line)}
  .hprog b{font-family:"IBM Plex Mono",monospace}
  .hprog .spacer{flex:1}
  .hbests{display:grid; grid-template-columns:repeat(auto-fill,minmax(160px,1fr)); gap:.45rem; margin-top:.6rem}
  .hbest{background:var(--surface-2); border:1px solid var(--line-soft); border-radius:var(--radius-sm);
    padding:.5rem .65rem}
  .hbest b{display:block; font-family:"IBM Plex Mono",monospace; font-size:var(--step-1); color:var(--accent)}
  .hbest span{font-size:var(--step--2); color:var(--muted)}
  @media (max-width:700px){
    .gate-card{padding:1.2rem 1rem}
    .hsession{grid-template-columns:auto 1fr}
    .hsession .hvol{grid-row:1; grid-column:2; justify-self:end}
  }

  /* רשימת נתונים: תווית מימין, ערך משמאל, קו מפריד עדין */
  .kv{display:grid; grid-template-columns:auto 1fr; gap:.05rem .7rem; margin:.6rem 0 0}
  .kv dt{font-size:var(--step--1); color:var(--muted); padding:.3rem 0; align-self:center}
  .kv dd{margin:0; text-align:start; font-weight:600; color:var(--ink);
    font-size:var(--step--1); padding:.3rem 0; align-self:center;
    border-bottom:1px solid var(--line-soft)}
  .kv dt{border-bottom:1px solid var(--line-soft)}
  .kv dt:last-of-type,.kv dd:last-of-type{border-bottom:0}

  .ex{border-top:1px solid var(--line-soft); padding:.85rem 0 .6rem; display:grid;
    grid-template-columns:1.9rem 1fr; gap:.15rem .6rem}
  .ex:last-child{padding-bottom:0}
  .ex .idx{font-family:"IBM Plex Mono",monospace; font-size:var(--step--1); color:var(--accent);
    padding-top:.2rem; opacity:.75}
  .ex .name{font-weight:700; font-size:var(--step-1); font-family:"Secular One",Heebo,sans-serif; font-weight:400}
  .ex .role{font-size:var(--step--1); color:var(--muted)}
  .ex .body{grid-column:2}
  .desc{font-size:var(--step--1); color:var(--ink-2); margin:.35rem 0 0; line-height:1.6}

  /* ---------- מרשם התרגיל ---------- */
  .pres{display:flex; flex-wrap:wrap; gap:.4rem; margin:.6rem 0 0}
  .pcell{display:flex; flex-direction:column; gap:.12rem; background:var(--surface-2);
    border:1px solid var(--line); border-radius:var(--radius-sm); padding:.35rem .65rem; min-width:74px}
  .pcell > span{font-size:var(--step--2); letter-spacing:.06em; color:var(--muted);
    text-transform:uppercase; white-space:nowrap}
  .pcell > b{font-size:var(--step-1); font-weight:700; white-space:nowrap}
  .pcell.key{background:linear-gradient(180deg, var(--accent-soft), transparent);
    border-color:var(--accent-line)}
  .pcell.key > span{color:var(--accent)}
  .kgwrap{display:flex; align-items:baseline; gap:.3rem}
  .kgin{width:68px; padding:.1rem .3rem; font-family:"IBM Plex Mono",monospace; font-weight:700;
    font-size:var(--step-1); text-align:center; border:1px solid var(--accent-line);
    border-radius:8px; background:var(--surface); color:var(--accent)}
  .kgwrap b{font-size:var(--step--1); color:var(--accent); font-weight:600; white-space:nowrap}
  .loadnote{font-size:var(--step--2); color:var(--muted); margin:.35rem 0 0}
  ul.cues{margin:.5rem 0 0; padding-inline-start:1.15rem; font-size:var(--step--1); color:var(--ink-2)}
  ul.cues li{margin-bottom:.18rem}

  /* ---------- פעולות ---------- */
  .acts{display:flex; flex-wrap:wrap; gap:.35rem; margin-top:.65rem}
  .acts button{padding:.32rem .7rem; font-size:var(--step--1); border-radius:999px; background:var(--surface-2)}
  .acts button.act-key{background:var(--accent-soft); color:var(--accent);
    border-color:var(--accent-line); font-weight:600}
  .acts button.act-alert{color:var(--crit); border-color:color-mix(in srgb, var(--crit) 35%, transparent)}
  .acts button.act-alert:hover{border-color:var(--crit); background:var(--crit-soft)}
  details.more{margin-top:.45rem}
  details.more summary{list-style:none; display:inline-flex; align-items:center; gap:.3rem;
    font-size:var(--step--1); color:var(--muted); cursor:pointer; padding:.2rem 0}
  details.more summary::-webkit-details-marker{display:none}
  details.more summary::before{content:'⌄'; transition:transform .25s var(--ease); display:inline-block}
  details.more[open] summary::before{transform:rotate(180deg)}
  details.more summary:hover{color:var(--accent)}
  .swap{display:flex; gap:.4rem; margin-top:.5rem; flex-wrap:wrap}
  .swap select{flex:1 1 8rem; min-width:0; font-size:var(--step--1); max-width:none}

  /* ---------- בורר ציוד ---------- */
  .presets{display:flex; gap:.4rem; flex-wrap:wrap; margin:.2rem 0 .85rem}
  .presets button{border-radius:999px; padding:.35rem .85rem; font-size:var(--step--1)}
  .presets button:hover{background:var(--accent-soft); color:var(--accent); border-color:var(--accent-line)}
  .eqsearch{width:100%; max-width:340px; margin-bottom:.8rem}
  .eqcat{margin-bottom:.95rem}
  .eqcat > h4{font-size:var(--step--2); letter-spacing:.12em; text-transform:uppercase; color:var(--muted);
    margin:0 0 .45rem; font-family:Heebo,sans-serif; font-weight:700}
  .eqgrid{display:flex; flex-wrap:wrap; gap:.4rem}
  .eqchip{display:inline-flex; align-items:center; gap:.4rem; border:1px solid var(--line);
    background:var(--surface-2); border-radius:999px; padding:.28rem .35rem .28rem .75rem;
    font-size:var(--step--1); cursor:pointer; color:var(--ink-2);
    transition:all .2s var(--ease)}
  .eqchip:hover{border-color:var(--accent-line); transform:translateY(-1px)}
  .eqchip[aria-pressed="true"]{background:var(--accent-soft); border-color:var(--accent-line);
    color:var(--accent); font-weight:600}
  .eqchip .qty{width:48px; padding:.08rem .25rem; font-size:var(--step--1); border-radius:7px;
    border:1px solid var(--line); background:var(--surface); color:var(--ink); text-align:center;
    font-family:"IBM Plex Mono",monospace}
  .eqchip .qty[hidden]{display:none}
  .eqchip .mark{width:17px; height:17px; border-radius:50%; border:1.5px solid var(--line); flex:none;
    transition:all .2s var(--ease)}
  .eqchip[aria-pressed="true"] .mark{background:var(--accent); border-color:var(--accent); position:relative}
  .eqchip[aria-pressed="true"] .mark::after{content:'✓'; position:absolute; inset:0; display:grid;
    place-items:center; color:var(--accent-ink); font-size:11px; font-weight:700}

  /* ---------- מלאי משקלים ---------- */
  .invgroup{border-top:1px solid var(--line-soft); padding:.75rem 0}
  .invgroup:first-child{border-top:0}
  .invgroup h4{margin:0 0 .4rem; font-size:var(--step--2); font-weight:700; font-family:Heebo,sans-serif;
    letter-spacing:.12em; text-transform:uppercase; color:var(--muted)}
  .invrows{display:flex; flex-wrap:wrap; gap:.35rem}
  .invchip{display:inline-flex; align-items:center; gap:.35rem; background:var(--surface-2);
    border:1px solid var(--line); border-radius:999px; padding:.2rem .4rem .2rem .7rem; font-size:var(--step--1)}
  .invchip b{color:var(--accent); font-family:"IBM Plex Mono",monospace}
  .invchip .qty{width:46px; padding:.04rem .2rem; text-align:center; border:1px solid var(--line);
    border-radius:6px; background:var(--surface); color:var(--ink); font-size:var(--step--2)}
  .invchip button{padding:0 .3rem; border-color:transparent; background:transparent; color:var(--muted)}
  .invchip button:hover{color:var(--crit); background:var(--crit-soft)}
  .invkg{width:96px} .invct{width:76px}
  .filebtn{display:inline-flex; align-items:center; gap:.4rem; border:1px solid var(--line);
    background:var(--surface-2); border-radius:var(--radius-sm); padding:.5rem .8rem; cursor:pointer}
  .filebtn:hover{border-color:var(--accent-line); color:var(--accent)}
  .thumbs{display:flex; gap:.5rem; flex-wrap:wrap; margin-top:.6rem}
  .thumbs img{width:78px; height:78px; object-fit:cover; border-radius:var(--radius-sm);
    border:1px solid var(--line)}


  /* ---------- ייבוא מגיליון ---------- */
  .imp-drop{display:flex; flex-wrap:wrap; align-items:center; gap:.6rem; justify-content:center;
    padding:1rem; border:1px dashed var(--line); border-radius:var(--r-md); text-align:center;
    color:var(--ink-3); transition:border-color .15s, background .15s}
  .imp-drop.over{border-color:var(--accent); background:var(--accent-soft); color:var(--ink)}
  .imp-paste{width:100%; font-family:"IBM Plex Mono",monospace; font-size:var(--step--1);
    background:var(--surface-2); color:var(--ink); border:1px solid var(--line);
    border-radius:var(--radius-sm); padding:.6rem; resize:vertical; line-height:1.5}
  .imp-paste:focus{border-color:var(--accent-line); outline:none}
  .imp-tab{gap:.35rem}
  .imp-tab button{padding:0 .2rem; line-height:1; font-size:var(--step--1)}
  /* בחירת סגנון אימון: כרטיסייה לכל סגנון, עם הסבר קצר מתחת לשם */
  .pickbox{display:inline-flex; align-items:center; padding:.15rem; margin:0}
  /* מתאמן לא פעיל נשאר ברשימה, אבל לא מושך את העין */
  .listrow.dim strong{color:var(--muted)}
  .listrow.dim .chip:not(.warn){opacity:.75}
  button.chip{cursor:pointer; font:inherit; font-size:var(--step--1)}

  .stylegrid{display:grid; grid-template-columns:repeat(auto-fit,minmax(210px,1fr)); gap:.45rem; margin-top:.45rem}
  .stylepick{display:flex; align-items:flex-start; gap:.5rem; padding:.5rem .6rem; cursor:pointer;
    border:1px solid var(--line); border-radius:var(--radius-sm); background:var(--surface-2)}
  .stylepick:has(input:checked){border-color:var(--accent-line); background:var(--accent-soft)}
  .stylepick span{display:flex; flex-direction:column; gap:.1rem; line-height:1.25}
  .stylepick small{color:var(--muted); font-size:var(--step--2)}

  .imp-tabs{max-height:14rem; overflow-y:auto; padding:.2rem}
  .imp-scroll{display:block; overflow-x:auto; margin-top:.6rem;
    border:1px solid var(--line); border-radius:var(--radius-sm)}
  .imp-map{width:100%; border-collapse:collapse; font-size:var(--step--1)}
  .imp-map th{text-align:start; font-weight:600; color:var(--muted);
    padding:.45rem .6rem; border-bottom:1px solid var(--line); white-space:nowrap}
  .imp-map td{padding:.4rem .6rem; border-bottom:1px solid var(--line); vertical-align:middle}
  .imp-map tr:last-child td{border-bottom:0}
  .imp-map tr:hover td{background:var(--surface-2)}
  .imp-map select{max-width:15rem}
  .imp-map .hint{margin:.1rem 0 0}
  @media (max-width:760px){
    .imp-map td, .imp-map th{padding:.35rem .4rem}
    .imp-map select{max-width:9rem}
  }

  /* ---------- גרפים ---------- */
  .charts{display:grid; grid-template-columns:repeat(auto-fill,minmax(230px,1fr)); gap:.7rem; margin-top:.7rem}
  .chart{margin:0; border:1px solid var(--line); border-radius:var(--radius); padding:.6rem .7rem .25rem;
    background:var(--surface-2); transition:border-color .25s var(--ease)}
  .chart:hover{border-color:var(--accent-line)}
  .chart figcaption{display:flex; align-items:baseline; gap:.45rem; flex-wrap:wrap; margin-bottom:.15rem}
  .chart .ctitle{font-size:var(--step--1); color:var(--muted); font-weight:600}
  .chart .cnow{font-size:var(--step-2); font-weight:700; margin-inline-start:auto;
    font-family:"IBM Plex Mono",monospace}
  .chart .cnow small{font-size:var(--step--1); font-weight:400; color:var(--muted)}
  .chart .cdelta{font-size:var(--step--2); font-weight:600; width:100%}
  .chart .cdelta.good{color:var(--ok)} .chart .cdelta.bad{color:var(--warn)} .chart .cdelta.neutral{color:var(--muted)}
  .chart svg{display:block; width:100%; height:auto; overflow:visible}
  .cgrid{stroke:var(--line); stroke-width:1}
  .carea{fill:var(--accent); opacity:.14}
  .cline{fill:none; stroke:var(--accent); stroke-width:2.5; stroke-linejoin:round; stroke-linecap:round;
    filter:drop-shadow(0 0 6px var(--glow))}
  .cdot{fill:var(--surface); stroke:var(--accent); stroke-width:2; transition:r .2s var(--ease)}
  .cdot.last{fill:var(--accent)}
  .chit{fill:transparent; cursor:pointer}
  .cpt:hover .cdot{r:6}
  .clabel{fill:var(--muted); font-size:9px; font-family:"IBM Plex Mono",monospace}
  .clabel.end{text-anchor:end}

  /* ---------- הערות ותרגילי בדיקה ---------- */
  .exnotes{margin-top:.55rem; display:flex; flex-direction:column; gap:.3rem}
  .exnote{display:flex; align-items:center; gap:.45rem; font-size:var(--step--1);
    background:var(--warn-soft); border-inline-start:3px solid var(--warn);
    border-radius:8px; padding:.3rem .6rem}
  .exnote.off{background:var(--surface-2); border-color:var(--line); color:var(--muted);
    text-decoration:line-through}
  .exnote button{padding:.08rem .45rem; font-size:var(--step--2); background:transparent;
    border-color:transparent; color:inherit}
  .exnote button:hover{border-color:currentColor}
  .notecard{border:1px solid var(--line); border-radius:var(--radius-sm); padding:.65rem .75rem;
    margin-bottom:.5rem; font-size:var(--step--1); background:var(--surface-2)}
  .notecard.off{opacity:.5}
  .notecard button{padding:.15rem .5rem; font-size:var(--step--2)}
  .probe{border:1px solid var(--warn); background:var(--warn-soft); border-radius:var(--radius);
    padding:.85rem; margin-top:.75rem}
  .probe.open{border-color:var(--accent-line); background:var(--accent-soft)}
  .probe h4{margin:0 0 .25rem; font-size:var(--step-1); font-family:"Secular One",Heebo,sans-serif; font-weight:400}

  /* ---------- טבלאות ---------- */
  table{width:100%; border-collapse:collapse; font-size:var(--step--1)}
  th,td{text-align:start; padding:.35rem .45rem; border-bottom:1px solid var(--line-soft)}
  th{color:var(--muted); font-weight:600}
  td.num{font-family:"IBM Plex Mono",monospace; font-variant-numeric:tabular-nums}
  .bar-track{height:6px; background:var(--surface-3); border-radius:3px; overflow:hidden; min-width:60px}
  .bar-fill{height:100%; background:linear-gradient(90deg, var(--accent-2), var(--accent));
    border-radius:3px; transition:width .6s var(--ease-out)}
  .bar-fill.over{background:linear-gradient(90deg, var(--warn), #F59E0B)}
  .empty{color:var(--muted); font-size:var(--step--1); border:1px dashed var(--line);
    border-radius:var(--radius-sm); padding:1.1rem; text-align:center}
  .daypick{display:flex; gap:.35rem; flex-wrap:wrap}
  .daypick label{display:inline-flex; align-items:center; gap:.35rem; border:1px solid var(--line);
    border-radius:999px; padding:.28rem .7rem; font-size:var(--step--1); cursor:pointer;
    background:var(--surface-2); transition:all .18s var(--ease)}
  .daypick label:hover{border-color:var(--accent-line)}
  .daypick input{accent-color:var(--accent)}

  /* ---------- יומן ---------- */
  .log{position:fixed; inset-block-end:1rem; inset-inline-end:1rem; width:min(400px,calc(100vw - 2rem));
    max-height:44vh; overflow:auto; background:color-mix(in srgb, var(--surface) 92%, transparent);
    backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px);
    border:1px solid var(--line); border-radius:var(--radius); box-shadow:var(--shadow-lift);
    padding:.85rem; font-size:var(--step--1); z-index:50; animation:popIn .35s var(--ease-out)}
  .log[hidden]{display:none}
  .log-head{display:flex; align-items:center; gap:.45rem; margin-bottom:.45rem}
  .log-head h4{margin:0; flex:1; font-size:var(--step--2); letter-spacing:.12em;
    text-transform:uppercase; color:var(--muted); font-family:Heebo,sans-serif}
  .log-head button{padding:.12rem .5rem; font-size:var(--step--2); border-color:transparent; color:var(--muted)}
  .log-head button:hover{color:var(--accent)}
  .log .entry{border-top:1px solid var(--line-soft); padding:.5rem 0; animation:slideDown .3s var(--ease-out)}
  .log .entry:first-of-type{border-top:0}
  .log b{color:var(--accent)}

  /* ==================================================================
     אנימציות
     ================================================================== */
  @keyframes popIn{from{opacity:0; transform:translateY(8px) scale(.98)} to{opacity:1; transform:none}}
  @keyframes slideDown{from{opacity:0; transform:translateY(-6px)} to{opacity:1; transform:none}}
  @keyframes riseIn{from{opacity:0; transform:translateY(18px)} to{opacity:1; transform:none}}
  @keyframes drawLine{from{stroke-dashoffset:1} to{stroke-dashoffset:0}}
  @keyframes sheen{from{background-position:200% 0} to{background-position:-200% 0}}

  /* כניסה מדורגת: רק כשמחליפים מסך, לא בכל רינדור */
  .stagger > *{animation:riseIn .5s var(--ease-out) backwards}
  .stagger > *:nth-child(1){animation-delay:.02s}
  .stagger > *:nth-child(2){animation-delay:.07s}
  .stagger > *:nth-child(3){animation-delay:.12s}
  .stagger > *:nth-child(4){animation-delay:.17s}
  .stagger > *:nth-child(5){animation-delay:.22s}
  .stagger > *:nth-child(6){animation-delay:.27s}
  .stagger > *:nth-child(n+7){animation-delay:.32s}

  .cline{stroke-dasharray:1; stroke-dashoffset:0}
  .drawin .cline{animation:drawLine .9s var(--ease-out) backwards}

  @media (prefers-reduced-motion:reduce){
    *,*::before,*::after{animation-duration:.01ms !important; animation-iteration-count:1 !important;
      transition-duration:.01ms !important}
    body::before{animation:none}
  }

  /* ==================================================================
     מובייל — מסך האימון הוא הראשון בתור
     ================================================================== */
  @media (max-width:700px){
    :root{--step-3:1.7rem; --step-4:2.2rem}
    /* בלי backdrop-filter כאן — הוא יוצר בלוק מכיל ומשתק את position:fixed של הניווט */
    header.bar{padding:.55rem .8rem; gap:.45rem; backdrop-filter:none; -webkit-backdrop-filter:none;
      background:color-mix(in srgb, var(--surface) 97%, transparent)}
    header.bar h1{font-size:var(--step-0)}
    header.bar h1::before{height:18px; width:7px}

    /* הניווט יורד לתחתית — שם האגודל מגיע */
    .tabs{
      position:fixed; inset-inline:0; bottom:0; z-index:60; border-radius:0;
      border:0; border-top:1px solid var(--line); padding:.3rem .4rem .5rem;
      background:color-mix(in srgb, var(--surface) 94%, transparent);
      backdrop-filter:blur(18px); -webkit-backdrop-filter:blur(18px);
      justify-content:space-around;
    }
    /* שש לשוניות על מסך טלפון: המספרים יורדים, והשמות נשארים קריאים.
       הגלילה האופקית היא רשת ביטחון למסכים צרים במיוחד. */
    .tabs{overflow-x:auto; scrollbar-width:none; width:100vw; max-width:100vw}
    .tabs::-webkit-scrollbar{display:none}
    /* הלשוניות מתכווצות ולא גולשות: גלישה של שורת הניווט גורמת לדפדפן הנייד
       להקטין את כל העמוד, וזה קורה עוד לפני שהגופנים נטענים. */
    .tabs button{flex:1 1 auto; min-width:0; padding:.6rem .25rem; font-size:.78rem;
      border-radius:var(--radius-sm); white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
    .tabs button b{display:none}
    body{padding-bottom:72px}
    .log{inset-block-end:80px; max-height:38vh}

    main.wrap{padding:.7rem}
    .cols{gap:.8rem}
    .steps{gap:.4rem}
    .steps a{flex:1 1 100%; padding:.55rem .7rem}
    .steps a .t span{display:none}
    .hero h2{font-size:1.55rem}
    .tiles{width:100%; margin-inline-start:0}
    .tile{flex:1; min-width:0}

    .days{grid-template-columns:1fr; gap:.8rem}
    .card{padding:.85rem; border-radius:12px}
    .ex{grid-template-columns:1.5rem 1fr; gap:.1rem .5rem}
    .ex .name{font-size:var(--step-1)}

    /* המרשם בשלוש עמודות גדולות וברורות */
    .pres{display:grid; grid-template-columns:repeat(3,1fr); gap:.4rem}
    .pcell{min-width:0; padding:.45rem .4rem; align-items:center; text-align:center}
    .pcell > b{font-size:var(--step-1)}
    .pcell:nth-child(n+4){display:none}
    .kgin{width:100%; max-width:78px; font-size:var(--step-1)}

    /*
     * שורת הפעולות של מסך האימון: בשולחן היא שורה אחת, בטלפון היא נשברת
     * לשורות לא אחידות ונראית מבולגנת. רשת של שתי עמודות נותנת לכל בורר
     * ולכל כפתור מקום שווה ומטרת מגע רחבה.
     */
    .progbar{display:grid; grid-template-columns:1fr 1fr; gap:.45rem}
    .progbar select{max-width:none; width:100%}
    .progbar button{width:100%}

    /*
     * שורת רשימה בטלפון: השם והשבבים בשורה אחת, והכפתורים בשורה משלהם
     * שמתחילה באותו קו. בלי זה הם נוחתים כל פעם במקום אחר, לפי אורך השם.
     */
    .listrow{align-items:flex-start}
    .listrow .grow{flex-basis:100%; height:0; margin:0}
    .listrow > button{flex:1 1 auto}

    /* הוספת משקל למלאי: משקל, כמות והוספה בשורה אחת; מילוי סט בשורה משלו */
    .invadd{display:grid; grid-template-columns:1fr 1fr auto; gap:.4rem}
    .invadd input{width:100%; min-width:0}
    .invadd [data-invfill]{grid-column:1 / -1}

    /* מטרות מגע גדולות */
    .acts button{padding:.5rem .85rem; font-size:var(--step-0); min-height:40px}
    .acts{gap:.4rem}
    button,select,input{min-height:42px}
    /* אצבע צריכה מטרה גדולה יותר מסמן עכבר */
    input[type=checkbox],input[type=radio]{width:24px; height:24px; min-height:24px}
    label:has(> input[type=checkbox]),label:has(> input[type=radio]){padding:.25rem 0}
    .fields{grid-template-columns:1fr}
    .charts{grid-template-columns:1fr 1fr; gap:.5rem}
    /* עורך מבנה האימון: הכפתורים יורדים לשורה משלהם, ונשאר מקום לשם המקטע */
    .segrow{grid-template-columns:auto minmax(0,1fr) 4.2rem; gap:.35rem .4rem}
    .segrow > div:last-child{grid-column:1 / -1; justify-content:flex-end}
    .eqchip{padding:.4rem .4rem .4rem .8rem}
    .eqchip .mark{width:20px; height:20px}
  }
  @media (max-width:400px){
    .charts{grid-template-columns:1fr}
    /*
     * במסך צר שלוש עמודות נעשות צרות מדי, אבל שלושה תאים בשתי עמודות
     * משאירים תא יתום באמצע. לכן מוסיפים את המנוחה ומקבלים ריבוע מלא.
     */
    .pres{grid-template-columns:repeat(2,1fr)}
    .pcell:nth-child(4){display:flex}
    .pcell:nth-child(n+5){display:none}
  }

  /* ---------- הדפסה ---------- */
  @media print{
    :root{--ground:#fff; --surface:#fff; --surface-2:#fff; --surface-3:#fff; --line:#c9cbc8;
      --line-soft:#e3e5e2; --ink:#000; --ink-2:#333; --muted:#555; --accent:#1D4ED8;
      --accent-soft:#eef4ff; --shadow:none; --shadow-lift:none}
    body::before,body::after{display:none}
    header.bar,.steps,.tabs,.log,.acts,details.more,.swap,#programSteps,
    #viewStudio,#viewTrainees,.tiles,#print,#gen,#genAll,#next,#nextAll,.bar,#exportCard{display:none !important}
    body{background:#fff; padding-bottom:0}
    main.wrap{max-width:none; padding:0}
    .cols{display:block}
    .card{break-inside:avoid; box-shadow:none; border-color:#c9cbc8; margin-bottom:.6rem}
    .card::before{display:none}
    .days,.charts{display:block}
    .day,.ex,.chart{break-inside:avoid; page-break-inside:avoid}
    a[href]::after{content:''}
  }
</style>
</head>
<body>

<!-- מסך הכניסה. עד שיש חשבון מחובר, שום נתון לא נטען ולא מוצג. -->

<script type="module">
/*ENGINE*/

/* ==================================================================
   מסך המאמן — כל המנוע רץ כאן בדפדפן. אין שרת ואין שליחת נתונים החוצה.
   ================================================================== */

const $ = (s) => document.querySelector(s);
const STORE_KEY = 'studio-training/db/v2';

const state = {
  studios: [], trainees: [], program: null, view: 'program', server: false,
  account: null, snapshots: [], sessionLog: [],
  /** רשימת המתאמנים: חיפוש, סינון לפי סטטוס, ומי שנבחר לפעולה קבוצתית. */
  traineeQuery: '', traineeFilter: 'all', picked: new Set(), bulkConfirm: false,
  /** מה שנמחק לאחרונה — כדי שאפשר יהיה להחזיר אותו. */
  undoDelete: null,
};

/* ==================================================================
   חשבונות והפרדת נתונים.

   עם שרת: ההרשמה וההתחברות רצות מול השרת, הסיסמה מגובבת שם ב-scrypt,
   והמושב נשמר בעוגיית HttpOnly שסקריפט בדף אינו יכול לקרוא.

   בלי שרת (העמוד נפתח כקובץ או כדף עצמאי): אותו תהליך רץ בדפדפן —
   הסיסמה מגובבת ב-PBKDF2 דרך WebCrypto, ולכל חשבון יש מפתח אחסון משלו,
   כך שנתוני סטודיו אחד לא נוגעים בנתוני סטודיו אחר גם באותו מחשב.
   ================================================================== */
const ACCOUNTS_KEY = 'studio-training/accounts/v1';
const SESSION_KEY = 'studio-training/session/v1';
const dataKeyFor = (accountId) => `studio-training/db/v3/${accountId}`;

const lsGet = (k, fallback = null) => {
  try { return JSON.parse(localStorage.getItem(k) || 'null') ?? fallback; } catch { return fallback; }
};
const lsSet = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch { return false; } };

/** גיבוב סיסמה מקומי. PBKDF2 עם 210,000 סיבובים ומלח אקראי לכל חשבון. */
async function derive(password, saltHex) {
  const enc = new TextEncoder();
  const salt = Uint8Array.from(saltHex.match(/../g).map((h) => parseInt(h, 16)));
  const key = await crypto.subtle.importKey('raw', enc.encode(password), 'PBKDF2', false, ['deriveBits']);
  const bits = await crypto.subtle.deriveBits(
    { name: 'PBKDF2', salt, iterations: 210000, hash: 'SHA-256' }, key, 256,
  );
  return [...new Uint8Array(bits)].map((b) => b.toString(16).padStart(2, '0')).join('');
}
const randomHex = (n) => [...crypto.getRandomValues(new Uint8Array(n))]
  .map((b) => b.toString(16).padStart(2, '0')).join('');

/** אותם כללים כמו בשרת, כדי שאותה סיסמה תתקבל בשני המצבים. */
function checkCredentials(username, password) {
  const errors = [];
  const u = String(username || '').trim().toLowerCase();
  if (u.length < 3) errors.push('שם המשתמש חייב להיות באורך 3 תווים לפחות.');
  else if (!/^[a-z0-9._@-]+$/.test(u)) errors.push('שם המשתמש יכול להכיל אותיות באנגלית, ספרות, נקודה, מקף, קו תחתון או @.');
  if (String(password || '').length < 8) errors.push('הסיסמה חייבת להיות באורך 8 תווים לפחות.');
  else if (/^\d+$/.test(password)) errors.push('סיסמה של ספרות בלבד קלה מדי לניחוש.');
  return { ok: errors.length === 0, errors, username: u };
}

const auth = {
  async me() {
    if (state.server) {
      const r = await api('/api/auth/me');
      return r.ok ? r.account : null;
    }
    const sid = lsGet(SESSION_KEY);
    if (!sid) return null;
    const acc = (lsGet(ACCOUNTS_KEY, {}))[sid.username];
    return acc ? { id: acc.id, username: acc.username, studioName: acc.studioName } : null;
  },

  async register({ username, password, studioName }) {
    const v = checkCredentials(username, password);
    if (!v.ok) return { ok: false, errors: v.errors };

    if (state.server) return api('/api/auth/register', { username, password, studioName });

    const accounts = lsGet(ACCOUNTS_KEY, {});
    if (accounts[v.username]) return { ok: false, errors: ['שם המשתמש הזה כבר תפוס.'] };
    const salt = randomHex(16);
    const acc = {
      id: `acc_${randomHex(8)}`, username: v.username, salt,
      hash: await derive(password, salt), studioName: String(studioName || '').trim(),
      createdAt: new Date().toISOString(),
    };
    accounts[v.username] = acc;
    if (!lsSet(ACCOUNTS_KEY, accounts)) {
      return { ok: false, errors: ['הדפדפן חוסם אחסון מקומי, ולכן אי אפשר לשמור חשבון במצב הזה.'] };
    }
    lsSet(SESSION_KEY, { username: acc.username, at: Date.now() });
    return { ok: true, account: { id: acc.id, username: acc.username, studioName: acc.studioName } };
  },

  async login({ username, password }) {
    if (state.server) return api('/api/auth/login', { username, password });

    const u = String(username || '').trim().toLowerCase();
    const acc = (lsGet(ACCOUNTS_KEY, {}))[u];
    const generic = { ok: false, errors: ['שם משתמש או סיסמה שגויים.'] };
    if (!acc) return generic;
    if (await derive(password, acc.salt) !== acc.hash) return generic;
    lsSet(SESSION_KEY, { username: acc.username, at: Date.now() });
    return { ok: true, account: { id: acc.id, username: acc.username, studioName: acc.studioName } };
  },

  async logout() {
    if (state.server) { try { await api('/api/auth/logout', {}); } catch { /* ממילא יוצאים */ } }
    try { localStorage.removeItem(SESSION_KEY); } catch { /* חסום */ }
    state.account = null;
  },
};

/* ==================================================================
   שכבת אחסון.
   כשהעמוד מוגש מהשרת של הסטודיו — הכול נשמר במסד המשותף וכל המאמנים
   רואים את אותו מידע. כשהוא נפתח כקובץ עצמאי אין שרת, ולכן הנתונים
   נשמרים בדפדפן הזה בלבד. המצב מוצג במפורש בראש המסך.
   ================================================================== */
const api = async (path, body, method) => {
  const res = await fetch(path, body
    ? { method: method || 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(body) }
    : {});
  const data = await res.json();
  if (data.error) throw new Error(data.error);
  return data;
};

const store = {
  async detect() {
    // עמוד שנפתח כקובץ מקומי או כארטיפקט אינו יכול לפנות לשרת כלל,
    // ואין טעם לנסות — הניסיון רק מייצר שגיאת רשת מיותרת בקונסול.
    if (!location.protocol.startsWith('http')) { state.server = false; return false; }
    try {
      const r = await fetch('/api/health', { cache: 'no-store' });
      state.server = r.ok && (await r.json()).ok === true;
    } catch { state.server = false; }
    return state.server;
  },
  async load() {
    if (state.server) {
      state.studios = await api('/api/studios');
      state.trainees = await api('/api/trainees');
      return;
    }
    // מפתח האחסון כולל את מזהה החשבון, ולכן שני סטודיואים באותו דפדפן
    // פשוט לא קוראים מאותו מקום. אין כאן סינון שאפשר לשכוח.
    const local = lsGet(dataKeyFor(state.account.id));
    const fresh = !local;
    state.studios = local?.studios || (state.demoSeed ? structuredClone(STUDIOS) : []);
    state.trainees = local?.trainees || (state.demoSeed ? structuredClone(TRAINEES) : []);
    state.snapshots = local?.snapshots || [];
    if (fresh && state.demoSeed) this.persistLocal();
  },
  /*
   * שמירה מקומית שנכשלת בשקט היא הדבר הגרוע ביותר שיכול לקרות כאן: המסך
   * מראה "נשמר", והמאמן מגלה את האמת רק אחרי רענון, כשהכול נעלם. אחסון
   * הדפדפן מוגבל בכמה מגה-בייט, וייבוא של גיליון גדול יכול למלא אותו.
   */
  persistLocal() {
    if (state.server || !state.account) return true;
    const ok = lsSet(dataKeyFor(state.account.id), {
      studios: state.studios, trainees: state.trainees, snapshots: state.snapshots,
      savedAt: new Date().toISOString(),
    });
    if (!ok && !state.storageWarned) {
      state.storageWarned = true;
      const msg = 'האחסון של הדפדפן מלא והשמירה נכשלה. אפשר למחוק ארכיון תכניות ישן במסך '
        + 'ההיסטוריה, או להפעיל את המערכת עם שרת (npm start) שבו אין את המגבלה הזאת.';
      flash(msg, 'crit');
      log('שמירה נכשלה', msg);
    }
    if (ok) state.storageWarned = false;
    return ok;
  },

  /* ---- היסטוריה: ארכיון תכניות ויומן אימונים */

/*
 * גיזום הארכיון נעשה לכל מתאמן בנפרד, ולא כתקרה אחת לכל המערכת.
 * תקרה גלובלית של 400 נשמעת גדולה, אבל בסטודיו עם מאה מתאמנים היא
 * ארבע תכניות לאדם — וייבוא של גיליון שלם היה מוחק בשקט את ההיסטוריה
 * של מי שיובא ראשון. תכנית שיובאה נשמרת בכמות גדולה יותר מתכנית
 * שנבנתה, כי אין לה מקור אחר להפיק ממנו.
 */
const SNAP_KEEP_GENERATED = 12;
const SNAP_KEEP_IMPORTED = 60;

let snapSeq = 0;
function nextSnapSeq() {
  snapSeq = Math.max(snapSeq, ...state.snapshots.map((x) => x.seq || 0)) + 1;
  return snapSeq;
}

const snapshotOrder = (a, b) => (a.at !== b.at ? (a.at < b.at ? 1 : -1) : (b.seq || 0) - (a.seq || 0));
const isImportedSnap = (x) => x.reason === 'imported' || x.program?.meta?.imported;
const traineeSnapshots = (traineeId) => state.snapshots
  .filter((x) => x.traineeId === traineeId).sort(snapshotOrder);

function pruneSnapshots(all) {
  const keep = new Set();
  for (const traineeId of new Set(all.map((x) => x.traineeId))) {
    const mine = all.filter((x) => x.traineeId === traineeId).sort(snapshotOrder);
    for (const x of mine.filter((s) => !isImportedSnap(s)).slice(0, SNAP_KEEP_GENERATED)) keep.add(x.id);
    for (const x of mine.filter(isImportedSnap).slice(0, SNAP_KEEP_IMPORTED)) keep.add(x.id);
  }
  return all.filter((x) => keep.has(x.id));
}


  /** צילום מצב של תכנית. תוכן זהה לאחרון אינו נשמר שוב. */
  async archive(program, reason = 'generated') {
    if (state.server) return; // השרת מארכב לבד בכל בנייה
    const snap = programSnapshot(program, { reason });
    const last = traineeSnapshots(program.traineeId)[0];
    if (last && sameContent(last, snap)) return;
    state.snapshots = pruneSnapshots([...state.snapshots, { ...snap, seq: nextSnapSeq() }]);
    this.persistLocal();
  },

  /** צילומי מצב שהגיעו מייבוא — נכנסים לארכיון בלי לדרוס מה שכבר יש. */
  async importSnapshots(snapshots) {
    if (state.server) {
      await api('/api/import/snapshots', { snapshots });
      return;
    }
    const known = new Set(state.snapshots.map((x) => x.id));
    const fresh = snapshots.filter((x) => !known.has(x.id)).map((x) => ({ ...x, seq: nextSnapSeq() }));
    state.snapshots = pruneSnapshots([...state.snapshots, ...fresh]);
    this.persistLocal();
  },

  async loadHistory(traineeId) {
    if (state.server) {
      const r = await api(`/api/history?traineeId=${encodeURIComponent(traineeId)}`);
      return r;
    }
    const t = traineeById(traineeId);
    const log = t?.sessionLog || [];
    const snaps = traineeSnapshots(traineeId);
    return {
      ok: true,
      traineeId,
      traineeName: t?.name || '',
      summary: historySummary(log, snaps),
      sessions: groupSessions(log),
      bests: personalBests(log).slice(0, 20),
      programs: snaps.map(({ program, ...meta }) => meta),
    };
  },

  async loadArchivedProgram(snapshotId, traineeId) {
    if (state.server) {
      const r = await api(`/api/history/program?snapshotId=${encodeURIComponent(snapshotId)}`);
      return r.snapshot;
    }
    return state.snapshots.find((x) => x.id === snapshotId && x.traineeId === traineeId) || null;
  },

  /** רישום ליומן האימונים — מה שבאמת בוצע, להבדיל ממה שתוכנן. */
  async appendLog(traineeId, entries) {
    const normalized = entries.map((e) => normalizeLogEntry({ ...e, traineeId }));
    const raw = traineeById(traineeId);
    if (raw) raw.sessionLog = [...(raw.sessionLog || []), ...normalized];
    if (state.server) {
      try { await api('/api/history/log', { traineeId, entries: normalized }); } catch { /* נשמר מקומית */ }
    }
    this.persistLocal();
    return normalized;
  },
  async saveStudio(studio) {
    if (state.server) {
      const r = await api('/api/studios', studio);
      await this.load();
      return r;
    }
    const id = studio.id || slugify(studio.name);
    const withId = { ...studio, id };
    state.studios = [...state.studios.filter((x) => x.id !== id), withId];
    this.persistLocal();
    const n = normalizeStudio(withId);
    return { ok: true, id, missing: missingStudioInfo(n) };
  },
  async saveTrainee(trainee) {
    if (state.server) {
      const r = await api('/api/trainees', trainee);
      await this.load();
      return r;
    }
    const id = trainee.id || `${slugify(trainee.name)}_${Math.random().toString(36).slice(2, 6)}`;
    const withId = { ...trainee, id };
    const v = validateInput(normalizeTrainee(withId), normalizeStudio(studioById(trainee.studioId)));
    if (!v.ok) return { ok: false, errors: v.errors, warnings: v.warnings };
    /*
     * עדכון שומר על המקום ברשימה. קודם הרשומה נמחקה ונוספה בסוף, ולכן כל
     * שינוי קטן — סימון "לא פעיל", תיקון טלפון — הקפיץ את המתאמן לתחתית
     * הרשימה בזמן שהמאמן עובד עליה.
     */
    const at = state.trainees.findIndex((x) => x.id === id);
    if (at >= 0) state.trainees = state.trainees.map((x, i) => (i === at ? withId : x));
    else state.trainees = [...state.trainees, withId];
    this.persistLocal();
    return { ok: true, id, warnings: v.warnings };
  },
  /**
   * מחיקת מתאמן.
   * ההיסטוריה נמחקת יחד איתו — ארכיון תכניות של אדם שכבר לא רשום הוא
   * מידע אישי בלי בעלים, ואין מסך שמציג אותו.
   */
  async deleteTrainee(id) {
    if (state.server) {
      await api('/api/trainees/delete', { id });
      await this.load();
      return;
    }
    state.trainees = state.trainees.filter((t) => t.id !== id);
    state.snapshots = (state.snapshots || []).filter((s) => s.traineeId !== id);
    this.persistLocal();
  },

  async updateTrainee(raw) {
    const at = state.trainees.findIndex((x) => x.id === raw.id);
    state.trainees = at >= 0
      ? state.trainees.map((x, i) => (i === at ? raw : x))
      : [...state.trainees, raw];
    if (state.server) { try { await api('/api/trainees', raw); } catch { /* נשמר מקומית בכל מקרה */ } }
    this.persistLocal();
  },
};

const slugify = (name) => String(name).trim().replace(/\s+/g, '_').replace(/[^\w֐-׿_-]/g, '') || `x_${Date.now()}`;

const traineeById = (id) => state.trainees.find((t) => t.id === id);
const esc = (v) => String(v ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

/** מה חסר בפרופיל הסטודיו כדי שהתכניות יהיו מדויקות. */
function missingStudioInfo(studio) {
  const missing = [];
  if (studio.equipment.size <= 1) missing.push('לא נבחר ציוד — התכניות ייבנו ממשקל גוף בלבד.');
  if (!studio.dumbbellMaxKg && studio.equipment.get('dumbbell')) missing.push('לא הוגדר המשקל הכבד ביותר של המשקולות.');
  if (!studio.ceilingHeightCm) missing.push('לא הוגדר גובה תקרה.');
  return missing;
}

function log(title, lines) {
  const el = $('#log');
  el.hidden = false;
  const body = Array.isArray(lines) ? lines : [lines];
  const entries = $('#logBody');
  entries.insertAdjacentHTML('afterbegin',
    `<div class="entry"><b>${title}</b><br>${body.filter(Boolean).join('<br>')}</div>`);
  // שומרים את היומן קצר — הוא עוזר בזמן אמת, לא ארכיון
  while (entries.children.length > 12) entries.lastElementChild.remove();
}

function toggleTheme() {
  const cur = document.documentElement.getAttribute('data-theme');
  const dark = cur ? cur === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
  document.documentElement.setAttribute('data-theme', dark ? 'light' : 'dark');
}

/** הודעת אישור קצרה שמוצגת בראש המסך הבא. */
function flash(message, kind = '') {

function flashHtml() {
  if (!state.flash) return '';
  const { message, kind } = state.flash;
  state.flash = null;
  return `<div class="banner ${kind}">${message}</div>`;
}

const REDUCED = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

/** מפעיל כניסה מדורגת על ילדי אלמנט, ומסיר את הסימון בסיום כדי שרינדור חוזר לא יקפוץ. */
function animateIn(el) {
  if (!el || REDUCED) return;
  el.classList.remove('stagger');
  void el.offsetWidth;
  el.classList.add('stagger');
  const done = () => el.classList.remove('stagger');
  window.setTimeout(done, 1200);
}

/** ספירה עולה למספרים בכרטיסי הנתונים. */
function countUp(root) {
  if (!root || REDUCED) return;
  root.querySelectorAll('.tile b').forEach((node) => {
    const raw = node.textContent.trim();
    const m = raw.match(/^(-?\d+(?:\.\d+)?)(.*)$/s);
    if (!m) return;
    const target = Number(m[1]);
    if (!Number.isFinite(target) || target === 0) return;
    const decimals = (m[1].split('.')[1] || '').length;
    const suffix = m[2];
    const start = performance.now();
    const DUR = 620;
    const tick = (now) => {
      const t = Math.min(1, (now - start) / DUR);
      const eased = 1 - Math.pow(1 - t, 3);
      node.textContent = (target * eased).toFixed(decimals) + suffix;
      if (t < 1) requestAnimationFrame(tick);
      else node.textContent = raw;
    };
    node.textContent = (0).toFixed(decimals) + suffix;
    requestAnimationFrame(tick);
  });
}

/**
 * @param {string} view
 * @param {{regenerate?:boolean}} opts  regenerate=false פותח את מסך האימון
 *   בלי לבנות תכנית חדשה — כך אפשר להציג תכנית מהארכיון בלי שתידרס.
 */
function setView(view, opts = {}) {
  state.view = view;
  document.querySelectorAll('#tabs button').forEach((b) => b.setAttribute('aria-current', String(b.dataset.view === view)));
  $('#viewStudio').hidden = view !== 'studio';
  $('#viewTrainees').hidden = view !== 'trainees';
  $('#viewProgram').hidden = view !== 'program';
  $('#viewHistory').hidden = view !== 'history';
  $('#viewCalendar').hidden = view !== 'calendar';
  $('#viewImport').hidden = view !== 'import';
  if (view === 'import') renderImportView();
  if (view === 'history') renderHistoryView();
  if (view === 'calendar') renderCalendarView();
  if (view === 'studio') { renderStudioView(); animateIn($('#viewStudio')); countUp($('#viewStudio')); }
  if (view === 'trainees') { renderTraineesView(); animateIn($('#viewTrainees')); countUp($('#viewTrainees')); }
  if (view === 'program') {
    $('#programSteps').innerHTML = stepsBar('program') + flashHtml();
    wireSteps();
    fillStudios();
    if (opts.regenerate !== false) generate();
  }
}

function fillStudios() {
  const sel = $('#studio');
  const cur = sel.value;
  sel.innerHTML = state.studios.map((s) => `<option value="${esc(s.id)}">${esc(s.name)}</option>`).join('');
  if (cur && state.studios.some((s) => s.id === cur)) sel.value = cur;
  // אחרי ייבוא של רשת, הסניפים הם שמחזיקים את המתאמנים. פתיחה על סניף ריק
  // נראית כאילו הייבוא נכשל, ולכן נבחר הסניף הראשון שבאמת יש בו מי להתאמן.
  if (!traineesOf(sel.value).length) {
    const populated = state.studios.find((s) => traineesOf(s.id).length);
    if (populated) sel.value = populated.id;
  }
  fillTrainees();
}

/** המתאמנים שרשאים להתאמן בסניף מסוים. */
function traineesOf(studioId) {
  return state.trainees.filter((t) => {
    const ids = (t.studioIds && t.studioIds.length) ? t.studioIds : [t.homeStudioId || t.studioId];
    return ids.includes(studioId);
  });
}

function fillTrainees() {
  // מתאמן יכול להיות משויך לכמה סניפים — הרשימה מציגה את כל מי
  // שמורשה להתאמן כאן, ולא רק את מי שזה הסניף הראשי שלו.
  const list = traineesOf($('#studio').value);
  const keep = $('#trainee').value;
  $('#trainee').innerHTML = list.length
    ? list.map((t) => `<option value="${esc(t.id)}">${esc(t.name)}${isActive(t) ? '' : ' · לא פעיל'}</option>`).join('')
    : '<option value="">— אין מתאמנים —</option>';
  // מעבר בין סניפים לא אמור להחליף מתאמן — אותו אדם, ציוד אחר
  if (keep && list.some((t) => t.id === keep)) $('#trainee').value = keep;
}

/* ==================================================================
   מסלול השלבים — נוכח בכל מסך, כדי שתמיד ברור איפה נמצאים ומה הלאה
   ================================================================== */
function stepsBar(current) {
  const hasStudio = state.studios.length > 0;
  const hasTrainee = state.trainees.length > 0;
  const steps = [
    { view: 'studio', n: 1, t: 'הסטודיו', s: hasStudio ? `${state.studios.length} רשומים` : 'ציוד, משקלים ומרחב', done: hasStudio },
    { view: 'trainees', n: 2, t: 'המתאמנים', s: hasTrainee ? `${state.trainees.length} רשומים` : 'מטרות, פציעות ופרטים', done: hasTrainee },
    { view: 'program', n: 3, t: 'האימון', s: 'תכנית שבועית ומשוב', done: false },
  ];
  return `<nav class="steps">${steps.map((x) => `
    <a data-goto="${x.view}" aria-current="${x.view === current}" data-done="${x.done && x.view !== current}">
      <span class="n">${x.done && x.view !== current ? '✓' : x.n}</span>
      <span class="t"><b>${x.t}</b><span>${esc(x.s)}</span></span>
    </a>`).join('')}</nav>`;
}

function wireSteps() {
  document.querySelectorAll('[data-goto]').forEach((a) => {
    a.onclick = (e) => { e.preventDefault(); setView(a.dataset.goto); };
  });
}

const INV_GROUPS = [
  { key: 'dumbbells', label: 'משקולות יד', unit: 'ק״ג', hint: 'כמות = כמה יחידות מהמשקל הזה (2 = זוג)',

  { key: 'kettlebells', label: 'קטלבלים', unit: 'ק״ג', hint: '',
    preset: [8, 12, 16, 20, 24, 28, 32], defaultCount: 1 },
  { key: 'plates', label: 'פלטות משקל', unit: 'ק״ג', hint: 'כמות = כמה פלטות בסך הכול (נטענות בזוגות)',
    preset: [1.25, 2.5, 5, 10, 15, 20, 25], defaultCount: 4 },
  { key: 'bars', label: 'מוטות', unit: 'ק״ג', hint: 'מוט אולימפי 20, מוט קל 15, מוט EZ 7.5',
    preset: [7.5, 10, 15, 20], defaultCount: 1 },
  { key: 'fixedBars', label: 'מוטות קבועים', unit: 'ק״ג', hint: 'מוטות עם משקל קבוע, אם יש',
    preset: [10, 15, 20, 25, 30, 35, 40], defaultCount: 1 },
];

let invState = { dumbbells: [], kettlebells: [], plates: [], bars: [], fixedBars: [] };

/* ---------------------------------------------------------------- מבנה האימון */

/** המבנה שנערך כרגע בטופס הסטודיו. */
let structState = normalizeStructure(null);

const SEG_COLOR = {
  warmup: '#60A5FA', mobility: '#38BDF8', core: '#F59E0B', prehab: '#A78BFA',
  strength: '#4C8DFF', conditioning: '#34D399', cooldown: '#94A3B8', custom: '#F472B6',
};

function renderStructureEditor() {
  const host = $('#structEditor');
  if (!host) return;

  const minutes = +($('#studioForm')?.sessionMinutes?.value) || 60;
  const plan = structurePlan(structState, minutes);
  const total = plan.reduce((n, p) => n + p.minutes, 0);

  host.innerHTML = `
    ${structState.map((seg, i) => `
      <div class="segrow" data-seg="${esc(seg.id)}">
        <span class="grip" title="גרירה לשינוי סדר" draggable="true">⋮⋮</span>
        <div style="display:grid; gap:.3rem">
          <select data-seg-kind="${esc(seg.id)}" aria-label="סוג מקטע">
            ${Object.entries(SEGMENT_KINDS).map(([k, v]) => `
              <option value="${k}" ${k === seg.kind ? 'selected' : ''}>${esc(v.label)}</option>`).join('')}
          </select>
          <input data-seg-label="${esc(seg.id)}" value="${esc(seg.label)}"
            placeholder="שם המקטע" aria-label="שם המקטע">
        </div>
        <input type="number" min="3" max="120" step="1" value="${seg.minutes}"
          data-seg-min="${esc(seg.id)}" aria-label="דקות">
        <div style="display:flex; gap:.2rem">
          <button type="button" data-seg-up="${esc(seg.id)}" ${i === 0 ? 'disabled' : ''} title="למעלה">↑</button>
          <button type="button" data-seg-down="${esc(seg.id)}" ${i === structState.length - 1 ? 'disabled' : ''} title="למטה">↓</button>
          <button type="button" data-seg-del="${esc(seg.id)}" title="הסרה">✕</button>
        </div>
      </div>`).join('')}

    <div class="segbar">${plan.map((p) => `
      <span style="flex:${p.minutes}; background:${SEG_COLOR[p.kind] || '#888'}"
        title="${esc(p.label)} · ${p.minutes} דקות"></span>`).join('')}</div>
    <div class="segkey">${plan.map((p) => `
      <span><i style="background:${SEG_COLOR[p.kind] || '#888'}"></i>${esc(p.label)} ${p.minutes}′</span>`).join('')}</div>`;

  $('#structTotal').textContent = `סה״כ ${total} דקות באימון של ${minutes} דקות`;
  wireStructureEditor();
}

function wireStructureEditor() {
  const update = (id, patch) => {
    structState = structState.map((x) => (x.id === id ? normalizeSegment({ ...x, ...patch }) : x));
    renderStructureEditor();
  };
  document.querySelectorAll('[data-seg-kind]').forEach((el) => {
    el.onchange = () => {
      const seg = structState.find((x) => x.id === el.dataset.segKind);
      // שינוי הסוג מעדכן גם את השם, אלא אם המשתמש כתב שם משלו
      const spec = SEGMENT_KINDS[el.value];
      const renamed = seg.label === SEGMENT_KINDS[seg.kind].label ? spec.label : seg.label;
      update(el.dataset.segKind, { kind: el.value, label: renamed, minutes: seg.minutes });
    };
  });
  document.querySelectorAll('[data-seg-label]').forEach((el) => {
    el.onchange = () => update(el.dataset.segLabel, { label: el.value });
  });
  document.querySelectorAll('[data-seg-min]').forEach((el) => {
    el.onchange = () => update(el.dataset.segMin, { minutes: +el.value });
  });
  document.querySelectorAll('[data-seg-del]').forEach((el) => {
    el.onclick = () => {
      if (structState.length <= 1) { log('אי אפשר', ['חייב להישאר מקטע אחד לפחות.']); return; }
      structState = structState.filter((x) => x.id !== el.dataset.segDel);
      renderStructureEditor();
    };
  });
  const swap = (id, delta) => {
    const i = structState.findIndex((x) => x.id === id);
    const j = i + delta;
    if (i < 0 || j < 0 || j >= structState.length) return;
    const next = structState.slice();
    [next[i], next[j]] = [next[j], next[i]];
    structState = next;
    renderStructureEditor();
  };
  document.querySelectorAll('[data-seg-up]').forEach((el) => { el.onclick = () => swap(el.dataset.segUp, -1); });
  document.querySelectorAll('[data-seg-down]').forEach((el) => { el.onclick = () => swap(el.dataset.segDown, 1); });
}

function renderInventoryEditor() {
  const el = $('#invEditor');
  if (!el) return;
  el.innerHTML = INV_GROUPS.map((g) => `
    <div class="invgroup" data-invgroup="${g.key}">
      <h4>${esc(g.label)} <span class="mono" data-invcount="${g.key}"></span></h4>
      ${g.hint ? `<p class="hint">${esc(g.hint)}</p>` : ''}
      <div class="invrows"></div>
      <div class="row invadd" style="margin-top:.35rem">
        <input class="invkg" type="number" step="0.5" min="0.5" placeholder="משקל" aria-label="משקל חדש">
        <input class="invct" type="number" min="1" value="${g.defaultCount}" placeholder="כמות" aria-label="כמות">
        <button type="button" data-invadd="${g.key}">הוסף</button>
        <button type="button" data-invfill="${g.key}">מלא סט סטנדרטי</button>
      </div>
    </div>`).join('');

  for (const g of INV_GROUPS) drawInvRows(g.key);
  document.querySelectorAll('[data-invadd]').forEach((b) => { b.onclick = () => addInvRow(b.dataset.invadd); });
  document.querySelectorAll('[data-invfill]').forEach((b) => { b.onclick = () => fillInvPreset(b.dataset.invfill); });
}

function drawInvRows(key) {
  const g = INV_GROUPS.find((x) => x.key === key);
  const wrap = document.querySelector(`[data-invgroup="${key}"] .invrows`);
  const list = invState[key];
  wrap.innerHTML = list.length
    ? list.map((row, i) => `<span class="invchip">
        <b class="mono">${row.kg}</b> ${esc(g.unit)}
        <input class="qty mono" type="number" min="1" value="${row.count}" data-invqty="${key}:${i}" aria-label="כמות">
        <button type="button" data-invdel="${key}:${i}" aria-label="הסר">✕</button>
      </span>`).join('')
    : '<span class="hint">לא הוגדר — המערכת תניח סט סטנדרטי.</span>';

  document.querySelector(`[data-invcount="${key}"]`).textContent = list.length ? `(${list.length})` : '';
  wrap.querySelectorAll('[data-invqty]').forEach((inp) => {
    inp.onchange = () => {
      const [k, idx] = inp.dataset.invqty.split(':');
      invState[k][+idx].count = Math.max(1, +inp.value || 1);
    };
  });
  wrap.querySelectorAll('[data-invdel]').forEach((btn) => {
    btn.onclick = () => {
      const [k, idx] = btn.dataset.invdel.split(':');
      invState[k].splice(+idx, 1);
      drawInvRows(k);
    };
  });
}

function addInvRow(key) {
  const group = document.querySelector(`[data-invgroup="${key}"]`);
  const kg = parseFloat(group.querySelector('.invkg').value);
  const count = Math.max(1, parseInt(group.querySelector('.invct').value, 10) || 1);
  if (!Number.isFinite(kg) || kg <= 0) { log('מלאי', 'יש להזין משקל תקין.'); return; }
  const list = invState[key];
  const existing = list.find((r) => r.kg === kg);
  if (existing) existing.count = count;
  else list.push({ kg, count, type: key === 'bars' ? (kg <= 10 ? 'ez' : 'olympic') : undefined });
  list.sort((a, b) => a.kg - b.kg);
  group.querySelector('.invkg').value = '';
  drawInvRows(key);
}

function fillInvPreset(key) {
  const g = INV_GROUPS.find((x) => x.key === key);
  invState[key] = g.preset.map((kg) => ({
    kg, count: g.defaultCount,
    type: key === 'bars' ? (kg <= 10 ? 'ez' : 'olympic') : undefined,
  }));
  drawInvRows(key);
}

/** כמה תרגילים נפתחים עם הציוד שנבחר — משוב חי בזמן המילוי. */
function studioLiveStats() {
  const equipment = [...eqState.entries()].map(([item, count]) => ({ item, count }));
  const studio = normalizeStudio({ id: 'preview', equipment });
  const trainee = normalizeTrainee({ id: 'preview', level: 'intermediate' });
  const pool = buildCandidatePool(EXERCISES, trainee, studio);
  return { exercises: pool.eligible.length, items: eqState.size };
}

function refreshStudioStats() {
  const s = studioLiveStats();
  const ex = $('#statEx'); const eq = $('#statEq');
  if (ex) ex.textContent = s.exercises;
  if (eq) eq.textContent = s.items;
}

function renderEquipmentChecklist() {
  $('#eqCats').innerHTML = EQUIPMENT_CATEGORIES.map((c) => `
    <div class="eqcat" data-cat="${c.key}">
      <h4>${esc(c.label)}</h4>
      <div class="eqgrid">
        ${c.items.map((id) => `
          <button type="button" class="eqchip" data-eq="${id}" aria-pressed="false"
                  title="${esc(EQUIPMENT_LABELS[id] || id)}">
            <span class="mark"></span>
            <span class="nm">${esc(EQUIPMENT_LABELS[id] || id)}</span>

  document.querySelectorAll('.eqchip').forEach((chip) => {

function setEquipment(id, on, count = 1) {
  const chip = document.querySelector(`.eqchip[data-eq="${id}"]`);
  if (!chip) return;
  const qty = chip.querySelector('.qty');
  chip.setAttribute('aria-pressed', String(on));
  qty.hidden = !on;
  if (on) { eqState.set(id, count); qty.value = count; } else eqState.delete(id);
  refreshStudioStats();
}

function applyPreset(key) {
  document.querySelectorAll('.eqchip').forEach((c) => setEquipment(c.dataset.eq, false));
  if (key === 'clear') return;
  const preset = EQUIPMENT_PRESETS[key];
  for (const id of preset.items) setEquipment(id, true, defaultCount(id));
  const styleSel = $('#studioForm')?.style;
  if (styleSel && EQUIPMENT_PRESETS[key]) {
    const map = { gym: 'gym', functional: 'functional', boutique: 'small_group', pilates: 'pilates', boxing: 'boxing', senior: 'senior', home: 'personal' };
    if (map[key]) styleSel.value = map[key];
  }
  log('נבחרה חבילת ציוד', `${esc(preset.label)} — ${preset.items.length} פריטים. אפשר להוסיף ולהסיר לפי מה שבאמת יש.`);
}

/** כמות התחלתית סבירה לפי סוג הפריט. */
function defaultCount(id) {
  if (['dumbbell', 'kettlebell', 'resistance_band', 'mini_band', 'mat', 'step', 'chair', 'jump_rope', 'trx'].includes(id)) return 8;
  if (['bench_flat', 'plyo_box', 'medicine_ball', 'foam_roller', 'stable_support', 'reformer'].includes(id)) return 4;
  return 1;
}

function filterEquipment(term) {
  const q = term.toLowerCase();
  document.querySelectorAll('.eqcat').forEach((cat) => {
    let visible = 0;
    cat.querySelectorAll('.eqchip').forEach((chip) => {
      const match = !q || chip.querySelector('.nm').textContent.toLowerCase().includes(q) || chip.dataset.eq.includes(q);
      chip.style.display = match ? '' : 'none';
      if (match) visible += 1;
    });
    cat.style.display = visible ? '' : 'none';
  });
}

function loadStudioIntoForm(id) {
  const raw = studioById(id);

  const setVal = (name, value) => { if (form[name] != null && value != null) form[name].value = String(value); };

  setVal('sessionMinutes', n.sessionMinutes); setVal('concurrentTrainees', n.concurrentTrainees);
  setVal('trainersOnFloor', n.trainersOnFloor); setVal('ceilingHeightCm', n.ceilingHeightCm);

  setVal('climateControlled', String(n.climateControlled));

  setVal('dumbbellMaxKg', n.dumbbellMaxKg || ''); setVal('weightIncrementKg', n.weightIncrementKg);
  setVal('contact', raw.profile?.contact || ''); setVal('notes', raw.notes || '');

  renderStructureEditor();
  for (const [item, count] of n.equipment) { if (item !== 'bodyweight') setEquipment(item, true, count); }
  if (!n.inventory.generated) {

      dumbbells: n.inventory.dumbbells, kettlebells: n.inventory.kettlebells,
      plates: n.inventory.plates, bars: n.inventory.bars, fixedBars: n.inventory.fixedBars,
